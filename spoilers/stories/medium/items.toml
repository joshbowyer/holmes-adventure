[items.letter_draft]
name = "draft letter"
aliases = ["letter", "draft", "solicitor", "fennimore"]
location = "bedroom_desk"
clue = "solicitor_letter"
description = """
A letter, unfinished and unsigned, in a large untidy hand, much blotted:

| Laurel Lodge, Weds.
| Dear Mr Fennimore, I must see you about F.G. before the wedding. I have
| been through the pass-book and the sittings book together and he has been
| keeping back the half of everything these two years, I am sure of it now.
| I have told him so to his face. As soon as I am Lady B. I mean to have the
| law of him, and Sir W. agrees I should. Will you come on Friday
"""

[items.passbook]
name = "pass-book"
aliases = ["passbook", "pass book", "bank book", "bank-book"]
location = "bedroom_desk"
clue = "passbook"
description = "Her bank pass-book, with the London and Westminster Bank. The sums paid in for November came to sixty-eight guineas, in Mr Gale's hand on the paying-in slips. Somebody, in pencil, had added the figure 140 in the margin, and underlined it twice."

[items.brushes]
name = "silver brushes"
