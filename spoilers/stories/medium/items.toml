aliases = ["roll top desk", "desk", "roll-top"]
location = "office"
scenery = true
description = "A roll-top desk, very orderly: pigeon-holes of receipts, a rack of pens, a blotter. Its owner's habits were plainly neat."

[items.letter_press]
name = "letter-press"
aliases = ["letter press", "press"]
location = "office"
