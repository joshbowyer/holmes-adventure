location = "bedroom"
scenery = true
description = "Silver-backed brushes and a great many little bottles on a dressing-table draped in rose silk."

[items.washstand]
name = "washstand"
aliases = ["basin", "jug", "marble", "wash-stand"]
location = "gale_room"
scenery = true
description = "A marble-topped washstand with jug and basin. The basin had been used and emptied, and the towel beside it was still damp."

[items.wardrobe]
name = "wardrobe"
aliases = ["clothes", "bed", "narrow bed"]
location = "gale_room"
scenery = true
description = "A plain wardrobe holding two suits and a suit of evening clothes, very well brushed; and a narrow bed, made with military neatness."

[items.gale_grate]
name = "grate"
aliases = ["ashes", "small grate", "fireplace", "fire"]
location = "gale_room"
scenery = true
container = true
description = "A small grate, full of ashes. Paper had been burnt in it, and something else that had not burnt so well."
details = [ { when = "loc:cuff:gale_grate", text = "Among the ashes, scorched brown but not burnt through, lay a curl of starched white linen." } ]

[items.cuff]
name = "cuff"
aliases = ["linen", "starched linen", "shirt-cuff", "shirt cuff", "curl"]
location = "gale_grate"
clue = "cuff"
description = "A gentleman's detachable shirt-cuff, of the kind worn with evening dress, scorched brown along one side. On the unburnt edge, the edge that would lie against the wrist, were three or four small brown spots and a smear. I am a medical man; I knew them for what they were."
take_text = "I lifted the cuff out of the ashes and put it in an envelope."

[items.playbill]
name = "playbill"
aliases = ["bill", "framed playbill", "poster", "volante", "mantel"]
location = "gale_room"
scenery = true
clue = "conjuror"
description = """
A framed playbill, yellow with age:

| THE CAMBRIDGE MUSIC HALL. Twice Nightly.
| SIGNOR VOLANTE, The Wizard of the South,
| in his Celebrated Exposure of THE SPIRIT CABINET!
| Ladies and Gentlemen shall HOLD HIS HANDS,
| and yet the Spirits shall walk!
| Assisted by MR F. GALE.
"""
