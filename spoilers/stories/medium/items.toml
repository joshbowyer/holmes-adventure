description = "The bed under the back windows had been dug over for the winter, and the night's rain had left the earth soft and smooth as a pudding. Under the shuttered window of the séance room there was not a mark on it: no footprint, no ladder-foot, not so much as a cat's paw."

[items.outside_shutters]
name = "shuttered window"
