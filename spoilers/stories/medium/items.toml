[items.cash_box]
name = "cash-box"
aliases = ["cash box", "box", "japanned cash-box"]
location = "office"
scenery = true
cant_take = "It was locked, and not mine to carry off."
description = "A japanned cash-box, locked."

[items.sittings_book]
name = "sittings ledger"
aliases = ["ledger", "sittings", "sittings book", "book", "red ledger"]
location = "office"
scenery = true
clue = "sittings_book"
description = """
A ledger in Gale's neat clerkly hand: every sitting for three years, with the sitters' names and what each had paid. The last entry read:

| Weds. 3rd Dec. Dark circle, 9 p.m. Conditions by Dr Rook.
|   Sir W. Brayfield .................... (guest)
|   Miss Brayfield ...................... (guest)
|   Dr A. Rook ......................... 2 gns.
|   Col. H. Fane ....................... 2 gns.
|   Mrs H. Quill ....................... 2 gns.
|   Mr T. Danby ........................ 5 gns.
|   F. G. (at Madame's right)
|                          Received ... 11 gns.

The receipts for November alone came, by my reckoning, to more than a hundred and forty guineas.
"""

# ================================================================ the séance room

[items.seance_table]
name = "round table"
aliases = ["table", "seance table", "séance table"]
location = "seance_room"
scenery = true
clue = "table_size"
description = "A heavy round table of mahogany on a pillar foot. I measured it with my arms: a good five feet across. A sitter's hand laid on its edge was very far from the middle of it, and further still from the other side. A cloth of green baize covered it, with a fringe that hung down a hand's breadth all round."

[items.baize]
name = "baize"
aliases = ["green baize", "cloth", "fringe", "underside", "under the table", "beneath the table", "table-top", "table top"]
location = "seance_room"
scenery = true
description = "Thick green baize, fringed, hanging down a hand's breadth below the edge of the table all round."
on_examine = [
  { once = true, text = "I went round the table on my knees, lifting the fringe and running my fingers along the underside of the table-top. On the right hand of Madame's armchair, as one would sit in it, at the place next to hers, my finger was pricked by something sharp. A long steel hatpin had been thrust up into the wood from below, under the fringe, so that only its head hung down; I could see it now, a black bead in the shadow of the baize.", effects = ["move:hatpin:seance_room"] },
]

[items.hatpin]
name = "hatpin"
aliases = ["pin", "hat-pin", "steel hatpin", "jet", "beetle", "scarab"]
location = "nowhere"
clue = "hatpin"
description = "A lady's hatpin, nine inches of fine steel, with a head of carved jet in the shape of a scarab beetle. The steel was dulled with a dry brown film for six inches of its length, and I had seen enough of such films to know it."
take_text = "I worked the hatpin out of the wood with my handkerchief and wrapped it carefully."

[items.chairs]
name = "chairs"
aliases = ["plain chairs", "seven chairs", "eight chairs", "chair"]
location = "seance_room"
scenery = true
description = "Seven plain chairs with cane seats set round the table, close enough for the sitters' hands to meet on the baize, and the great carved armchair at the head."

[items.armchair]
name = "carved armchair"
aliases = ["great armchair", "armchair", "madame's armchair", "medium's chair", "her chair"]
location = "seance_room"
scenery = true
description = "A great armchair of carved oak, very like a bishop's throne, with its back to the curtain of the cabinet. It was here, I gathered, that Madame sat, and here that she had died. There was a small stain on the right arm of it, nearest the next place."

[items.cabinet_curtain]
name = "black curtain"
aliases = ["curtain", "velvet curtain", "black velvet", "velvet"]
location = "seance_room"
scenery = true
description = "A heavy curtain of black velvet hung across an alcove behind Madame's chair. The alcove beyond it was what the spiritualists call the cabinet."

[items.trumpet]
name = "trumpet"
aliases = ["tin trumpet", "spirit trumpet", "cone", "speaking trumpet"]
location = "seance_room"
scenery = true
clue = "trumpet"
description = "A cone of tin some two feet long, painted round with bands of some luminous preparation which shows pale green in the dark. Its rim was freshly dented where it had fallen on the table. On the narrow end, where it would be held, the luminous paint was smudged and rubbed with the marks of fingers."

[items.musical_box]
name = "musical box"
aliases = ["music box", "box", "stand", "musical-box"]
location = "seance_room"
scenery = true
description = "A large Swiss musical box in a rosewood case, on a stand of its own by the west wall. It plays, the card in its lid informed me, eight airs, of which the fourth is The Last Rose of Summer. Its key was in it."

[items.seance_fireplace]
name = "fireplace"
aliases = ["fire", "grate", "hearth"]
location = "seance_room"
scenery = true
description = "A small fireplace in the south-west corner, the fire long out. A fire would have given light, and a dark circle wants none."

[items.shutters]
name = "shutters"
aliases = ["window", "tall window", "wooden shutters", "screws"]
location = "seance_room"
scenery = true
clue = "shutters"
description = "Heavy wooden shutters across the tall window, and through the bar that held them, two new brass screws, driven well home. I learned afterwards that Dr Rook carries a screwdriver to every sitting for this purpose. Whatever had come into this room last night had not come by the window."

[items.seals]
name = "paper seals"
aliases = ["seals", "seal", "paper", "slips", "wax", "door frame", "frame"]
location = "seance_room"
scenery = true
clue = "seals"
description = "Two slips of paper had been pasted across the crack of the door, top and bottom, each sealed with red wax and signed 'A.R., 9 p.m.' They had been torn clean across where the door was opened at last, and in no other way."

# ================================================================ the cabinet

[items.body]
name = "body"
aliases = ["madame peake", "mrs peake", "madame", "corpse", "sheet", "dead woman", "sofa", "narrow sofa"]
location = "cabinet"
scenery = true
cant_take = "That was for the police and the undertaker."
description = "I turned back the sheet. Madame Peake had been a handsome, heavy, dark woman, and death had not yet taken that from her. She lay in a gown of black silk, with a long black silk skirt, and her hands had been folded on her breast. On the bodice, below the left breast, there was a small dark stain, and in the middle of it the wound."

[items.wound]
name = "wound"
aliases = ["stain", "bodice", "puncture", "breast"]
location = "cabinet"
scenery = true
clue = "wound"
description = "I unfastened the bodice. The wound was a small round puncture a little below the left breast, hardly bigger than a pea, with very little blood outside: the bleeding had all been within. A probe, had I had one, would hardly have been needed; feeling the course of it I was sure. It ran not straight in, but from her right towards her left and a little backward, driven up into the heart from a hand on her right side, and close."

[items.hands]
name = "hands"
aliases = ["her hands", "hand", "fingers", "left hand", "right hand", "ring", "fingertips"]
location = "cabinet"
scenery = true
clue = "hands"
description = "I took her hands one after the other. On the third finger of the left was a heavy wedding ring, worn thin; nothing on the right. The curtain had fallen behind me and the alcove was very dim, and as I turned the right hand over I saw that the tips of its first finger and thumb gave off a faint greenish glow, like the ghost of a light. The left hand showed nothing of the kind."

[items.skirt]
name = "skirt"
aliases = ["black skirt", "silk skirt", "gown", "pocket", "placket", "black silk"]
location = "cabinet"
scenery = true
description = "A full skirt of heavy black silk, much gathered."
on_examine = [
  { once = true, text = "Running my hand down the folds of it, I found that there was a deep pocket hidden in the placket, where no dressmaker puts one, and in it something long and hard. I drew it out and laid it on the sofa beside her: a slender tube of black japanned metal.", effects = ["move:reaching_rod:cabinet"] },
]

[items.reaching_rod]
name = "black tube"
aliases = ["tube", "rod", "reaching rod", "japanned tube", "metal tube", "glove"]
location = "nowhere"
clue = "reaching_rod"
description = "A slender tube of black japanned metal about a foot long, which drew out, joint after joint, like a telescope, until it was nearly five feet in length. At its tip was fixed a little kid glove, a child's, stuffed hard with cotton-wool, and very cold to the touch. The grip at the other end was smeared with the same green luminous paint as the trumpet, and shone faintly in the dimness."
take_text = "I closed the tube up again and put it in my pocket."

[items.velvet]
name = "black velvet"
aliases = ["hangings", "walls", "alcove walls"]
location = "cabinet"
scenery = true
description = "Black velvet on every wall, rubbed and shabby where shoulders had leaned against it."

