[case]
id = "medium"
title = "The Medium's Last Sitting"
year = 1890
order = 40
start = "street"
coin_name = "threepenny bit"
coin_plural = "threepenny bits"
hint_intro = "I laid a threepenny bit on the arm of Holmes's chair. He turned it over with one long finger, as if it might have a spirit message on the back, and spoke."
hint_none = "\"You have it all, Watson,\" said Holmes. \"Set out the SEATING, and then ACCUSE.\""
hint_broke = "I had not a threepenny bit about me. \"Then go and find one,\" said Holmes. \"The sitters in this house drop them like autumn leaves.\""
intro = """
It was on a raw morning in the December of 1890, not long after my marriage, when I saw less of my friend Sherlock Holmes than I could have wished, that a telegram was brought to me at breakfast:

| COME AT ONCE TO LAUREL LODGE CLIFTON HILL ST JOHNS WOOD.
| A MEDIUM HAS BEEN MURDERED BY THE SPIRITS IN A ROOM FULL OF
| WITNESSES ALL HOLDING HANDS. BRING YOUR STETHOSCOPE AND
| YOUR SCEPTICISM. HOLMES.

My wife, who had read it over my shoulder, laughed and sent me off; and within the hour my cab set me down in Clifton Hill.

I knew the name of Madame Peake, as all London did that winter: the medium of the season, at whose dark circles a spirit child called Little Wren played musical boxes and floated trumpets and laid her little cold hands upon the faces of baronets. Last night, it seemed, in the middle of such a sitting, with the door sealed and every sitter's hands joined, somebody had driven a blade into her heart.
"""
intro_note = "[In this case you must work out who sat where. SEATING shows the table; SEAT <name> AT <number> places a sitter. Threepenny bits found while exploring buy hints from Holmes with HINT.]"

# ================================================================ clues

[clues.found]
text = "Madame Peake, the medium, was stabbed to death last night in the middle of a dark sitting at Laurel Lodge, with the door sealed and the sitters' hands all joined."

[clues.wound]
text = "The wound: a small round puncture under the left breast. It runs from her right towards her left and a little backward: struck from her right side, by someone close."

[clues.surgeon]
text = "Bradstreet: a thin, round, sharp blade, seven or eight inches, straight into the heart; death within a minute, with one cry. Every sitter was searched to the skin, and the room too. No weapon was found."

[clues.hands]
text = "Her hands: a wedding ring on the left. The tips of the first finger and thumb of the RIGHT hand glow faintly green in the dark, like the luminous paint; the left shows nothing."

[clues.reaching_rod]
text = "Hidden in a pocket in her skirt: a telescopic tube that draws out to nearly five feet, with a child's kid glove, stuffed and cold, on its tip. Its grip is smeared with luminous paint."

[clues.trumpet]
text = "The spirit trumpet is painted with luminous bands. Its narrow end, where it would be held, is smudged with the marks of fingers."

[clues.table_size]
text = "The séance table is a good five feet across. No sitter could reach the far side of it with his hand."

[clues.hatpin]
text = "A nine-inch steel hatpin with a jet scarab head, stained with blood for six inches, thrust up into the underside of the table under the baize, at the place on Madame's right."

[clues.hat_pin_missing]
text = "Miss Brayfield came with a pair of jet beetle hatpins in her hat, and left her hat on the hall-stand during the sitting. When she left, one pin was gone."

[clues.hatpin_owner]
text = "Miss Brayfield knows the bloody hatpin at once: it is the missing one of her pair, taken from her hat in the hall."

[clues.seals]
text = "Dr Rook sealed the door with signed paper slips at 9:00 and tore them himself at 10:10. Nobody came in or went out."

[clues.shutters]
text = "The shutters of the séance room were screwed shut from inside with new brass screws."

[clues.window_bed]
text = "The soft flower-bed under the séance room window, outside, is unmarked."

[clues.effie_door]
text = "Effie, the maid, sat on the hall chair outside the séance room door from 9:00 until she brought the lamp at 10:10. Nobody passed her."

[clues.gale_hall]
text = "Effie: after the sitters went in, Mr Gale came out alone for a minute, to fetch the key of the musical box from the hall, where the ladies' hats hung on the stand."

[clues.quarrel]
text = "Effie heard Madame and Gale quarrel in the office yesterday afternoon: \"You'll answer for every penny of it to a magistrate, Ferdinand, the day after I'm married.\""

[clues.gale_upstairs]
text = "Effie: when the lamp came, Gale ran straight upstairs, \"for brandy for Sir Walter\", and was gone five minutes."

[clues.gale_fire]
text = "Mrs Pruett: Gale rang for coals for a fire in his room after half past ten last night. He never has a fire."

[clues.cuff]
text = "In the grate of Gale's room: a detachable evening shirt-cuff, scorched but not burnt through, spotted with blood on the edge that lies against the wrist."

[clues.conjuror]
text = "A playbill in Gale's room: he was assistant to Signor Volante, a music-hall conjuror whose act exposed the tricks of the spirit cabinet. \"Ladies and Gentlemen shall HOLD HIS HANDS, and yet the Spirits shall walk!\""

[clues.sittings_book]
text = "The sittings ledger: last night's circle was Sir W. Brayfield, Miss Brayfield, Dr Rook, Col. Fane, Mrs Quill, Mr Danby and F. Gale (at Madame's right), with Madame: eight. Receipts for November: over 140 guineas."

[clues.passbook]
text = "Madame's pass-book: only 68 guineas paid into the bank in November, by Gale. Someone has pencilled 140 in the margin and underlined it."

[clues.solicitor_letter]
text = "Madame's unfinished letter to her solicitor: Gale has been \"keeping back the half of everything these two years\"; she has told him so; once married she means \"to have the law of him\"."

[clues.engagement]
text = "Sir Walter: he was to marry Madame in January. She would give up public sittings, and meant to prosecute Gale for dishonesty."

[clues.libel]
text = "Madame was suing Dr Rook for libel (he had called her a cheat in print). The case was to be heard in January."

[clues.rook_tricks]
text = "Dr Rook: a medium frees a hand by substitution (both neighbours touching one hand of hers) or by a confederate neighbour who holds nothing. He kept her ring under his thumb against the first; Gale has always had her right hand."

[clues.rook_story]
text = "Dr Rook (on Madame's left; Miss Brayfield on his left): held her LEFT hand in his right all evening, her ring under his thumb. It never left him, and after she cried out it grew still and cold."

[clues.rook_realises]
text = "Shown the telescopic rod, Dr Rook: \"Then her right hand was free the whole evening, for her left never left mine. And Gale swore he held her right. Then he held nothing at all.\""

[clues.gale_story]
text = "Gale (on Madame's right): says his left hand held her RIGHT hand, and his right hand held Mrs Quill's left, all evening; she cried out at the end and gripped his hand."

[clues.quill_story]
text = "Mrs Quill (by the musical box, between Mr Danby and Mr Gale): held Gale's right hand, with its signet ring, all evening, and Danby's left. At the end Gale said, \"She's gone very deep, don't break the circle.\""

[clues.danby_story]
text = "Mr Danby (back to the fire, between Sir Walter and Mrs Quill): both his hands held all evening. A little cold hand touched the back of his hand on the table."

[clues.walter_story]
text = "Sir Walter (opposite Madame; Colonel Fane on his right, Danby on his left): both hands held. A little cold hand touched his cheek, twice."

[clues.fane_story]
text = "Colonel Fane (back to the window; Miss Brayfield on his right, Sir Walter on his left): both hands held. Something tapped the crown of his head, twice, cold."

[clues.cecily_story]
text = "Miss Brayfield (between Dr Rook and the Colonel, door at her back): held Rook's left hand, with his seal ring, and the Colonel's right, all evening. Nothing touched her."

