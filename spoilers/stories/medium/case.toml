# ================================================================ endings

[endings.solved]
title = "The Hand That Held Nothing"
text = """
Holmes heard me out with his eyes shut, and when I had done he opened them and laughed softly.

"Capital, Watson. Seven honest people and one rogue, and every one of the seven told you the exact truth, and the rogue told you the truth too, all but one word of it. 'I held her right hand.' He never had, not once in three years: that was the whole of their business together. Her right hand was free to wave her trumpet and her little glove on its stick, and so his left was free to do what it liked, and nobody in the world could say so but her. Last night she could not say so, because last night his left hand had a hatpin in it."

We went across the hall together. Gale was at his desk. He heard Holmes to the end with that clever, expressionless face of his, and when Holmes laid the tube on the blotter, and the hatpin beside it, and the scorched cuff beside that, he looked at them for some time.

"She would have put me in the dock," he said at last, quite simply. "After all I made of her. I taught her every trick she had." Then Bradstreet put his hand on his shoulder.

Dr Rook's report on the Laurel Lodge sitting, when at last he finished it, ran to forty pages and was very much admired; but I noticed that he gave Holmes no credit in it, and that the word 'confederate' appeared on every page.

"Spiritualism will survive it, Watson," said Holmes, as we walked down Clifton Hill. "It has survived worse exposures than this. Men will believe that the dead hold their hands in the dark, so long as the dark lasts. It is the living hands you must watch."
"""

[endings.tangle]
title = "Hands Across the Table"
text = """
Holmes ran his eye round my plan of the table, and shook his head.

"My dear Watson, you have put people in places they have told you plainly they did not sit in. Look: on your showing, a man holds the hand of someone who was the whole width of the table from him. Every word of evidence in this case is about whose hand was next to whose. Until the table is right, the hands are wrong, and until the hands are right, everything is wrong."

I had already given my opinion to Bradstreet, unluckily, and Bradstreet, who liked it, acted on it before lunch. It took a magistrate and a good deal of unpleasantness to undo.

"Go back, Watson," said Holmes. "Ask each of them where he sat, and on which side of him his neighbours were. Then try again."
"""

[endings.empty_chairs]
title = "Empty Chairs"
text = """
Holmes looked at my plan of the table for some time.

"It is very fair as far as it goes, Watson," said he. "But there are chairs on it with nobody in them, and eight people sat at that table last night. The answer to this case is a matter of who sat next to whom. You cannot leave a gap in the circle and hope the murderer was not sitting in it."

I said that I was sure of my man. Holmes only shrugged, and Bradstreet, who was sure of a different one, went to make his arrest. By the time the matter was put right, the man who had done it had had a week to think, and he used it.

"Go back, Watson," said Holmes. "Every sitter, every place. Then the man."
"""

[endings.nobody]
title = "The Spirits Are Acquitted"
text = """
"No one in the circle?" Holmes raised his eyebrows. "Then you believe in Little Wren after all, Watson, and she carries a blade. The coroner's jury will be delighted; I gather two of them are spiritualists."

So they were, and they brought it in wilful murder by persons unknown, with a rider about the dangers of dark circles that was printed in every newspaper in London. The murderer read it, I have no doubt, with great satisfaction.
"""

[endings.rook]
title = "The Investigator"
text = """
"Rook?" said Holmes. "He had her left hand, Watson, with her ring under his thumb the whole evening, and Miss Brayfield had his other. And the blade went in from her right side. Rook disliked her, and she was suing him, and he will tell anyone who asks that he is glad she cannot now. That is the conduct of a man with nothing to hide. Murderers are commonly more agreeable."

But Bradstreet had heard me, and the newspapers had Rook's name by the evening: THE SCEPTIC AND THE SPIRIT. He was never charged, but his libel was proved against him after all, in the court of public opinion. The real murderer, meanwhile, went quietly about his business.
"""

[endings.walter]
title = "The Bridegroom"
text = """
"Sir Walter?" Holmes looked at me with something like pity. "He sat the whole width of a five-foot table from her, Watson, with an old soldier holding one of his hands and a shipping clerk the other, and a dead child's glove stroking his cheek. He was the one man in that room who wanted her alive more than anything in the world."

I have seldom regretted anything so much. The old man heard of it before I could unsay it, and it finished what the night had begun; he went down to his place in Hampshire and did not come up again. The man who had killed her stayed in London.
"""

[endings.cecily]
title = "The Daughter's Hatpin"
text = """
"Miss Brayfield?" said Holmes. "Because it was her hatpin? My dear Watson, she left it on the hall-stand in her hat, as anyone might, and she sat two places away from Madame with Dr Rook holding one of her hands and the Colonel the other. Somebody took that pin precisely in order that you should say what you have just said."

Bradstreet arrested her that afternoon, all the same, on the strength of it, and her father had to find bail. The murderer, I think, slept better that night than he had for a week.
"""

[endings.others]
title = "Across the Table"
text = """
Holmes shook his head before I had finished.

"Look at your own plan of the table, Watson. That sitter was nowhere near her, with a hand held on each side all evening, and a table five feet across in the way. Whoever killed Madame Peake sat close beside her, on her right, and had a hand free. You have chosen one of the few people in the room who could not possibly have done it."

It was some time before I could look that unfortunate person in the face again; and in the meanwhile the guilty one had time to tidy his room.
"""

[endings.effie]
title = "The Maid at the Door"
text = """
"The maid?" said Holmes. "She sat outside a sealed door, Watson, and the seals were whole when Rook tore them. To have done it she would have had to pass through two inches of oak and the paper of a man who has exposed thirty-one mediums. She is the one person in this business who never set foot in that room until the lamp was lit."

The poor girl was given notice by the solicitors before the week was out, on the strength of my suspicion, and I paid her wages myself until she found a place. It was the least I could do; it was not enough.
"""

[endings.escape]
title = "The Right Man, the Wrong Case"
text = """
Holmes heard me out, and then shook his head slowly.

"You have the right man, Watson, and you would lose him at the trial. Half your account is wrong, and the half that is wrong is just the half his counsel will choose to talk about. A jury that has seen one leg of a case knocked away will not wait to see whether it stands on the other three."

He was right. Our man listened to Bradstreet with a polite smile, and sent for a solicitor who listened with a less polite one; and by the time he came up before the magistrates there was an answer for everything I had got wrong. He walked out of the court a free man, and opened a séance room of his own in Bayswater the following spring.
"""

