# ================================================================ endings

[endings.solved]
title = "The Fist at the Far End"
text = """
Holmes heard me to the end without a word, and then he took the old coil from my hand and laid it on the table beside Wednesday's roll, the two passages side by side, and ran his finger along the marks.

"Dah-dit, dah-dit," said he softly. "There she is, Watson, on both of them, two years apart. A careful woman: she lengthened her dashes and widened her gaps until she sent as heavily as Pascoe himself, for she had listened to him on her sounder every day for four years. But a fault you do not know you have is the one fault you cannot hide. She never learned that she splits her C's, because there was never an inker at Porthkellis to show her.

"Everything else was true, you see. Pascoe was paid to leave the room empty at nine, and he did; Tagg came and found it empty, and cold, and sent his lie, and went away. Only Pascoe was not at the lookout, earning his money. He had gone down the path at twenty to seven with his lamp, as he went on the first Wednesday of every month, to be paid his ten shillings at the stile, where neither the station nor the lookout can see. And she was waiting for him, in her tea hour, with a stone. Then she went home and sat down at her key and made him talk to her for half an hour, and told the whole county through his mouth that he feared the London man. It was very nearly perfect. The tape can't tell you which end sent a signal, Watson. But it can tell you whose hand."

We went down to Porthkellis together. Miss Nance was at her sounder, and when she saw the two strips of tape in Holmes's hand she took off her sleeve-protectors, folded them, and laid them on the counter, and stood up.

"He'd have told Will," she said. "That's all. He'd have shown Will the tape, and Will would have known I was asleep upstairs while Dick drowned. I couldn't pay him any more, Mr Holmes. I couldn't bear him any more." And that was all she ever said, then or at Bodmin.

Mr Julius Tagg went to prison for eighteen months for his part in the affair, and Mr Leete of Birchin Lane for two years; the Corisande's name-board is on the wall of the Room at Lloyd's to this day. Will Rowse visited Loveday Nance every week until the end, which was not, in the event, upon the scaffold; the jury's recommendation to mercy was heeded, and when I last heard of her she was keeping the books in a prison laundry. I am told that she writes a very good hand.

"Telegraph, Watson," said Holmes, in the fly, "is the most honest witness I know. It records everything and understands nothing. It is the people who read it who tell the lies."
"""

[endings.crossed]
title = "Crossed Wires"
text = """
Holmes ran his eye down my list of passages and the names I had set against them, and shook his head.

"You have put a passage to a hand that did not send it, Watson. Look at the marks again: the length of the dashes, the gaps between the letters, and above all the little faults. Every word of this case was spoken on that wire, and if you cannot say who spoke it, you cannot say anything at all."

Trevail, who had been waiting at the door, took my opinion to the magistrates all the same, for it agreed in the main with his own, and it was a long and unpleasant business to unsay it.

"Back to the tapes, Watson," said Holmes. "Mark by mark."
"""

[endings.loose_ends]
title = "Loose Ends"
text = """
Holmes looked at my list for a long moment.

"It is good as far as it goes, Watson," said he. "But there are passages on that roll which you have not accounted for, or have never found. Every one of them was keyed by somebody's hand on Wednesday evening, and the one you have left out is very likely the one that hangs the case. A telegraph clerk does not leave half a message on the line, and nor should you."

I said I was sure of my answer. Holmes said nothing, and Trevail went off to make his arrest on the strength of it. By the time the matter was put right, the case was in such a tangle that the right person was never brought to trial for it at all.

"Every passage, Watson," said Holmes. "Then the hand."
"""

[endings.nobody]
title = "A Fall in the Dark"
text = """
"He fell?" Holmes raised his eyebrows. "Then it was a very remarkable fall, Watson, that hit him on the back of the head, turned out his coat pocket and carried his pocket-book away. And after he was dead, his station went on telegraphing without him. Do you suppose the stile did that too?"

The coroner's jury at Helston, who had not Holmes to put it to them, brought in accidental death with a rider about the danger of the cliff path at night, and the parish put a rail along it. It is a very good rail. Nobody was ever asked to answer for Amos Pascoe.
"""

[endings.tagg]
title = "The London Man"
text = """
Holmes heard me out, and then said only: "You have proved that Mr Tagg sent a lying telegram, Watson. You have proved it very thoroughly; I congratulate you. Now prove to me that he killed a man, and tell me how he did it while he was eating his dinner."

But I had said it in Trevail's hearing, and Trevail wanted nothing better. Tagg was taken to Bodmin that night. He was a liar and a cheat, and when he stood up at the Assizes the jury could see it in his face; and the prosecution had his boot-prints, and his note, and his motive, and the dead man's own words on the wire, that he was expecting a London man at nine and did not care for him. There was a witness from Porthkellis who gave that evidence very clearly, and very quietly, and was much admired for it.

"The wire is your witness, Watson," said Holmes, as we left the court, "and it lied to you. Whose hand was on the key when it lied? You never asked."
"""

[endings.kitto]
title = "The Lookout"
text = """
"From the lookout?" said Holmes. "Watson, the watch log is signed by two men for the whole of the first part of that evening, and the Lloyd's agent is one of them, and the clerk's own lamp tells you when he died. You have chosen a man with an alibi written down in ink and countersigned."

Trevail did not take my view, to my relief; but the Lloyd's committee heard of it, and there was an inquiry into the conduct of the station, and it was a twelvemonth before the head of Polventon recovered its good name. The person who killed Amos Pascoe was not troubled by it at all.
"""

[endings.rowse]
title = "The Coxswain"
text = """
"Rowse?" Holmes looked at me with something like pity. "He was drilling his crew by lantern-light from six until eight, Watson, with a dozen men to swear to it, and he has never sent a word on a telegraph wire in his life. You have chosen him because he has a grief, and grief is not evidence."

It got about, as such things do in a village, and Rowse took it very quietly; but I could never afterwards go into the Fisherman's Arms without the room falling silent. The real culprit took a good deal of comfort from it, I have no doubt.
"""

[endings.widow]
title = "The Widow"
text = """
"Mrs Pascoe," said Holmes, "was in Meneage Street in Helston from Wednesday afternoon until Thursday, with her sister and half the street to say so. She could no more have keyed a message than flown, and she could not have been on the cliff path at any hour of that evening. You have accused the one person who has lost most by this."

I wrote to her afterwards, to say how sorry I was. She did not answer the letter, and I cannot say I blamed her.
"""

[endings.lineman]
title = "The Lineman"
text = """
"Bolitho?" said Holmes. "Because he knows the wire? So do half a dozen people in this business, Watson. He was sent out from Helston on Thursday morning, after it was all over, and he has told you the one thing you most needed to know. It is a poor return for a lesson to hang the teacher."

Fortunately Trevail laughed at me, and Bolitho never heard of it. But the person who did it heard me give my opinion, and slept the better for it.
"""

[endings.escape]
title = "The Right Hand, the Wrong Reasons"
text = """
Holmes heard me out, and then shook his head slowly.

"You have the right person, Watson, and you would lose the case at the Assizes. Half your account is wrong, and the half that is wrong is exactly the half that a clever counsel will choose to talk about. When did he die, and why? Until you can say, you cannot answer the question every juryman will ask: how could anyone have killed a man who was talking on the wire at twenty to eight?"

He was right. The case was put to the magistrates as I had put it to Holmes, and it fell to pieces in an afternoon. The prisoner walked out of the court with everyone's sympathy, and I was the villain of the piece in two counties.
"""

