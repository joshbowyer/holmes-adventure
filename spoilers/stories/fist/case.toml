[case]
id = "fist"
title = "The Operator's Fist"
year = 1887
order = 50
start = "lane"
coin_name = "farthing"
coin_plural = "farthings"
hint_intro = "I laid a farthing on the table by the inker. Holmes regarded it as gravely as if it had been a sovereign, and spoke without lifting his eyes from the tape."
hint_none = "\"You have it all now, Watson,\" said Holmes. \"Account for every passage on the TAPES with ATTRIBUTE, and then ACCUSE.\""
hint_broke = "I had not a farthing about me. \"Then find one,\" said Holmes. \"The Cornish leave them about for the piskies.\""
intro = """
It was on a Thursday morning in the November of 1887 that a thin, anxious gentleman in a silk hat was shown up to our rooms in Baker Street, and introduced himself as Mr Rendle, of the Intelligence Department at Lloyd's.

"I have come about a lie, Mr Holmes," said he, "and a murder. On Wednesday evening, at five minutes past nine, our signal station at Polventon Head, on the Lizard coast, telegraphed that the barque Corisande, long overdue, had passed the Head, all well. This morning the overdue market in the Room went mad; men have been ruined and others made, between ten o'clock and noon. And at noon we learned two things. That no one else has seen the Corisande. And that the station's telegraph clerk, a man named Pascoe, was found dead on Wednesday night on the cliff path below the station, with his head broken; and that the county surgeon says he died a good two hours before that message was sent."

Holmes, who had been lying back in his chair with his eyes closed, opened them.

"The station went on talking after its clerk was dead," said he. "That is very pretty. Watson, there is a night mail from Paddington."

So it was that at about nine on the Friday morning, stiff and unshaven after a night in the train and two hours in a fly from Helston, I climbed down in the lane on Polventon Head. Holmes had gone in through the station gate before the wheels had stopped.
"""
intro_note = "[In this case you must read telegraph tape. TAPES lists what you hold, TAPE <letter> shows the marks, DECODE <letter> AS <words> checks a reading, and ATTRIBUTE <letter> TO <name> says who sent it. Farthings found while exploring buy hints from Holmes with HINT.]"

# ================================================================ clues

[clues.found]
text = "Amos Pascoe, telegraph clerk at the Lloyd's station on Polventon Head, was found dead on the cliff path on Wednesday night, 2 November. At 9:05 that night his station reported the overdue barque Corisande passed, all well; nobody else has seen her. The surgeon puts his death about two hours before that message."

[clues.single_wire]
text = "Bolitho, the lineman: one wire runs Helston to Porthkellis to the Head. The station's inker writes down every signal on it, whoever sends it; the tape cannot tell you which end a signal was keyed at. Only the fist can."

[clues.line_sound]
text = "Bolitho: the line tested sound end to end, and was sound all Wednesday."

[clues.fists]
text = "Bolitho: every clerk has his fist. Pascoe sent heavy, with long dashes and wide gaps. Some clip their dashes, London fashion. Some split the letter C, so that it reads as two N's, and never know they do it."

[clues.sounder_office]
text = "Porthkellis post office is a sounder office: nothing written by machine, only taken down by ear. Miss Nance keeps it."

[clues.boot_prints]
text = "On the instrument-house step: the prints of a narrow town boot with a pointed toe, going in and coming out."

[clues.evening_roll]
text = "Wednesday's roll from the station inker. Pascoe pencilled the time against every message all day; the last is 6:30, the evening report. Several passages follow it with no time against them."

[clues.code_card]
text = "I have copied the Morse alphabet from the card in the instrument room (CODEBOOK)."

[clues.day_book]
text = "The day book: every message on Wednesday entered with its time in Pascoe's hand, and last of all, '6:30 p.m. Evening report. Nil since noon. Wind NW, clear.' Nothing after it. Lloyd's had wired at 12:05 to keep a sharp lookout for the Corisande."

[clues.wound]
text = "The body: one heavy blow to the back of the skull from something round and hard, struck from behind, close. The inside pocket of his coat turned half out."

[clues.surgeon]
text = "Inspector Trevail: the surgeon puts death between six and eight in the evening, nearer seven. The weapon, a stone or the like, is not found."

[clues.lamp_dry]
text = "Pascoe's bull's-eye lantern, found beside him: the reservoir dry and the wick burnt down to the brass. It burned until there was nothing left."

[clues.lamp_hours]
text = "Kitto fills the lamps at six. Pascoe's bull's-eye burns about three hours on a filling, and he never lit it indoors, only to go out. When Kitto found him at about a quarter to ten it was out, cold and dry."

[clues.tagg_note]
text = "On the dead man, folded round four five-pound notes, a note signed J.T.: 'Be up at the lookout at nine and stay till the half hour. The other twenty when it is through.'"

[clues.nance_report]
text = "Trevail: Miss Nance, at Porthkellis, talked with Pascoe on the wire from 7:15 to 7:40, and he told her he was expecting a London man at nine and didn't care for him. So he was alive at twenty to eight."

[clues.police_case]
text = "Trevail's case against Tagg: his boot-prints at the station at nine; out of the inn from 8:30 to 9:30; a motive worth thousands; once a telegraph clerk; and his note in the dead man's pocket."

[clues.room_cold]
text = "Kitto, at 9:40 on Wednesday: the instrument room dark and cold as a vault, the stove out, and Pascoe gone."

[clues.door_unlocked]
text = "Kitto: Pascoe never left the instrument-room door unlocked, even for a minute. On Wednesday night it was unlocked."

[clues.no_ship]
text = "Kitto, at the glass from 6:15 till 9:40 on a clear night: no vessel passed after dark, at 8:50 or at any time."

[clues.tagg_visit]
text = "Kitto: Tagg was in the instrument room with Pascoe for a quarter of an hour, door shut, about three on Wednesday afternoon. On Monday he showed off on Kitto's practice set."

[clues.watch_log]
text = "The watch log: Captain Hext with Kitto at the lookout from 6:15 to 7:45 on Wednesday, signed by both; Kitto alone from then until 9:40."

[clues.practice_tape]
text = "The practice strip from the lookout: one passage of Kitto's, marked J.K., and one of Tagg's, marked 'Mr Tagg's, Monday. London style.'"

[clues.overdue]
text = "Captain Hext: a false 'passed, all well' on an overdue ship makes her reinsurance rate fall to nothing. A man who knew she was lost could buy cover cheap that would pay in full."

[clues.corisande_overdue]
text = "The overdue board: the Corisande, barque, from San Francisco, 60 guineas; the 60 has been rubbed out and rewritten over a 3."

[clues.false_report]
text = "Captain Hext: at 9:05 on Wednesday the station reported the Corisande passed at 8:50, bound east, all well. Nobody on the head saw her."

[clues.tapes_rule]
text = "Captain Hext: the rule is that tapes are kept three months and then destroyed, and Pascoe burned his old rolls regular as the calendar."

[clues.battery_habit]
text = "Mrs Pascoe: these two years her husband spent his evenings in the battery room more than the cells could want."

[clues.money_lately]
text = "Mrs Pascoe: lately Pascoe had money beyond his wages: 'a debt being paid him, a little at a time', and more to come."

[clues.pocket_book]
text = "Mrs Pascoe: his brown pocket-book, always in his inside coat pocket, is gone; but twenty pounds was left in his waistcoat."

[clues.nance_account]
text = "Miss Nance: she called the Head at 7:15 to ask about the night mail; Pascoe answered; he was expecting a London man at nine and didn't care for him; they said good night about 7:40."

[clues.mother_saw]
text = "Mrs Nance: she was at the chapel class meeting from 6:30 to 7:30, and at 7:35 came in and saw Loveday at the sounder, 'talking to Mr Pascoe'."

[clues.tea_alone]
text = "Mrs Nance: the office shuts from six to seven for tea; Loveday has hers upstairs alone. Loveday has been the only telegraph clerk at Porthkellis since the spring of 1883."

[clues.office_hours]
text = "The board at Porthkellis post office: open 8 a.m. to 8 p.m., closed for meals from 1 to 2 and from 6 to 7 p.m."

[clues.tagg_dinner]
text = "Hosken: Tagg dined in the coffee room from six until half past eight on Wednesday with two other guests, and never left the table."

[clues.tagg_out]
text = "Hosken: Tagg went out at half past eight and came back at half past nine, muddy to the knees, and called for brandy."

[clues.tagg_lies]
text = "Tagg says he only took a turn on the quay and up the road on Wednesday evening, and hardly knew Pascoe."

[clues.tagg_confesses]
text = "Tagg, shown his note: he paid Pascoe twenty pounds to be at the lookout at nine and leave him the room. At nine the room was unlocked, empty, dark and cold, the stove out, 'as if nobody had been in it for hours'. He lit the desk lamp, sent the false report at 9:05, and went down by the road. He never saw Pascoe."

[clues.leete_letter]
text = "Leete to Tagg: wreckage with the Corisande's name has been picked up off Ushant, and the news is being kept quiet. 'Get your word from the Head' and wire, and Leete will buy cheap."

[clues.tagg_wire]
text = "Tagg's telegram, handed in at Porthkellis post office on Tuesday: 'WILL WIRE NEWS FROM HEAD NINE WEDNESDAY.'"

[clues.tagg_boots]
text = "Tagg's town boots: narrow, pointed, caked with the red mud of the lane. They would fit the prints on the step."

[clues.gleaner]
text = "Will Rowse: in November 1885 the schooner Gleaner went on Polventon Ledges about eleven at night. The Head sent for the lifeboat by wire, but the word did not come till after midnight. Three were drowned, his brother Dick among them. The inquiry found the line was down in the gale."

[clues.gleaner_board]
text = "The lifeboat board: 19 November 1885, the Gleaner, launched at 12:40 a.m.; three lost."

[clues.loveday_low]
text = "Will Rowse: Loveday was on duty the night of the Gleaner. She has been low and nervy this year, putting the wedding off and then not putting it off."

[clues.blackmail_book]
text = "Hidden in a dummy cell in the battery room: Pascoe's little black book. 'L.N.' paid him ten shillings on the first Wednesday of every month from December 1885 to October 1887; 'J.K.' paid small sums; 'J.T.' paid £20 on 2 November. On 1 November: 'Told L.N. a sovereign from Dec., or W.R. shall have the tape.'"

[clues.wreck_tape]
text = "Hidden in the same cell: an old coil of tape, labelled '19 Nov 1885. Night'. Pascoe's call at 11:02; his pencilled note 'HN calling PK 11:40, no answer from PK'; and a reply pencilled '12:12 PK'."

[clues.split_c]
text = "Reading the evening roll mark by mark: in the passage that names the Corisande, each C is broken in two, so that CORISANDE reads NNORISANDE. Whoever sent that passage splits his C's."

[clues.wreck_reply]
text = "The 1885 coil, decoded: at 12:12 Porthkellis answered the Head at last, 'SORRY CALLED AWAY CALLING COXSWAIN NOW'. That was seventy minutes after the first call, and Helston had been working the line at 11:40, so the line was never down."

