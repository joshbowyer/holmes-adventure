[items.leete_letter]
name = "letter"
aliases = ["leete's letter", "london letter"]
location = "writing_case"
clue = "leete_letter"
description = """
A letter on the paper of LEETE & TAGG, Birchin Lane, dated Saturday:

| My dear T., Our man at Brest writes that a fishing-boat of Ouessant
| has picked up a boat's transom and a name-board, CORISANDE OF
| LIVERPOOL, the paint still fresh. It is not known here and must not
| be. The rate stands at 60. Get your word from the Head, and wire me
| the moment it is through; I shall buy every line in the Room at
| whatever it falls to. You know the man to see.      S. LEETE.
"""
take_text = "I took the letter."

