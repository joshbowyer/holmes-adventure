# ================================================================ the lane

[items.white_gate]
name = "white gate"
aliases = ["gate", "board"]
location = "lane"
scenery = true
description = "A white-painted gate in the station wall, with a board: LLOYD'S SIGNAL STATION, POLVENTON. VESSELS SIGNALLED AND REPORTED. The paint was flaking in the salt wind."

[items.telegraph_pole]
name = "telegraph pole"
aliases = ["pole", "poles", "wire", "single wire", "line", "telegraph poles", "insulators"]
location = "lane"
scenery = true
description = "A tarred pole, leaning a little from the sea, with a white porcelain insulator at its head carrying a single wire. The line of poles marched down the lane towards Porthkellis, and the wire from the last of them ran in under the eaves of the instrument house."

[items.instrument_box]
name = "box of instruments"
aliases = ["box", "instruments", "instrument box", "detector"]
location = "lane"
scenery = true
description = "The lineman's box: a portable galvanometer, a coil of wire, a set of climbing irons and a tin of luncheon."

[items.hedges]
name = "stone hedges"
aliases = ["hedge", "hedges", "bracken", "dead bracken"]
location = "lane"
scenery = true
description = "The Cornish hedges of these parts: walls of granite and earth as high as a man, overgrown with bracken, gorse and thrift."

[items.milestone]
name = "milestone"
aliases = ["granite milestone", "bank"]
location = "lane"
scenery = true
container = true
description = "An old granite milestone, half sunk in the bank: HELSTON 9."
details = [ { when = "loc:coin_lane:milestone", text = "In the hollow worn at its foot, among the grass, lay a small copper coin." } ]

[items.coin_lane]
name = "farthing"
aliases = ["coin", "copper", "copper coin", "small copper coin"]
location = "milestone"
coin = true
description = "A farthing, Britannia on the back, green with the weather."
take_text = "I picked the farthing out of the grass at the foot of the milestone."

# ================================================================ the yard

[items.step]
name = "step"
aliases = ["stone step", "doorstep", "prints", "footprints", "boot-prints", "mud", "door"]
location = "yard"
scenery = true
clue = "boot_prints"
description = "The step of the instrument house was a single slab of granite, and the gravel before it had been worn into a hollow that held the red mud of the lane. The police had laid a board beside it, and chalked a ring on the stone. Inside the ring, plain in the dried mud, were the prints of a narrow town boot with a pointed toe and a small heel: going in, and coming out again a little blurred, as if in haste."

[items.water_butt]
name = "water-butt"
aliases = ["water butt", "butt", "barrel", "eaves"]
location = "yard"
scenery = true
container = true
description = "A tarred water-butt under the cottage eaves, brimming with rain."
details = [ { when = "loc:coin_yard:water_butt", text = "On the rim, where somebody had set it down to have both hands for the lid, sat a farthing." } ]

[items.coin_yard]
name = "farthing"
aliases = ["coin", "copper", "copper coin"]
location = "water_butt"
coin = true
description = "A farthing, wet with rain."
take_text = "I took the farthing from the rim of the water-butt."

# ================================================================ the instrument room

[items.inker]
name = "inker"
aliases = ["machine", "clockwork", "drum", "drums", "recorder", "instrument"]
location = "instrument_room"
scenery = true
container = true
description = "A Morse inker of the Post Office pattern: a brass clockwork that, while it runs, draws the paper tape under a little inked wheel, and an electro-magnet that pressed the tape up against the wheel whenever current came on the line, so that a long current made a long mark and a short one a short. The tape went from a full drum on one side, under the wheel, and on to a take-up drum on the other."
details = [ { when = "loc:roll:inker", text = "On the take-up drum sat a roll of printed tape, where the police had left it, not knowing what to make of it." } ]

[items.roll]
name = "roll of tape"
aliases = ["roll", "tape", "evening roll", "station tape", "printed tape", "wednesday's tape"]
location = "inker"
clue = "evening_roll"
description = "Wednesday's tape, a fat roll of narrow paper printed from end to end with the dashes and dots of the day's traffic. Against every message all day, from the morning onward, Pascoe had pencilled the time in a small neat hand. The last time pencilled was 6:30, against the evening report. After it came several more passages of marks with no time against any of them, and then the roll ended."
take_text = "I lifted the roll off the drum, tore it across, and coiled it carefully into an envelope from the desk."

[items.sending_key]
name = "brass key"
aliases = ["key", "sending key", "morse key", "brass sending key"]
location = "instrument_room"
scenery = true
description = "A brass sending key on a mahogany base, its knob of black ebonite polished by twenty years of one man's fingers."

[items.galvanometer]
name = "galvanometer"
aliases = ["glass case", "needle"]
location = "instrument_room"
scenery = true
description = "A galvanometer in a glass case, its needle twitching faintly as the current came and went on the line."

[items.code_card]
name = "card"
aliases = ["morse alphabet", "alphabet card", "morse card", "alphabet", "printed card"]
location = "instrument_room"
scenery = true
clue = "code_card"
description = "A card printed by the Post Office with the Morse alphabet in columns, the letters and figures each with its pattern of dots and dashes, fly-specked and curling at the corners. I copied it carefully into the back of my notebook."
on_examine = [ { once = true, text = "[CODEBOOK will show you the alphabet from now on.]" } ]

[items.day_book]
name = "day book"
aliases = ["book", "fat day book", "message book", "log"]
location = "instrument_room"
scenery = true
clue = "day_book"
description = "The station's day book, in Pascoe's small neat hand. Wednesday's page began at eight in the morning and noted every message sent and received, with its time: vessels reported, a weather return, a message from Lloyd's at 12:05 ('CORISANDE MAY BE NEAR. KEEP SHARP LOOKOUT'), and last of all, '6:30 p.m. Evening report to Lloyd's. Nil since noon. Wind NW, clear.' Below it the page was blank."

[items.desk_lamp]
name = "desk lamp"
aliases = ["lamp", "chimney"]
location = "instrument_room"
scenery = true
description = "A brass paraffin lamp with a green shade. Its glass chimney was blackened up one side, as a chimney is when a wick has been lit carelessly and turned too high by someone who did not know the lamp."

[items.stove]
name = "stove"
aliases = ["iron stove", "round iron stove", "grate"]
location = "instrument_room"
scenery = true
description = "A round iron stove, quite cold, with a bucket of coal beside it. The ash in its pan had settled grey and dead."

# ================================================================ the battery room

[items.cells]
name = "glass cells"
aliases = ["cells", "battery", "shelves", "shelf", "chain", "jars", "terminals", "wires"]
location = "battery_room"
scenery = true
description = "Daniell cells, sixty or seventy of them, each a glass jar with a copper plate and a zinc and the blue liquor of copper sulphate, every one wired to the next. Every jar but one was clear enough to see the plates in. The odd one was the last on the bottom shelf, which stood a little apart, with no wire to it."

[items.dead_cell]
name = "unwired cell"
aliases = ["cell", "end cell", "odd one", "jar", "zinc lid", "lid", "bottom shelf"]
location = "battery_room"
scenery = true
container = true
openable = true
description = "A jar like the others, but its glass was painted over on the inside, so that one could not see in, and its zinc lid sat a little crooked. There was no wire to its terminals; it could never have been part of the battery at all."
open_text = "I lifted the zinc lid. There was no acid in the jar, nor zinc, nor copper: it was dry as a biscuit-tin, and lined with oilcloth."

[items.black_book]
name = "little black book"
aliases = ["black book", "book", "little book", "accounts"]
location = "dead_cell"
clue = "blackmail_book"
description = """
A little black book with a brass clasp, ruled in columns in Pascoe's hand, with initials, dates and sums. Most of the pages ran the same way:

| L.N.   Dec 2 1885 ... 10s.     J.K.   Feb 3 1886 ... 2s.
| L.N.   Jan 6 1886 ... 10s.     J.K.   Mar 3 1886 ... 2s.
| L.N.   Feb 3 1886 ... 10s.     ...
| (and so on, L.N. every month, on the first Wednesday,
|  down to)  L.N.   Oct 5 1887 ... 10s.
| J.T.   Nov 2 1887 ... £20. The other twenty Thursday.

And on the last written page, by itself: 'Nov 1. Told L.N. a sovereign from Dec., or W.R. shall have the tape.'
"""
take_text = "I took the little black book and slipped it into my breast pocket."

[items.wreck_tape]
name = "old tape"
aliases = ["coil of tape", "old coil", "coil", "yellowed tape", "tape"]
location = "dead_cell"
clue = "wreck_tape"
description = "A coil of yellowed tape, tied with thread, and labelled in Pascoe's hand: '19 Nov 1885. Night.' Against the first passage he had pencilled '11:02'. Further on, against a stretch of marks that were not passages of his own, he had written 'HN calling PK 11:40, no answer from PK'. Against the last passage he had pencilled '12:12 PK' and drawn a heavy line beneath it."
take_text = "I took the old coil of tape, handling it as though it might break."

# ================================================================ the Lloyd's office

[items.overdue_board]
name = "board of overdue ships"
aliases = ["board", "overdue board", "overdue ships", "chalk", "names"]
location = "office"
scenery = true
clue = "corisande_overdue"
description = """
A black board ruled in white, headed OVERDUE, with ships' names and figures in chalk:

| MARY HOLT, brig, Quebec ............... 15 gns.
| ARCTURUS, s.s., Bombay ................ 25 gns.
| CORISANDE, barque, San Francisco ...... 60 gns.

The figure against the CORISANDE had been rubbed out and written in again more than once: there were the ghosts of a 3 and a 5 under the 60.
"""

[items.vessels_ledger]
name = "ledger of vessels passed"
aliases = ["ledger", "thick ledger", "vessels passed", "vessels"]
location = "office"
scenery = true
description = "The ledger in which every vessel seen from the head is entered, with her name, her rig, her course and the time. On Wednesday the last entry was a Norwegian timber-barque at 12:40 in the afternoon, bound west. There was no other entry that day, and there was no CORISANDE."

[items.office_telescope]
