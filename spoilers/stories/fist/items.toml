[items.signal_mast]
name = "signal mast"
aliases = ["mast", "yards", "halliards"]
location = "lookout"
scenery = true
description = "A tall mast with a yard across it, for hoisting the flags of the code to passing ships, and a lamp-hoist for signalling by night."

[items.watch_log]
name = "watch log"
aliases = ["log", "shelf", "lookout log"]
location = "lookout"
scenery = true
clue = "watch_log"
description = """
The lookout's log, kept by the hour in a round, careful schoolboy hand. Wednesday ran:

| 6:15 p.m.  Capt. Hext came up. Watching for CORISANDE per Lloyd's.
| 7:00 p.m.  No lights. Wind NW fresh, clear.
| 7:45 p.m.  Capt. Hext went down. No lights.
| 8:00 p.m. to 9:00 p.m.  Nothing sighted.
| 9:40 p.m.  Went down to report to Mr P. at close of watch.

It was signed J. KITTO at every entry, and E. HEXT beside the first three.
"""

[items.practice_set]
name = "practice set"
aliases = ["set", "second key", "old inker", "battery", "table"]
location = "lookout"
scenery = true
description = "A second-hand key and an old inker, wired to a little battery of their own and to nothing else: a learner's practice set, on which a man might send to himself and read back his own mistakes."

[items.practice_tape]
name = "practice tape"
aliases = ["strip", "tape", "strip of practice tape", "practice strip"]
location = "lookout"
clue = "practice_tape"
description = "A strip of tape from the practice set, a yard or so long. Two passages were printed on it. Against the first someone had pencilled 'J.K.', and against the second, in the same round hand, 'Mr Tagg's, Monday. London style.'"
take_text = "I tore off the strip and put it with my other papers."

[items.flag_locker]
