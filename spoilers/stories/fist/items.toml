# ================================================================ the flag store

[items.body]
name = "body"
aliases = ["pascoe", "amos pascoe", "corpse", "dead man", "ensign", "red ensign", "trestles"]
location = "flag_store"
scenery = true
clue = "wound"
description = "I turned back the ensign. Amos Pascoe had been a big, heavy, pale man in his fifties, with a clerk's soft hands and the stained right forefinger of a man who works a key. He had died of a single heavy blow to the back of the skull, a little to the right, from something round and very hard, struck from behind by someone close to him. He would have known nothing after it. His coat was buttoned and his waistcoat pockets untouched, but the inside pocket of his coat had been turned half out. After a day and a half in that cold shed I could tell nothing of the hour of his death that the police surgeon had not told already."

[items.signal_flags]
name = "signal flags"
aliases = ["flags", "pigeon-holes", "halliard", "yard", "spare yard"]
location = "flag_store"
scenery = true
description = "The flags of the code in their pigeon-holes, and spare gear for the mast."

[items.shelf]
name = "shelf"
aliases = ["shelf by the door", "effects"]
location = "flag_store"
scenery = true
container = true
description = "A shelf by the door, on which the police had laid out what was found on the dead man and beside him."

[items.lantern]
name = "bull's-eye lantern"
aliases = ["lantern", "bull's-eye", "bulls eye", "bull's eye", "hand-lamp", "hand lamp"]
location = "shelf"
clue = "lamp_dry"
description = "A tin bull's-eye lantern with a thick glass lens, the kind a man carries on a cliff path at night. I unscrewed the reservoir: it was perfectly dry, and the wick was charred right down to the brass. It had burned until there was nothing left to burn."
take_text = "I took the lantern."

[items.tagg_note]
name = "folded note"
aliases = ["note", "paper", "five-pound notes", "banknotes", "money", "twenty pounds"]
location = "shelf"
clue = "tagg_note"
description = """
A half-sheet of the Fisherman's Arms notepaper, folded round four five-pound notes of the Bank of England. In a quick, sloping hand:

| Be up at the lookout at nine and stay till the half hour.
| The other twenty when it is through.      J.T.
"""
take_text = "Trevail let me take the note, though he made me count the money back on to the shelf."

