description = "In the rack I found the chart of the River Plate she had used. The ship's track down the river had been pencilled on it in the ordinary way, and then, for the night of the 8th and 9th of April, rubbed out with india-rubber. But a pencil leaves its furrow in the paper. I held the chart to the lamp and looked along it: the rubbed-out line ran straight and clear, from her position at two in the morning, on a course of S 62 W, plumb on to the Ortiz Bank."

