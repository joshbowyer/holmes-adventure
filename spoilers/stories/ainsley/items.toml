# ================================================================ the dock office

[items.office_things]
name = "desk"
aliases = ["high desk", "stove", "tide-table", "tide table", "window"]
location = "dock_office"
scenery = true
description = "A high desk with the dock's ledgers, a tortoise stove, and a tide-table for the river."

[items.body]
name = "body"
aliases = ["dead man", "fairlie", "robert fairlie", "mr fairlie", "tarpaulin", "hand-barrow", "barrow", "corpse", "mate"]
location = "dock_office"
scenery = true
clue = "body"
description = "I turned back the tarpaulin. Robert Fairlie was a lean, fair, clean-shaven man of thirty-five, in a blue pilot-cloth jacket. He had been killed by a single heavy blow on the right side of the head, above the ear, which had left a round, depressed fracture as big as a florin: such a mark as a hammer leaves. I turned him over. The back of his jacket, from the shoulders to the skirts, was smeared with red lead, still sticky, and so were the heels of his boots, and the back of his trousers. But the front of him was clean, and his hands were clean, and his knees were clean."

