The ship's official log, a fair copy in the master's hand. For 9 April 1897:

'3:10 a.m. Vessel took the ground on the Ortiz Bank, owing to a strong current setting her to the southward of her course, unknown and unforeseen. Engines full astern. Floated 6:40 a.m. Making water in No. 1. S. Wedderburn, Master.'
"""

