'Margaret Ainsley. Forenoon, scrape and prime bottom aft. 5:30 p.m., red lead to edges of opening, No. 1 hold, port, after the riveters. 2 coats. (Wet till morning.) Men off 6:30.'
"""

# ================================================================ the dock floor: the bow

[items.bow]
name = "bow"
aliases = ["stem", "cliff", "gap", "rails", "forecastle"]
location = "under_bow"
