location = "owners_hut"
scenery = true
description = "A row of pegs by the door with a light alpaca dust-coat on one and a bowler hat on another. Captain Haldane's, I supposed."

[items.hut_stove]
name = "stove"
aliases = ["iron stove", "little stove"]
location = "owners_hut"
scenery = true
description = "A little iron stove, cold. It was June."

[items.coal_box]
name = "coal box"
aliases = ["coal-box", "box", "coal", "scuttle"]
location = "owners_hut"
scenery = true
container = true
description = "A wooden coal box beside the stove. The stove was cold, and had been, I judged, for weeks; yet the lid of the box was clean of coal-dust, as if it had lately been opened."
details = [ { when = "loc:haldane_coat:coal_box", text = "I lifted the lid. There was no coal in it. Rolled up tight and pushed down to the bottom lay a coat of grey tweed." } ]

[items.haldane_coat]
name = "tweed coat"
aliases = ["coat", "grey coat", "overcoat", "tweed", "grey tweed coat", "tweed overcoat"]
location = "coal_box"
clue = "coat"
description = "A gentleman's overcoat of grey tweed, good cloth, well cut, by a Leadenhall Street tailor. I unrolled it. Both cuffs were smeared with red lead, dry on top but still tacky in the weave, and so was the skirt in front, at the height of a man's knees, as if he had crawled on them. In the right cuff a little three-cornered tear had been made, the size of my fingernail, as by a nail or a snag of iron. In the pocket was a pass-key on a ring, with a brass tag: PELLEW'S, No. 4."

