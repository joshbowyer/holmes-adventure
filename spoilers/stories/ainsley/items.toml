aliases = ["opening", "black square hole", "square hole", "plates", "edges", "raw edges", "red lead"]
location = "under_hold"
scenery = true
clue = "opening"
description = "Four plates had been cut out of her bottom, leaving a square hole a yard across into the double bottom above. The raw edges had been painted thick with red lead. On the lower edge the paint was scraped and smeared away in a broad band, as if something heavy had been hauled out over it; and at the forward corner a jagged burr of iron stood out where the cutters had left it, painted red like the rest."

[items.burr]
