location = "under_hold"
scenery = true
clue = "tweed_shred"
description = "I put my glass on it. Caught in the burr, stuck fast in the red lead, was a little three-cornered shred of cloth no bigger than my fingernail: a grey tweed, good stuff, not a working man's."

[items.shores_hull]
