location = "under_bow"
scenery = true
clue = "drag_marks"
description = "The police had chalked where he lay: on his back, on the stones under the gap in the rail, his head towards the ship. Very little blood. And then I saw, on the wet stones leading away from the outline under the curve of the hull, aft, a faint broad smear of red at every few feet, as if something painted had been dragged that way, or had been dragged from that way to here."

