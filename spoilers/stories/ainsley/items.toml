# ================================================================ the dock floor: under the hold

[items.staging]
name = "staging"
aliases = ["timber staging", "planks"]
location = "under_hold"
scenery = true
description = "A light staging of planks on trestles, built up so that a man could stand under the hole in the ship's bottom and work at it, or climb in."

[items.opening]
