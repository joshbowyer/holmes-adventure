[case]
id = "ainsley"
title = "The Margaret Ainsley in Dry Dock"
year = 1897
order = 80
start = "dock_gate"
coin_name = "florin"
coin_plural = "florins"
hint_intro = "I gave Holmes a florin. He looked at the Queen's head on it as if she might have something to add, and put it in his pocket."
hint_none = "\"You have the whole of her, Watson,\" said Holmes, \"keel to truck. ACCUSE, when you are ready.\""
hint_broke = "I had no florin about me. \"Riggers drop their money in the oddest places,\" said Holmes. \"Look.\""
intro = """
The summer of 1897 was the summer of the Queen's Diamond Jubilee, and all London was hanging out flags for it; and I remember that we drove down to Rotherhithe, on the Friday before the great day, under more bunting than I had ever seen in my life, to look at a dead man in a dry dock.

Lestrade's wire had been short and, for Lestrade, almost apologetic. The chief officer of the steamer Margaret Ainsley, a Mr Robert Fairlie, had been found at six that morning on the floor of Pellew's Dry Dock, under the bow of his own ship, with his skull broken. The police had a man in custody already, a paid-off boatswain who had threatened him and who had pawned the dead man's watch. "It is quite clear," the wire concluded, "but the owners wish everything done properly, and I thought Mr Holmes might care to see the place."

"Lestrade is never so anxious to have me see a place," said Holmes, "as when he is quite sure there is nothing to see in it. Come, Watson. A ship in dry dock is a ship with her secrets out of the water. Let us see what this one has to show."
"""
intro_note = "[The ship stands in a dry dock: the gangway goes UP to her deck, the dock steps DOWN to the floor beneath her. Aboard and on the dock floor, the bow is north and the stern south (FORE and AFT work too). The holds are dark. Florins found while exploring buy hints from Holmes with HINT.]"

[verbs]
untie = ["untie", "unfasten", "cast off"]

# ================================================================ clues

[clues.found]
text = "Lestrade's wire: Robert Fairlie, chief officer of the s.s. Margaret Ainsley, found at 6 a.m. on Friday 18 June on the floor of Pellew's Dry Dock, Rotherhithe, under his ship's bow, skull broken. A paid-off boatswain who threatened him and pawned his watch is in custody."

[clues.ship_ways]
text = "Holmes: up the gangway to the deck, down the dock steps to the floor beneath her. The bow is north, the stern south. The holds are dark; the watchman has a spare lantern."

[clues.lestrade_case]
text = "Lestrade's case: Laverty, logged and stopped by the mate at sea, said at the pay table, 'I'll see you in the dock, Mister.' Aboard from 11:20 to 11:50 on Thursday night (gangway book); pitched the mate off the forecastle head and took his watch."

[clues.surgeon]
text = "The divisional surgeon: skull broken by the fall; death between midnight and two in the morning."

[clues.pawned]
text = "Laverty pawned the mate's gold hunter at Brough's in Rotherhithe Street at 8 a.m. Friday; arrested at 10 in the Angel."

[clues.laverty_story]
text = "Laverty: came aboard for his ditty box, went aft to have words with the mate, found his cabin empty, lamp lit, watch on its hook, and took the watch. Never saw the mate. Went ashore past the watchman."

[clues.laverty_grounding]
text = "Laverty: there was no current the night of the grounding. The master came up at two bells and gave the helmsman a new course himself; the mate spoke sharply; an hour later she was on the bank at full speed. The mate wrote it all in his little black book."

[clues.haldane_story]
text = "Captain Haldane, the owners' superintendent: ashore by the gangway at 6:10 p.m. Thursday, dined at the Jerusalem, home to Greenwich, in bed by eleven (his wife was asleep); back at 9 a.m. Friday."

[clues.gate]
text = "Jessop, the gatekeeper: the gates are locked at ten; after that the only way in from the street is the wicket, which needs a pass-key. The watchman is aboard, not at the gate. On Friday at six the wicket was locked as he left it."

[clues.pass_keys]
text = "Jessop: four pass-keys to the wicket. No. 1, Hollis, the dockmaster (in Kent all week); No. 2, Sowerby, the painters' foreman; No. 3, Mr Dalziel of Lloyd's; No. 4, Captain Haldane, the owners' superintendent."

[clues.red_lead]
text = "Sowerby: red lead laid on the edges of the hole under No. 1 hold at 5:30 on Thursday; twelve hours or more to dry. Nobody could touch those edges that night without carrying it away on him."

[clues.sowerby_alibi]
text = "Sowerby was at home in Deptford with his wife and six children; his pass-key, No. 2, is on his watch-chain; he owns no coat but his paint-blotched overalls."

[clues.damage]
text = "Dalziel, of Lloyd's Register: the plates are set in evenly, fore and aft: a ship driven head-on on to a bank at speed in slack water, not set on sideways by a current."

[clues.overinsured]
text = "Dalziel: insured for £28,000; worth £15,000 at most. Had she sunk, Tolland & Marr would have done very well."

[clues.dalziel_alibi]
text = "Dalziel was at the Lloyd's Register dinner till eleven, then on the 11:50 to Liverpool with a dozen colleagues; his pass-key, No. 3, was in his bag."

[clues.kerr_lantern]
text = "Kerr, the watchman: after Laverty went ashore at 11:50, nobody came up or down the gangway till six. A little before one, he saw the mate's lantern go forward along the deck and down the ladder into No. 1 hold."

[clues.cocoa]
text = "Pennock, the steward: at 12:30 by the saloon clock the mate fetched a can of cocoa from the pantry and went forward with it and his lantern."

[clues.captain_alibi]
text = "Pennock: the master went to bed drunk at nine; Pennock sat up in the pantry till two, facing the master's door across the saloon; he never stirred."

[clues.cheerful]
text = "Pennock: the mate had been low since the Plate, then very cheerful the last day or two: 'I'll be married by Michaelmas after all.'"

[clues.master_story]
text = "Captain Wedderburn will say only that a current set her on the bank, as the log says."

[clues.black_book]
text = "Quayle, the second officer: the mate kept his own log of every course and order in a little black notebook, 'worth more than the ship', in the second drawer under his bunk. He hung his watch on the hook by his desk whenever he sat to write."

[clues.unsigned]
text = "Quayle: the master wrote up the official log in Montevideo; the mate would not sign it."

[clues.rails]
text = "Lindqvist, the carpenter: he took down the port rail on the forecastle head on Thursday morning and put a rope across with a hitch at each end; it is untouched."

[clues.route]
text = "Lindqvist: with four plates out of her bottom and the tank-top manhole open, a man can walk into her from the dock floor, up the staging, along the double bottom and up into No. 1 hold, unseen."

[clues.fairlie_asked]
text = "Lindqvist: on Thursday afternoon the mate asked whether the manhole in No. 1 was open, and went away whistling."

[clues.body]
text = "Fairlie's body: one heavy blow above the right ear, a round depressed fracture the size of a florin, as from a hammer. Red lead on the back of his jacket, the seat of his trousers and the heels of his boots; none on his front, his hands or his knees."

[clues.coat]
text = "In the coal box of the owners' hut, rolled up: a grey tweed overcoat with red lead on both cuffs and on the skirts at knee height, a three-cornered tear in the right cuff, and in the pocket the wicket pass-key No. 4."

[clues.paint_book]
text = "Sowerby's paint book: Thursday, 5:30 p.m., red lead to the edges of the opening under No. 1 hold, port; wet till morning."

[clues.drag_marks]
text = "Under the bow, the body lay on its back under the gap in the rail; from there a broad smear of red runs aft along the dock floor towards the hole in the ship's bottom."

[clues.opening]
text = "The hole under No. 1 hold: the red lead on its lower edge scraped away in a broad band, as if something heavy had been hauled out over it."

[clues.tweed_shred]
text = "Caught on a burr at the corner of the hole, stuck in the red lead: a three-cornered shred of good grey tweed."

[clues.bottom_smears]
text = "In the double bottom, a broad trail of red lead across the frames between the manhole above and the hole below, as of something long and heavy dragged through."

[clues.lantern_dry]
text = "On the tank top of No. 1 hold, by the manhole: a ship's hand-lantern, set down alight and left to burn dry."

[clues.cocoa_can]
text = "Beside it, a can of cocoa from the pantry, half full, cold, with a skin on it."

[clues.hammer]
text = "Among the riveters' gear in No. 1 hold, a heavy snap-head hammer lying apart, its round face the size of a florin, with two short fair hairs stuck in something dark at the head."

[clues.gangway_book]
text = "The gangway book: 6:10 p.m. Capt. Haldane ashore; 6:30 painters ashore; 11:20 M. Laverty aboard for his box; 11:50 Laverty ashore with box; 6:00 a.m. painters aboard. Nothing else."

[clues.rail_gap]
text = "The gap in the forecastle-head rail: the rope across it untouched, its hitches hard and dry, and the rust-dust at the deck edge unmarked. Nobody went through it."

[clues.empty_drawer]
text = "In the mate's second drawer, among his papers, a clean rectangle the size of a small book where one lay until lately."

[clues.chart]
text = "The chart of the River Plate: the ship's track for the night of 8 and 9 April has been rubbed out, but its furrow in the paper runs from her 2 a.m. position, on a course of S 62 W, straight on to the Ortiz Bank."

[clues.official_log]
text = "The official log, in the master's hand: at 3:10 a.m. on 9 April she took the ground on the Ortiz Bank 'owing to a strong current setting her to the southward of her course, unknown and unforeseen'."

