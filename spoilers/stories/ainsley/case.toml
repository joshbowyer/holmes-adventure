# ================================================================ endings

[endings.solved]
title = "Red Lead"
text = """
"Laverty took the watch," I said. "That is all he did. He went ashore at ten minutes to twelve, by the watchman's book, and at half past twelve the mate was alive and well in the pantry, asking Pennock for a can of cocoa. He took it forward with his lantern, and a little before one Kerr saw his light go down into No. 1 hold. He never came up again. His lantern is on the tank top still, burnt dry, and his cocoa beside it with a skin on it, and among the riveters' gear there is a hammer with his hair on it.

"He did not fall from the forecastle head. Lindqvist's rope is as he left it, and the dust in the gap is unmarked. He was killed in the hold and taken out of the ship through her bottom: down the manhole, along the double bottom, out through the hole the riveters cut, and over the edges the painters had red-leaded at half past five, so that he went out on his back and has red lead from his shoulders to his heels and none at all on his hands. Then he was dragged along the dock floor and laid under the gap in the rail, to look like a fall. The smear runs aft from where he lay to the hole.

"Only a man from outside the ship would come that way, Holmes, and after ten at night only four men could come into the dock yard at all. The dockmaster is in Kent. Sowerby was at home in Deptford with his six children and has no coat but his overalls. Dalziel was on the night mail to Liverpool. And the fourth man left a piece of his coat on the burr at the corner of the hole, and pushed the rest of it down to the bottom of the coal box in his own hut, with red lead on the cuffs and the knees and the pass-key in the pocket.

"Captain Haldane went ashore by the gangway at ten past six, where the watchman would write him down; and came back at one in the morning by the bottom, where nobody would, to buy the mate's black book. Fairlie had written in it the course the master gave at two bells on the night of the grounding: S 62 W, straight on to the Ortiz Bank. She was insured for nearly twice her value, and meant to be lost; and on Monday the mate would have told the Board of Trade so, unless he was paid. I think he asked five hundred pounds, to be married on. Haldane took the book, and struck him with the first thing to hand."

Holmes had listened with his eyes on the black hull below us.

"The watchman's book was quite right, Watson," he said. "The gangway is the only way aboard a ship. It is only that a ship in dry dock has, for a week or two, another." He rose. "Lestrade will be disappointed. Let us go and disappoint him."

Captain Haldane made no resistance. The black book was never found; he had burned it in his kitchen range at Greenwich before dawn, he said, and his wife had raked out the ashes. But the chart was enough, with the coat and the key and the shred of tweed, and Dalziel's evidence of the damage. Haldane was hanged at Newgate in the autumn. Captain Wedderburn lost his certificate at the inquiry, and Tolland & Marr their underwriters; and Michael Laverty, who took a watch from an empty cabin, got six months for it, and came out to find himself something of a hero along the Rotherhithe waterfront, for having been, as he put it, "very near hanged for a gentleman."
"""

[endings.wrong_tale]
title = "The Only Way Aboard"
text = """
I told Holmes my story, and the name in it, and he heard me out with a long face.

"You have the right man, Watson," he said, "and the wrong story. His counsel will take your story to pieces in an afternoon, and the right man will walk out of the Old Bailey on the pieces. The when, the where and the how must all be true, or none of them will be believed."

He was right. Haldane was charged, and acquitted; and Michael Laverty, against whom nothing more could be proved, got six months for the watch. The Margaret Ainsley went back to sea in July, with a new mate, and was lost with all hands in the Bay of Biscay the following winter. She was very well insured.
"""

[endings.accident]
title = "Fell From the Forecastle Head"
text = """
"He fell," I said. "In the dark, through the gap in the rail."

"Through a rope that nobody untied," said Holmes, "and over dust that nobody disturbed, and landed with red lead on his back." But it was the inquest's verdict too: misadventure. The Board of Trade inquiry on Monday heard the master's account of the current, and found that the grounding was caused by an unknown and unforeseen set to the southward. Laverty got six months for the watch.
"""

[endings.laverty_hanged]
title = "I'll See You in the Dock"
text = """
"Laverty," I said. "He threatened him, he was aboard, and he had the watch."

Lestrade shook me warmly by the hand. Holmes did not.

Michael Laverty was tried at the Old Bailey in September and hanged in October, protesting to the last that he had taken a watch from an empty cabin and never seen the mate at all. I have thought of him many times since. The Board of Trade inquiry, deprived of the chief officer's evidence, found that the Margaret Ainsley had been set on the Ortiz Bank by an unforeseen current.
"""

[endings.master_taken]
title = "The Old Man"
text = """
"The master," I said. "He had every reason; it was his course that put her on the bank."

"It was," said Holmes, "and he was snoring in his bunk with the steward sitting across his door till two in the morning. He is a scoundrel, Watson, but he is a drunken scoundrel, and he was drunk."

Wedderburn was arrested and released within the week, and the man who did kill Robert Fairlie gave evidence at the inquiry on Monday, very gravely, on behalf of the owners.
"""

[endings.kerr_taken]
title = "The Watchman"
text = """
"Kerr," I said. "He was awake, he was aboard, and he alone says nobody came."

"Nobody came by his gangway, Watson," said Holmes. "That is precisely what is true." Kerr was held a night and released, and lost his place. The case against Laverty went forward.
"""

[endings.sowerby_taken]
title = "The Painter"
text = """
"Sowerby," I said. "He had a key, and red lead is his trade."

"And six children in Deptford who will swear to his snoring," said Holmes, "and no coat in the world that is not already red." Sowerby was not even arrested. The case against Laverty went forward.
"""

