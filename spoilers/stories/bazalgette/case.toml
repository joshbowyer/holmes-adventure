target = "whistle"
when = ["at:penstock_chamber", "!flag:pond_drained"]
text = "I put the whistle to my lips and blew three long blasts. They went shrieking away down the tunnel and came back to me in echoes, over and over, fainter and fainter. Then I counted sixty, slowly, as the notice bade me."
effects = ["set:whistled"]

[[actions]]
id = "blow_whistle"
verb = ["blow", "use"]
target = "whistle"
text = "I blew a blast on the whistle. It shrilled away into the distance and nobody came."

[[actions]]
id = "wind_no_handle"
verb = ["turn", "use", "open"]
target = "penstock"
when = ["!has:handle", "!has:ruddock_handle", "!flag:pond_drained"]
text = "The winch spindle ended in a bare square boss. Without a penstock handle I could no more turn it than fly. There was one on the rack in Coaker's office."

[[actions]]
id = "wind_no_whistle"
verb = ["turn", "use", "open"]
target = "penstock"
when = ["!flag:whistled", "!flag:pond_drained"]
text = "I had the handle on the boss and my weight on it before I remembered the notice over my head. Seven feet of water stood behind that gate. If any man were below me in the Fleet, a flusher, a contractor's man, an old tosher where he had no business to be, I should drown him. I took my hands off the crank. The whistle first."

[[actions]]
id = "wind_penstock"
verb = ["turn", "use", "open"]
target = "penstock"
when = "!flag:pond_drained"
once = true
text = "I fitted the handle over the boss and wound. It was heavy work at first, and then the gate came free in its grooves with a groan, and the whole black weight of the pond went out from under it at once. The roar of it filled the chamber so that I felt it in my chest rather than heard it: a solid, sliding, foaming wall of water that went thundering away down the Fleet towards the river and was gone. I stood clinging to the rail and watched the gauge-board fall, seven feet, five, three, one, until the water ran past its foot no deeper than a gutter in the rain. To the north the tunnel lay open, streaming. Anything that had been in that pond, I thought, would have gone down with it like a cork."
effects = ["set:pond_drained"]

[[actions]]
id = "wind_again"
verb = ["turn", "use", "open"]
target = "penstock"
text = "The gate stood up in its frame and the Fleet ran free beneath it. I left it so."

[[actions]]
id = "shut_penstock"
verb = "close"
target = "penstock"
text = "I left the gate as it was. Coaker's men could see to their own pond."

[[actions]]
