[case]
id = "bazalgette"
title = "Below Bazalgette"
year = 1886
order = 20
start = "depot_yard"
coin_name = "copper"
coin_plural = "coppers"
hint_intro = "I dropped a penny into Holmes's palm. He turned it over, as if to see whose head was on it, and pocketed it."
hint_none = "\"You have all of it, Watson,\" said Holmes, closing his ledger. \"Every drop. ACCUSE, when you are ready.\""
hint_broke = "My pockets were empty of coppers. \"The Fleet is full of them,\" said Holmes. \"Ask any tosher.\""
wait_turns = 5
wait_text = "I waited, stamping my feet against the cold, while the river went about its business."
intro = """
Of all the places to which my friend Sherlock Holmes's work has led me, I think none was ever so strange to me as the great sewers of London, which Sir Joseph Bazalgette had built under our feet not twenty years before, and which most of us had the good sense never to think about at all.

It was on the morning of Wednesday, the 10th of November, 1886, a raw grey day with an east wind blowing up the river, that a wire from Inspector Gregson brought us to the Metropolitan Board of Works depot in Water Lane, by Blackfriars. A young engineer of the Board, Mr Edwin Hurrell, had gone down into the Fleet sewer alone a little before midnight. At a quarter past four in the morning a waterman had found him dead in the outfall chamber at the river's edge: a place shut off from the Thames by iron flaps that no man can open from outside, and from the sewer by a weir which, Gregson said, nobody in his senses would go near in the dark.

"Misadventure," said Gregson at the gate, "or a tosher. You'll see." And he went off to see about his tosher.

Holmes looked about the yard, at the boots and the lamps and the grating in the cobbles that breathed up the smell of the Fleet, and then at me.
"""
intro_note = "[Half of this case lies underground. Your lantern burns only while you are below, and the tide decides when the river side can be reached. STATUS shows both; WAIT lets time pass. Coppers found while exploring buy hints from Holmes with HINT.]"

counters = { tide = 2, tide_left = 12, oil = 0 }

every_turn = [
  # 0: the river keeps its own time
  { effects = ["add:tide_left:-1"] },
  # 1-4: the tide turns (0 low, 1 flood, 2 high, 3 ebb)
  { when = ["eq:tide_left:0", "eq:tide:3"], text = "[The tide is out. It is low water.]", effects = ["setn:tide:0", "setn:tide_left:18"] },
  { when = ["eq:tide_left:0", "eq:tide:0"], text = "[The tide has turned. It is making again.]", effects = ["setn:tide:1", "setn:tide_left:10"] },
  { when = ["eq:tide_left:0", "eq:tide:1"], text = "[It is high water.]", effects = ["setn:tide:2", "setn:tide_left:14"] },
  { when = ["eq:tide_left:0", "eq:tide:2"], text = "[The tide has turned. It is ebbing.]", effects = ["setn:tide:3", "setn:tide_left:10"] },
  # 5-7: the river side at the turn of the tide
  { when = ["eq:tide:0", "eq:tide_left:3", "at:outfall_chamber|at:foreshore"], text = "The little stream from under the flaps had slackened and almost stopped. Very soon now the tide would be making." },
  { when = ["eq:tide:1", "at:outfall_chamber"], text = "A tongue of brown river water came sliding in under the flaps, and then another, and the flaps themselves began to stir. I did not wait to see more, but scrambled back up over the weir as fast as I could go.", effects = ["goto:weir_chamber"] },
  { when = ["eq:tide:1", "at:foreshore"], text = "The river came creeping back over the mud faster than I would have believed, and I retreated before it up the stairs.", effects = ["goto:river_stairs"] },
  # 8-11: the lantern burns while below ground
  { when = ["flag:below", "has:lantern", "ge:oil:1"], effects = ["add:oil:-1"] },
  { when = ["flag:below", "has:lantern", "eq:oil:10"], text = "I noticed that my lantern was burning lower. Through the little window in the reservoir there was not much oil left." },
  { when = ["flag:below", "has:lantern", "eq:oil:3"], text = "My lantern was guttering. In a very few minutes it would be dry." },
  { when = ["flag:below", "lt:oil:1", "!at:shaft_foot"], text = "My lantern flickered, flared, and went out, and the darkness came down on me like a sack. I do not care to remember the next quarter of an hour. I groped my way back along the wall, step by step, towards the far grey glimmer of the shaft, and came at last, sweating, to the foot of the rungs. The lantern was dry. Sparrow would have to fill it.", effects = ["goto:shaft_foot"] },
]

status = [
  { when = ["has:lantern", "ge:oil:1"], text = "[Lantern: oil for {oil} more turns below ground.]" },
  { when = ["has:lantern", "lt:oil:1"], text = "[Lantern: dry. Sparrow will fill it.]" },
  { when = "eq:tide:0", text = "[Tide: low water, for {tide_left} more turns.]" },
  { when = "eq:tide:1", text = "[Tide: flooding; high water in {tide_left} turns.]" },
  { when = "eq:tide:2", text = "[Tide: high water, for {tide_left} more turns.]" },
  { when = "eq:tide:3", text = "[Tide: ebbing; low water in {tide_left} turns.]" },
]

[verbs]
blow = ["blow", "sound"]
turn = ["turn", "wind", "crank", "raise", "lift"]
fill = ["fill", "refill", "trim"]

# ================================================================ clues

[clues.found]
text = "Gregson's account: Edwin Hurrell, engineer to the Board, went down into the Fleet alone before midnight. At 4:15 a.m., at low water, a waterman saw his arm hanging out under a flap of the Fleet outfall. Gregson calls it misadventure, or a tosher who was selling a gold watch at six this morning."

[clues.tide_board]
text = "The depot tide board: low water at Blackfriars was due at 12:20 a.m. last night; high water at 6:35 this morning. Added beneath: \"Wind E., fresh to strong.\""

[clues.flush_log]
text = "Flushing log: Fleet penstock shut at 10 p.m. to gather head; flushed at 2 a.m. by Dunn, whistle given; \"head at flushing 3 ft 4 in only (usual: full, 7 ft). Cause not known.\" Shut again at 2:20."

[clues.key_book]
text = "Key book: Hurrell signed out the Farringdon Street side-entrance key at 11:20 p.m. The Board's penstock handle went out to Dunn at 1:30 a.m. and back at 3:10. A second penstock handle was lent to Gaskin & Pell, the contractors, on 3 August."

[clues.fill_rate]
text = "Coaker: with the gate shut, the pond fills about two feet an hour in dry weather, and is full to the crest (7 ft) well before the 2 a.m. flush."

[clues.handles]
text = "The Board's penstock handle: a heavy iron crank whose working end is a square socket, about an inch across. There are only two: the Board's, and the contractors'."

[clues.oil_book]
text = "Sparrow's oil book: lamp No. 7 was filled to the brim and issued to Hurrell at 11:20 p.m."

[clues.lamp_burn]
text = "A Board's lamp or lantern, filled to the brim, burns about four hours."

[clues.wound]
text = "Hurrell's body: battered and grazed all over as if rolled down a quarry, but killed by a blow from behind: a square-cornered depressed fracture about an inch across at the back of the skull. Very little froth: he was dead or dying before the water took him."

[clues.nails]
text = "Under Hurrell's right-hand nails, and on the point of his clasp-knife: hard white grit, cement or render."

[clues.watch_chain]
text = "Hurrell's watch-chain is still in his buttonhole, but the watch is gone and the last link is dragged open, as by a heavy pull. His purse was untouched. No thief took that watch."

[clues.notebook_entry]
text = "Hurrell's last note: chains 9 to 14 of the \"new lining\" are half an inch of render over rotten old brick, though certified and paid for in full. He would \"hear what the foreman has to say at the penstock at 12\" before reporting it."

[clues.whistle_rule]
text = "The Board's rule at the penstock: no gate raised until the ganger has given three blasts on his whistle and waited one minute."

[clues.lamp_found]
text = "Hurrell's lamp No. 7 was standing unlit on the ledge by the penstock walkway, dry, nearly full of oil, its wick screwed right down."

[clues.lamp_measured]
text = "Sparrow measured the oil left in lamp No. 7: it burned not above an hour after 11:20, nearer three-quarters. It did not go out by itself; the wick was screwed down by hand."

[clues.dunn_night]
text = "Dunn: at 2 a.m. the gauge showed only 3 ft 4 in where it should have been full. He blew three blasts and flushed. An unlit lamp stood on the ledge by the walkway; he took it for the contractors'."

[clues.sham_wall]
text = "In the relined length, at chain 11, someone had scraped away the new lining with a knife. It is a crust of render no thicker than a half-crown over old brick rotten as cheese, and the same at chains 12 and 13."

[clues.weir]
text = "The storm weir: all the ordinary flow of the Fleet turns aside into the low-level sewer. Only a flood tops the weir and goes down into the outfall chamber. Its iron edge is rough, and rags catch on it."

[clues.flaps]
text = "The outfall flaps open outward only when the river is lower than the water inside; when the river is higher they are held shut, and the chamber is tide-locked. The scum line stands over a man's head. Something large lay wedged against the left-hand flap."

[clues.pellow_tide]
text = "Pellow: low water was due at 12:20, but a hard east wind held the tide up. At midnight the river stood nearly at the flood and the flaps were shut tight. It did not fall until after two; true low water was near four."

[clues.mott_flood]
text = "Mott: a little after a quarter past twelve a flood came down the Fleet with no whistle at all, and something big went past him in the dark and over the weir. At 1 a.m. he found the watch caught by its bow on the iron of the weir. At two came three blasts and the second flush."

[clues.gaskin_alibi]
text = "Gaskin was at a Masonic banquet at the Cannon Street Hotel from seven until a quarter past one, before forty witnesses (Gregson has checked)."

[clues.sparrow_alibi]
text = "Sparrow: he and Coaker played cribbage in the lamp-room from 11:30 to 1:30, and Coaker never left. From the window Sparrow watched the lit office door all night; the Board's handle never left its hook until Dunn took it at 1:30."

[clues.coaker_admits]
text = "Coaker admits he never examined the relining above chain 8. He signed the measurement on Ruddock's word, and Gaskin was \"very good to him at quarter-day\"."

[clues.ladder]
text = "The contractors' working shaft: every rung above the standing water is smeared with fresh sewer mud, right up to the yard. Someone climbed out of the Fleet that way since the pond last stood low."

[clues.fitch_saw]
text = "Fitch, the contractors' watchman: at about 12:30 a.m. Ruddock came up out of the working shaft, wet to the thighs, with his dark lantern and the contractors' penstock handle, and told him, \"You never saw me.\""

[clues.ruddock_story]
text = "Ruddock says he went home to the Borough at six last night and was in bed by ten."

[clues.hut_handle]
text = "In Ruddock's hut: the contractors' penstock handle, with the same inch-square socket as the Board's, but scoured bright from end to end and still damp at the grip."

[clues.trousers]
text = "In Ruddock's hut: a pair of corduroy trousers hung to dry behind the stove, soaked and black with Fleet slime up to the thigh."

[clues.tide_card]
text = "In Ruddock's hut: a London Bridge tide card with \"Low water 12:15 a.m.\" for Tuesday the 9th ringed twice in pencil."

[clues.measure_book]
text = "The contractors' measurement book: chains 0 to 14 relined in full, \"Measured: J. Ruddock, Foreman. Examined and found correct: A. Coaker, for the Board.\""

