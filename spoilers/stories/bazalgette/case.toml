# ================================================================ endings

[endings.solved]
title = "Low Water"
text = """
I told it him as I had followed it, from the top of the Fleet to the bottom.

Hurrell had gone down at twenty past eleven with lamp No. 7, filled to the brim, to see for himself the work the Board was about to pay for. He found it, at chain 11, with his clasp-knife: half an inch of render over rotten brick. Then he went to the penstock at midnight to hear what the foreman had to say. Not Coaker: Coaker was at his cribbage with Sparrow all night, and Sparrow watched the Board's handle on its hook from his window till Dunn took it at half past one. The foreman who met him came down the contractors' own shaft with the contractors' own handle, and struck him down from behind with the square end of it, and rolled him into the pond. Then he screwed down the wick of the dead man's lamp so that no light should show along the tunnel, and could not find it again in the dark, and wound up the gate with no whistle.

The lamp burned not above an hour. Mott heard the flood come down, with no warning, a little after the quarter past twelve, and saw something go by him over the weir, and found the watch hanging on the weir's iron by its bow. At two o'clock Dunn found the pond with only three foot four in it, which at two feet in the hour is just what it would gather from twenty past twelve. And Ruddock, who says he was abed in the Borough by ten, came up out of the Fleet by his own ladder at half past twelve, wet to the thighs; Fitch saw him; his trousers are behind his stove still, and his handle is scoured bright.

"And the river?" said Holmes softly.

"He meant it to take Hurrell out to sea," said I. "He had low water ringed on his tide card at a quarter past twelve: at low water the flaps stand open, and a body going over the weir on a flood goes out into the Thames, to come ashore a week later at Erith as one more drowned man. But the wind was in the east all night and held the tide up, and the flaps were shut. So Hurrell stayed where he was, in a place nobody could have reached; and at four o'clock, when the river went down at last, he put out his hand."

Holmes was silent for a little. "I have said before that the criminal's greatest enemy is his own ingenuity," said he. "Ruddock's was the Thames. Come, Watson; Gregson will want to hear this from you, and you will want a bath."

Ruddock was taken in his own yard that afternoon. He made no defence, and said only, at the last, that he had never meant it; that he had asked the young man to meet him to beg him, and the young man would not be begged. The Board, I am told, relined chains 9 to 14 at its own expense the following spring. Abel Coaker lost his place, and Gaskin & Pell their contract, and within three years the whole Metropolitan Board of Works had gone the same way, amid such a smell of jobbery that even the Fleet could not have bettered it.
"""

[endings.misadventure]
title = "Found Drowned"
text = """
"It was an accident," I said. "He went down alone in the dark, and the Fleet took him."

Holmes said nothing at all; and Gregson, when I told him, shook me warmly by the hand.

The coroner's jury at St Bride's found that Edwin Hurrell was accidentally drowned while inspecting the Fleet sewer in the course of his duty, and added a rider about the danger of going below unaccompanied. Gaskin & Pell received their final certificate, signed by another engineer, in December.

In the spring the crown of the Fleet fell in under Farringdon Street at chain 11, and took an omnibus horse with it.
"""

[endings.mott_taken]
title = "The Tosher"
text = """
"Mott," I said. "He was in the Fleet last night; he had the watch."

"So he had," said Holmes, "and the purse he never touched, and a handle he never owned, and a gate he could not have wound." But I had said it, and Gregson had wanted nothing better from the first.

Saul Mott was committed for trial at the Old Bailey. The evidence of the watch-chain was given, and he was acquitted of murder, and got eighteen months for stealing by finding. He died in the infirmary at Holloway before his time was up, and the man who killed Edwin Hurrell went on measuring sewers for the Board.
"""

[endings.coaker_taken]
title = "The Other Foreman"
text = """
"Coaker," I said. "The foreman, in Hurrell's own hand. He signed for work he never looked at."

"He did," said Holmes. "And while Hurrell was dying, he was losing four shillings at cribbage to a man who never took his eyes off him. There were two foremen in that case, Watson."

Coaker was arrested that afternoon and held a week, until Sparrow's evidence got him out of it. He lost his place for the measurement, as he would have done in any case. The other foreman, who had known that he would be the first man suspected, read about it in the newspaper in the Borough, and slept well.
"""

[endings.gaskin_taken]
title = "Forty Witnesses"
text = """
"Gaskin," I said. "The contract was his, and the money."

Holmes looked at me with real pain. "At the Cannon Street Hotel, Watson? With forty Freemasons for a chorus?"

Gregson would not even take the information. He laughed, and the story got about, and for a month I could not show my face at my club without some wag asking me whether I had looked under the banqueting table. The case was entered as misadventure, and the work at chain 11 was paid for in full.
"""

[endings.dunn_taken]
title = "Three Blasts"
text = """
"Dunn," I said. "He had the handle, and he let the water go."

"At two o'clock," said Holmes, "with three blasts on his whistle, which an old tosher heard. And Hurrell's lamp went out an hour and three-quarters before that. Who let the first water go, Watson?"

Harry Dunn was suspended without pay pending the inquest, and the inquest, hearing Mott, cleared him. But the Board does not like its gangers to be talked about, and he was not taken back. The last I heard of him he had gone to the coal-mines in the North, where, he said, a man at least knew who he was working for.
"""

[endings.collapses]
title = "Over the Weir"
text = """
I gave Holmes my account. He heard me out with his eyes closed, and at the end of it he was silent so long that I thought he had gone to sleep.

"The name is right, Watson," he said at last, "or it may be. But the way you have it, he could not have done it, or need not have done it, or would not have done it; and any counsel at the Old Bailey would drive a cart and horses through it. You have not followed the water. Go back and follow it."

Gregson, at any rate, was not prepared to arrest anybody on it, and the case lay where it was.
"""

