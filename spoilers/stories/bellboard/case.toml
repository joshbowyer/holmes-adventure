[case]
id = "bellboard"
title = "The Bell-Board at Pelham Square"
year = 1888
order = 10
start = "entrance_hall"
coin_name = "sixpence"
coin_plural = "sixpences"
hint_intro = "I laid a sixpence on the newel post beside Holmes's hand. It vanished into his waistcoat pocket, and he spoke without looking at me."
hint_none = "\"You have everything, Watson,\" said Holmes. \"I can add nothing but the courage to say it. ACCUSE, when you are ready.\""
hint_broke = "My pockets held no more silver. \"No sixpence, no sermon,\" said Holmes cheerfully. \"The house is full of them, Watson. Look about you.\""
intro = """
I have set down elsewhere how often my friend Sherlock Holmes was called into a case by some chance of my own profession, but I recall only one occasion on which I was myself at table when the murder was done, and a guest at the very house.

It was in the February of 1888. Captain Hugh Orme, who had served beside me in the Berkshires and had left his right arm upon the field of Maiwand, had begged me to make up the numbers at a dinner given by Mr Edmund Vane, the contractor, at his house in Pelham Square. We were six at table: our host and his wife; Mr Lionel Brand, Vane's partner of twenty years; Orme and his sister, Miss Letitia Orme; and myself.

It was a heavy, uneasy dinner. Orme had drunk rather more than was wise, and over the soup he said something bitter to Brand about men who lent money to their friends, at which Brand answered him very quietly that they would speak of it tomorrow. The ladies withdrew at twenty minutes to ten, and presently Miss Orme's piano came down to us through the ceiling. A little before ten Brand excused himself to write a letter in the library; Vane went upstairs for his cigars; Orme went out of the room for a few minutes. At half past ten Vane went across the hall to fetch Brand up to the ladies, and we heard him cry out.

Lionel Brand lay dead in the library, struck down from behind. I did what little a doctor could, which was nothing, and while Vane sent for the police I scribbled a wire to Baker Street.

Inspector Lestrade arrived at a quarter past eleven, and Holmes at a quarter to twelve. By midnight Lestrade had made up his mind that the man he wanted was my old comrade Orme.
"""
intro_note = "[This case is larger than the practice case, and the house has two sides: the family's rooms and the servants' passages and back stair. NOTEBOOK shows what you know. Sixpences buy hints from Holmes with HINT.]"

[verbs]
sit = ["sit"]
pull = ["pull", "ring", "tug", "yank"]
blow = ["blow", "whistle"]

# ================================================================ clues

[clues.table_times]
text = "What I saw myself: Brand left the dining-room at 9:48 to write a letter. Vane went up for his cigars at 9:50 and came back at 9:59. Orme went out at 9:55 and came back at 10:02. At ten o'clock Vane and I were together in the dining-room, and a minute later James brought him a note."

[clues.piano]
text = "Miss Orme's piano came down through the dining-room ceiling from about 9:45 until about 10:20, and I do not remember that it ever stopped."

[clues.quarrel]
text = "Over the soup Orme spoke bitterly to Brand about money lent to friends. Brand answered quietly that they would speak of it tomorrow."

[clues.tube_plug]
text = "Brand fell beneath the library speaking tube with its whistle pulled out and hanging by its chain, his hand stretched up toward it. He was calling below stairs when he was struck."

[clues.weapon]
text = "The weapon was the library poker: wiped, with hairs still in the collar, and put back in the rack the wrong way about."

[clues.burnt_letter]
text = "Burnt letter in the library grate, in Brand's hand, to Vane: \"cannot in honour keep silent... my sister has this week... at Bath in '79... under another name... your wife...\""

[clues.whistle_ten]
text = "Gaunt, the butler, heard the library whistle at ten o'clock exactly by the pantry clock. When he answered he heard a catch of breath and a soft fall, then nothing."

[clues.ellen_saw]
text = "Ellen, the kitchen-maid, was in the pantry at ten and saw Gaunt answer the library whistle there."

[clues.sightline]
text = "James, the footman, watched the library door from his chair from 9:30. Nobody went in after Brand (9:48) until Vane found him (10:30). He saw Vane go up at 9:50 and come down at 9:59, and Orme in the cloakroom from 9:55 to 10:02. At ten he answered the street door to a messenger, with the library door still in view."

[clues.cloakroom_window]
text = "The cloakroom has only the one door to the hall. Its single window is a foot square and barred outside."

[clues.parkes_dressing]
text = "Parkes, the valet, answered Vane's bell at 9:52 by the back stair, and was with him in the dressing-room from 9:54 until Vane went down at 9:58."

[clues.bells_rung]
text = "Mrs Bale watched the bell-board all evening. Only three bells rang after dinner: the dressing-room at 9:52, the street door at 10:00 and the nursery at 10:05. The library bell never rang."

[clues.jib_door]
text = "There is a jib door, disguised in the library panelling, opening onto the back stair at the ground-floor landing."

[clues.family_never]
text = "Gaunt says the family never use the back stair. In twelve years he has never once seen the mistress on it."

[clues.cigar_end]
text = "At the foot of the back stair: the end of one of Vane's red-and-gold-banded Havanas, smoked about a third of the way down."

[clues.parkes_skirts]
text = "Parkes was secretly smoking at the foot of the back stair just after ten. He heard a thump overhead, then the latch of a door above him and silk skirts going quickly up the stair, past the first floor and on up."

[clues.cook_supper]
text = "Mrs Bale says every woman servant was at supper under her eye from 9:45 until after ten. Only Ellen (the jug, at ten) and Annie (the nursery bell, at 10:05) left the table."

[clues.clara_left]
text = "Miss Orme says Mrs Vane left the drawing-room at 9:55 to see to the baby, and was gone about twenty minutes."

[clues.clara_story]
text = "Mrs Vane says she went up the main stair to the nursery a little before ten, sat with the baby, rang for Annie, and came down again for tea."

[clues.limewash]
text = "The back stair is limewashed with an old soft wash that comes off chalky white on any cloth that brushes it. The main stair is papered."

[clues.gown_smear]
text = "On the right side of Mrs Vane's dark blue silk skirt, at the hip: a faint pale chalky streak that someone has tried to brush away."

[clues.annie_found]
text = "Annie answered the nursery bell at 10:05 and found Mrs Vane out of breath, her hair coming down, and the baby screaming as if he had been left crying a long while."

[clues.cutting]
text = "In Brand's waistcoat pocket: a cutting from the Bath Chronicle, October 1879. Clara Dunn, 23, lady's maid to Mrs Ashcombe of Lansdown Crescent, was tried for stealing a brooch and found Not Guilty."

[clues.vane_wife]
text = "Vane says his wife was Miss Clara Dunn, of Somerset, a companion to an invalid lady at Bath when he met her. She is two-and-thirty."

[clues.orme_debt]
text = "In Brand's pocketbook: Orme's I.O.U. for six hundred pounds, with \"No hurry - L.B.\" pencilled beneath."

[clues.dissolution]
text = "In the library desk: a draft deed dissolving the partnership of Vane and Brand at the quarter's end."

