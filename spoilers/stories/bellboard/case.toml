# ================================================================ endings

[endings.solved]
title = "The Two Houses"
text = """
I laid it before him, and he heard me out with his eyes half-closed.

Brand had died at ten o'clock, with his hand on the speaking tube, calling for help that Gaunt heard and did not understand. No one had come to him through the hall: James had watched that door from his chair. At ten o'clock Vane was with me, Orme was shut in a cloakroom with one door and a barred window, Gaunt was at his tube with Ellen beside him, James was at the street door, every maid was at supper under Mrs Bale's eye, and Miss Orme was at her piano, which I had heard myself. But there was another door into the library, a jib door from the back stair, and at a minute past ten Parkes, hiding at the foot of that stair with a stolen cigar, had heard silk skirts go quickly up past him toward the top of the house. The back stair is limewashed, and Mrs Vane's blue silk was marked with lime. She had left the drawing-room at five minutes to ten, and Annie found her in the nursery at seven minutes past, out of breath, with a child that had been crying a long while alone. And in Brand's waistcoat was the reason: Clara Dunn, lady's maid, of Bath, tried in 1879 for a theft and acquitted; and a letter to her husband, burned in the grate.

"Excellent, Watson," said Holmes quietly. "Quite excellent. And quite dreadful."

We went up together to the drawing-room. She was sitting where I had left her, and when she saw our faces she stood up and said, before either of us could speak, "I have been waiting for you, Doctor Watson. I think I have been waiting for you for nine years."

She told it very simply. Brand's sister had seen her at the theatre a week since and known her. Brand had told her before dinner that he would tell her husband that night; he would not, he said, be party to a deception. She had gone down to beg him, only to beg him; and when he turned his back on her to whistle for the butler to have her shown out, she had taken up the poker without, she said, knowing that she did it.

"I did not take Mrs Ashcombe's brooch," she said. "The jury believed me. But no one else would ever have believed me again, and I could not have borne Edmund's face."

Vane, when he was told, sat a long while with his head in his hands. "I would not have cared," he said at last. "God help me, Watson, I would not have cared."

Holmes was silent all the way back to Baker Street in the cab. Only as we turned out of Oxford Street did he say, half to himself, "She killed to keep a secret that was no crime, from a man who would have forgiven it. There is the whole tragedy of the respectable classes, Watson, in a sentence."
"""

[endings.orme_taken]
title = "Lestrade's Man"
text = """
"It was Orme," I said, and I do not think I have ever said anything harder. "The debt, the quarrel, the seven minutes out of the room."

Holmes looked at me for a long moment, and then away. "Then you had better tell Lestrade," said he, "since you agree with him."

Lestrade was delighted. Hugh Orme was taken to Bow Street before dawn, and committed for trial at the next sessions. The cloakroom, the footman's evidence and the barred window were all brought forward by his counsel; the jury, after three hours, could not agree, and he was discharged. But he resigned his commission, and his clubs, and went abroad with his sister, and I never saw him again.

Holmes never once spoke to me of the case. Years afterward I found among his papers a single sheet headed "Pelham Square", with one line written on it: "W. heard the piano, and never asked who else was not listening."
"""

[endings.vane_taken]
title = "The Partner"
text = """
"It was Vane," I said. "Brand was taking his money out of the firm. Vane was upstairs, alone, at the very time."

Holmes raised his eyebrows. "Alone, Watson? Was he?"

But I had said it, and Lestrade, who had been ready to take Orme, was every bit as ready to take a rich man if a rich man was offered him. Vane was arrested in his own dining-room. His valet's evidence and mine got him off at the trial, as it was bound to; but the firm did not survive the scandal, and Vane did not long survive the firm. His widow sold the house in Pelham Square and went abroad.

"His widow," said Holmes, when I read him the notice. He said nothing more, and I did not understand him until a long while afterward.
"""

[endings.letitia_taken]
title = "The Nocturnes"
text = """
"It was Miss Orme," I said. "She was in the drawing-room, close to the stair. She would do anything for her brother."

"My dear Watson," said Holmes, very gently, "what was she doing at ten o'clock?"

I opened my mouth to answer, and heard again in my memory the piano coming down through the dining-room ceiling, unbroken, phrase after phrase, the whole of that long evening. I had sat beneath it and listened to it myself.

Miss Orme was never charged; Lestrade, to his credit, would not hear of it. But the thing had been said, and I had said it; and she never spoke to me again.
"""

[endings.servant_taken]
title = "Below Stairs"
text = """
I gave Lestrade my servant, and Lestrade, who had his own reasons for preferring that a gentleman should not be guilty of murder in Mayfair, took him gladly.

He was dismissed without a character the next morning, and held at Bow Street for a week, and released when the magistrate found that there was nothing whatever against him. But a servant dismissed without a character from a house where there has been a murder does not find another place. I made what amends I could, which were very few.

"You looked below stairs, Watson," said Holmes, "because that is where the gentry always look. You did not ask yourself who in that house knew the servants' ways better than the servants themselves."
"""

[endings.collapses]
title = "A Case That Would Not Hold"
text = """
I gave Holmes my account. He listened with closed eyes, and at the end of it he was silent a long while.

"The name may be the right one, Watson," said he at last, "or it may not. But the case you have built around it would not hold together for five minutes before a competent counsel. You have the wrong hour, or the wrong door, or the wrong reason, and any one of them is enough to hang an innocent man or free a guilty one."

The case was never brought to trial. Lestrade let it lie, and in time it was forgotten by everyone but the household at Pelham Square, and me.
"""

