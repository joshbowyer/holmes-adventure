# ================================================================ back stair

[items.walls_second]
name = "limewashed walls"
aliases = ["walls", "wall", "limewash", "whitewash"]
location = "back_stair_second"
scenery = true
clue = "limewash"
description = "Plain plaster, limewashed white. It was the old-fashioned soft wash that never sets hard, and where I had brushed against it in the narrow turn my coat-sleeve had come away chalky white. I beat it off as best I could, but a faint pale streak remained in the cloth."

[items.walls_first]
name = "limewashed walls"
aliases = ["walls", "wall", "limewash", "whitewash"]
location = "back_stair_first"
scenery = true
clue = "limewash"
description = "Plain plaster, limewashed white. It was the old-fashioned soft wash that never sets hard, and where I had brushed against it on the narrow half-landing my coat-sleeve had come away chalky white. I beat it off as best I could, but a faint pale streak remained in the cloth."

[items.walls_ground]
name = "limewashed walls"
