aliases = ["servants' clock"]
location = "servants_hall"
scenery = true
description = "A plain round clock, which Cook assured me she set by the church every Sunday. It agreed with my watch to the minute."

[items.tube_mouthpieces]
name = "speaking-tube mouthpieces"
aliases = ["mouthpieces", "tubes", "tube", "speaking tubes", "whistles", "whistle", "mouthpiece"]
location = "butlers_pantry"
scenery = true
description = """
A row of four brass mouthpieces, each lettered: LIBRARY, DINING RM, DRAWING RM, MASTER. Each was stopped with a little whistle on a chain. When someone upstairs blew into the tube, the whistle at this end shrieked, and the butler would pull it out and answer.
"""

[items.pantry_clock]
name = "pantry clock"
aliases = ["clock"]
location = "butlers_pantry"
scenery = true
description = "A brass-bound clock that struck the hours. Gaunt wound it himself every morning, and it agreed with my watch."

[items.plate_safe]
