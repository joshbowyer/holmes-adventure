# ================================================================ cloakroom

[items.cloakroom_window]
name = "cloakroom window"
aliases = ["window"]
location = "cloakroom"
scenery = true
clue = "cloakroom_window"
description = "A small window of frosted glass, high in the wall, no more than a foot square. Outside it were fixed three stout iron bars. No one larger than a child could have passed it, and no one at all through the bars. The cloakroom had no other door than the one by which I had come in."

[items.washstand]
name = "washstand"
aliases = ["basin", "marble washstand", "soap"]
location = "cloakroom"
scenery = true
description = "A marble washstand with a basin and a cake of Windsor soap."
on_examine = [
  { once = true, text = "In the soap-dish, half under the soap, someone had left a sixpence.", effects = ["move:sixpence_cloak:cloakroom"] },
]

[items.sixpence_cloak]
