# ================================================================ basement

[items.bell_board]
name = "bell-board"
aliases = ["bell board", "bells", "board", "bellboard"]
location = "servants_hall"
scenery = true
description = """
A long board of varnished pine, and upon it a row of brass bells, each hung upon its own coiled spring so that it would go on swinging for some while after it was rung, and show which it had been. Beneath each was a painted label:

| FRONT DOOR    LIBRARY      DINING RM    MORNING RM
| DRAWING RM    DRESSING RM  MISTRESS     SPARE RM
| NURSERY       SCHOOL RM

Every bell was still now.
"""

[items.supper_table]
name = "supper table"
aliases = ["table", "supper", "deal table", "bench", "benches"]
location = "servants_hall"
scenery = true
description = "The remains of the servants' supper: cold mutton, bread and cheese, a jug of beer. There were places for eight."
on_examine = [
  { once = true, text = "Under the bench, among the crumbs, lay a sixpence.", effects = ["move:sixpence_hall_below:servants_hall"] },
]

