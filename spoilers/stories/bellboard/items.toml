description = "Plain plaster, limewashed white. It was the old-fashioned soft wash that never sets hard, and where I had brushed against it on the landing my coat-sleeve had come away chalky white. I beat it off as best I could, but a faint pale streak remained in the cloth."

[items.bell_wires]
name = "bell-wires"
aliases = ["wires", "wire", "cranks", "crank", "bell wires"]
location = "back_stair_first"
scenery = true
description = "A dozen thin wires running in parallel along the angle of wall and ceiling, each turning the corner by its own small brass crank, and each, I supposed, going down to its own bell below."

[items.library_door_back]
name = "narrow door"
aliases = ["deal door", "painted door", "door", "library door"]
location = "back_stair_ground"
scenery = true
clue = "jib_door"
description = "A narrow door of painted deal with a plain iron latch. Across its top rail some servant long ago had stencilled a single word: LIBRARY. On this side it was any common door; on the other, I had no doubt, it was disguised as part of the wall."
on_examine = [
  { when = "!flag:jib_known", effects = ["set:jib_known"] },
]

[items.servery_door_back]
