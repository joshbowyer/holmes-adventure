# ================================================================ entrance hall

[items.footman_chair]
name = "footman's chair"
aliases = ["chair", "hooded chair", "porter's chair", "footman chair"]
location = "entrance_hall"
scenery = true
description = """
A tall leather chair with a hood like a sentry-box, to keep the draught of the street door from the footman's neck. From its seat a man commanded the whole of the hall: the street door before one, the foot of the main stair, the doors of the morning-room and the cloakroom, and, to the right, not a dozen feet away, the door of the library.
"""

[items.umbrella_stand]
name = "umbrella stand"
aliases = ["umbrellas", "stand", "sticks"]
location = "entrance_hall"
scenery = true
description = "A brass umbrella stand in the shape of an elephant's foot, full of sticks and umbrellas."
on_examine = [
  { once = true, text = "In the drip-tray at the bottom, among the sticks, a sixpence glinted.", effects = ["move:sixpence_hall:entrance_hall"] },
]

[items.sixpence_hall]
name = "sixpence"
aliases = ["coin", "sixpenny bit"]
location = "nowhere"
coin = true
description = "A silver sixpence."

[items.main_stair_walls]
name = "stair paper"
aliases = ["wallpaper", "paper", "walls", "wall"]
location = "first_landing"
scenery = true
description = "A figured paper of red and gold, smooth and costly. I passed my hand over it; nothing came away."

[items.street_door]
name = "street door"
aliases = ["front door", "door"]
location = "entrance_hall"
scenery = true
description = "A heavy door of black-painted oak with a fanlight above. A constable stood on the step outside."

# ================================================================ library

[items.body]
name = "body of Lionel Brand"
aliases = ["body", "brand", "lionel brand", "mr brand", "corpse", "dead man"]
article = "the"
location = "library"
scenery = true
cant_take = "Lestrade would have had something to say to that, and so would my own sense of decency."
description = """
Brand lay on his face beneath the speaking tube, one arm flung out above his head towards the wall as though he had been reaching up when he fell. He had been struck on the back of the head, a single heavy blow, and death must have followed very quickly. He was in his evening clothes still: black coat, white waistcoat, his watch-chain across it. I had examined him at half past ten, when Vane raised the alarm, and judged that he had then been dead perhaps half an hour or a little more.
"""

[items.waistcoat]
name = "Brand's waistcoat"
aliases = ["waistcoat", "pockets", "pocket", "coat", "brand's pockets", "evening clothes"]
location = "library"
scenery = true
description = "A white evening waistcoat, now sadly stained. Lestrade had already been through the outer pockets of the coat and found only a cigar-case and a handkerchief."
on_examine = [
  { once = true, text = "I knelt and felt in the waistcoat pockets, which Lestrade had overlooked. In the left one was a slim leather pocketbook; tucked behind the watch, in the right, a folded slip of newspaper.", effects = ["move:pocketbook:library", "move:cutting:library"] },
]

[items.pocketbook]
name = "pocketbook"
aliases = ["pocket-book", "pocket book", "notecase", "iou"]
location = "nowhere"
clue = "orme_debt"
description = """
A slim pocketbook of black morocco. Among visiting cards and a few banknotes was a half-sheet of paper:

| "I.O.U. Six Hundred Pounds. H. Orme. 2nd March, '88."

Across the foot, in Brand's hand, was pencilled: "No hurry — L.B."
"""

[items.cutting]
name = "newspaper cutting"
aliases = ["cutting", "newspaper", "slip", "clipping", "newspaper cutting"]
location = "nowhere"
clue = "cutting"
description = """
A paragraph cut from a newspaper, yellow with years and worn soft at the folds. Someone had written above it in ink: "Bath Chronicle, Oct. 1879."

| "QUARTER SESSIONS. Clara Dunn, 23, lady's maid, was indicted
| for stealing a diamond brooch, the property of her mistress,
| Mrs Ashcombe, of Lansdown Crescent. The evidence being wholly
| circumstantial, the jury, after a short deliberation, returned
| a verdict of Not Guilty, and the prisoner was discharged."
"""

[items.speaking_tube]
name = "speaking tube"
aliases = ["tube", "mouthpiece", "whistle", "brass mouthpiece", "speaking-tube"]
location = "library"
scenery = true
clue = "tube_plug"
description = """
A brass mouthpiece set into the wall at about the height of a man's chin, with a little hinged whistle that stops it when not in use. The whistle was not in its place. It hung down by its short chain against the wall, swinging a little in the draught, just above Brand's outflung hand. To summon a servant one pulled the whistle out and blew into the tube, so that it sounded at the other end; Brand, then, had been in the act of calling below stairs when he was struck.
"""

[items.poker]
name = "poker"
aliases = ["fire-irons", "fire irons", "irons", "fender", "brass poker"]
location = "library"
scenery = true
clue = "weapon"
cant_take = "Lestrade had forbidden anyone to touch it, and for once he was right."
description = """
The fire-irons stood in their rack: tongs, shovel and a heavy brass-headed poker. The poker had been put back with its head to the wall, the wrong way about from the others. Turning it to the light without lifting it, I saw that the brass knob had been wiped, but not well enough. There were two or three short grey hairs in the angle of the collar.
"""

[items.grate]
name = "fireplace"
aliases = ["grate", "fire", "hearth", "ashes"]
location = "library"
scenery = true
description = "The fire had sunk to embers. Among the ashes at the front of the grate, where the heat had not quite reached, were the curled black fragments of several sheets of paper."

[items.fragments]
name = "charred fragments"
aliases = ["fragments", "charred paper", "burnt paper", "burned paper", "letter", "remains"]
location = "library"
scenery = true
clue = "burnt_letter"
description = """
They were too far gone to lift, but by bending close with the lamp I could make out, here and there, a few words in a firm, sloping hand upon the browned edges of the sheets:

| "...My dear Vane... ...cannot in honour keep silent...
| ...my sister has this week... ...at Bath in '79...
| ...under another name... ...your wife..."

The rest was ash.
"""

[items.desk]
name = "writing-desk"
aliases = ["desk", "writing desk", "drawer", "drawers", "lamp"]
location = "library"
scenery = true
container = true
openable = true
open_text = "I drew open the drawer of the desk."
description = "A handsome kneehole desk of walnut, its lamp still lit. The blotter was fresh and blank, the pen laid down beside the inkstand. There was a drawer beneath."

[items.draft_deed]
name = "draft deed"
aliases = ["deed", "draft", "document", "partnership"]
location = "desk"
clue = "dissolution"
description = """
A lawyer's draft, dated this week: a deed for the dissolution of the partnership of "Vane and Brand, Contractors", by which Lionel Brand withdrew his capital from the firm at the end of the quarter. It was much marked in pencil in Brand's hand.
"""

[items.library_wallpaper]
name = "panelling"
aliases = ["wallpaper", "panelling", "paneling", "dado", "wall", "walls", "bookshelves", "shelves", "books"]
location = "library"
scenery = true
description = "Oak panelling to shoulder height, green flock above it, and books to the ceiling."
on_examine = [
  { when = "!flag:jib_known", text = "I went slowly along the panelling, as I had seen Holmes do. To the right of the shelves, where the dado met the bookcase, there was a hair-line in the varnish that ran straight up from the skirting and then across. I pressed the moulding beside it, and with a click a narrow section of the wall swung an inch inward upon darkness and a smell of limewash. A jib door, papered and panelled to match the room, upon the back stair.", effects = ["set:jib_known", "clue:jib_door"] },
]

[items.library_window]
name = "library window"
aliases = ["window", "curtains", "shutters"]
location = "library"
scenery = true
description = "Behind the curtains the shutters were closed and barred on the inside with an iron bar. Lestrade's constable had found them so at half past ten."

