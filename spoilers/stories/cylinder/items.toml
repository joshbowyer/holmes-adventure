# ================================================================ the laboratory

[items.new_phonograph]
name = "new phonograph"
aliases = ["phonograph", "machine", "new machine", "regulator", "speed regulator", "horn", "great horn"]
location = "laboratory"
scenery = true
description = "A fine new phonograph of mahogany and nickel, with a great brass horn and a speed regulator: a little dial and lever by which it could be made to turn its cylinder at anything from 60 to 240 times a minute. Holmes had it ready for me."

[items.siren]
name = "siren"
aliases = ["brass siren", "bellows", "stand", "tube"]
location = "laboratory"
scenery = true
description = "Cagniard de la Tour's siren: a brass disc pierced with holes, spun by a jet of air from the bellows, with a counter on top. Turned up until its note matches a sound, it tells how many vibrations a second that sound has. Holmes, with his violinist's ear, could match a note on it in a moment."

[items.dynamo]
name = "dynamo"
aliases = ["gas-engine", "gas engine", "engine", "whine"]
location = "laboratory"
scenery = true
clue = "dynamo"
description = "A little gas-engine driving a dynamo, for the laboratory's arc-lamp and its batteries. It whined as it ran, steadily, a thin high note. Holmes put the siren to it for me: two hundred vibrations, and never varying."

[items.lab_benches]
