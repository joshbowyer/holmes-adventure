# ================================================================ the study

[items.study_desk]
name = "desk"
aliases = ["plain desk", "big desk", "square", "clean square", "bare wood", "dust"]
location = "study"
scenery = true
container = true
clue = "machine_gone"
description = "A big deal desk, dusty, for the housemaid had orders never to touch it. In the middle of it was a clean square of bare wood, about a foot each way, with the marks of four small feet at its corners: something heavy had stood there for years, and had lately been lifted away. In front of it the dust had been rubbed into an arc, as by the base of a horn."
details = [ { when = "loc:syndicate_letter:study_desk", text = "Under a paperweight at the corner lay a letter on thin foreign paper." } ]

[items.syndicate_letter]
name = "letter"
aliases = ["foreign letter", "thin letter", "syndicate letter", "paper"]
location = "study_desk"
clue = "syndicate_letter"
description = """
A letter on thin paper, headed THE COLUMBIAN PHONOGRAPH SYNDICATE, BROADWAY, NEW YORK, and dated from their London agent, 5th May 1894:

'Dear Mr Ashdown, We are still without the signed assignment of your British and Colonial patents, which Mr Quarrie assured us on the 1st inst. you would execute on the 2nd. Our principals are pressing. May we beg you to sign and return it at your earliest convenience?'
"""

[items.cabinet]
name = "cabinet"
aliases = ["pigeon-holes", "pigeonholes", "tubes", "tall cabinet", "cylinders"]
location = "study"
scenery = true
container = true
clue = "cabinet_gaps"
description = "A tall cabinet of pigeon-holes, numbered 1 to 30, each holding a cylinder in a cardboard tube with a label. Most were full. Four were empty: Numbers 9, 14, 17 and 21, and in each the dust on the floor of the hole had been disturbed lately."
details = [ { when = "loc:cyl_s5:cabinet", text = "In Number 19, the newest, was a tube labelled 'Notes on the siren, Feb. 1894'." } ]

[items.catalogue]
name = "catalogue"
aliases = ["thick catalogue", "book", "list"]
location = "study"
scenery = true
clue = "catalogue"
description = """
Mr Ashdown's catalogue of his cylinders, in his own hand until Christmas last and in Miss Ashdown's after it. Each entry gave the number, the date, what was spoken, where, and on which machine: O for the old Edison in the study, N for the new machine in the laboratory. Among them:

'9. 3 Nov. 1893. To Beatrice, on her birthday. Morning room. N.'
'14. 15 Jan. 1894. Statement for the patent hearing. Study. O.'
'17. 12 Mar. 1894. Letter to the Columbian Syndicate. Study. N.'
'19. Feb. 1894. Notes on the siren. Laboratory. N.'
'21. 20 Apr. 1894. Notes for Quarrie. Laboratory. O.'

On the flyleaf, in Miss Ashdown's hand: 'O: governor seized 28 March. Runs at 120 only. N: set at 160 for all recording.'
"""

[items.regulator]
