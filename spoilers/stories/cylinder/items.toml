location = "laboratory"
scenery = true
container = true
description = "Benches all round the room, covered with the litter of a lifetime's work: lathes, coils, jars, diaphragms of glass and mica, wax shavings."
details = [ { when = "loc:coin_lab:lab_benches", text = "Among the wax shavings at the end of one lay a shilling." } ]

