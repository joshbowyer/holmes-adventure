[items.orme_phonograph]
name = "Quarrie's phonograph"
aliases = ["new machine", "clean machine", "common machine", "quarrie's phonograph", "quarrie's machine"]
location = "orme_room"
scenery = true
clue = "orme_machine"
description = "A cheap, clean phonograph of the common sort, set up to record: its recording diaphragm was in place, not the reproducer. Its governor had been set with a screw, and a pencil mark scratched on the dial against the figure 150."

[items.old_machine]
name = "old phonograph"
aliases = ["old machine", "edison", "black and gold", "old edison", "old phonograph"]
location = "orme_room"
scenery = true
clue = "old_machine_here"
description = "An old Edison phonograph of the first pattern, black and gold, with its brass horn. On its base, in white paint, a number: C.A. 1. Its governor was rusted solid. I tried the handle: the mandrel turned, and the governor balls stood out at the one speed they could, which the marks on the dial put at 120. It was set up to play, not to record."

[items.horns]
name = "horns"
aliases = ["brass horns", "cord", "muffler", "join", "lashed horns"]
location = "orme_room"
scenery = true
clue = "horns"
description = "The two brass horns, the old machine's and the new one's, turned mouth to mouth and lashed together with cord, and a woollen muffler wrapped round the join to keep out the noises of the room. Whatever the old machine played, the new one would take down; and whatever else was in the room would get in through the muffler as well, I fancied, if it were loud enough."

