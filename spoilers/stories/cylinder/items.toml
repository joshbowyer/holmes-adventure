scenery = true
clue = "regulator"
description = "A plain mahogany regulator with a long pendulum beating seconds, sixty to the minute, with a heavy tick that filled the room. Any cylinder made in this room would have it ticking in the background, I thought, like a second heart."

[items.fork_case]
