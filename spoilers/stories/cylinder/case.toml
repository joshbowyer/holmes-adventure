# ================================================================ endings

[endings.solved]
title = "Two Speeds"
text = """
"It is his voice," I said, "and every word of it he spoke. But he never spoke them together, nor in that order, nor on that day.

"Every cylinder he ever made begins with his fork, so that anyone who plays him may know how fast he went round. On the will the fork sounds true at 200, and so do four parts of the voice. Three other parts sound true at 150, and so does everything behind the voice from first to last: the rain, the cough, the train, and a cracked bell striking eleven. A man speaking once into a machine makes a cylinder with one true speed, Holmes. This one has two, and neither of them is the 160 that Quarrie swears to.

"It is a copy, made in pieces, horn to horn. Somebody played fragments of Ashdown's own cylinders on a machine that runs at 120 and nothing else, his old Edison with the seized governor, into a machine recording at 150. What Ashdown made at 160 comes out true at 200; what he made at 120 comes out true at 150, with the room it was copied in. And the pieces are all in the hatbox under Quarrie's bed: the letter to the Syndicate, for his name and 'I leave'; the statement for the patent hearing, for 'I know very well what I have signed', which he said of a patent specification; Miss Ashdown's birthday cylinder, canary and all, for 'Everything I have' and 'My children will understand'; and the notes Ashdown left for Quarrie in the laboratory, for 'Felix Quarrie, my faithful assistant, who has been a son to me', with the dynamo whining under it. The words fit two cylinders in more than one place; the speeds never do.

"The room behind it all has a skylight that drums in the rain, and a railway under its window, and a church bell at the corner that is a cracked C with no quarters: St Cuthbert's, not St Jude's. It rained at eleven at night on two nights only, the 3rd and the 9th; on the 3rd Quarrie was sitting up with the old man at the Larches. It was the 9th. Quarrie had taken the old machine away the day before, 'to be mended', and his landlady heard a dead man talking through her ceiling while St Cuthbert's struck eleven. Cornelius Ashdown had been dead two days.

"As for the 2nd of May, he signed what Quarrie read him, and Quarrie read him the American assignment. The Syndicate is still waiting for it. And he died of his heart, in his sleep, as Lammas says. Quarrie did not kill him. He only robbed him, which he found easier with the old man dead."

Holmes had listened with his eyes half closed and his fingertips together.

"A phonograph, Watson," said he, "is a perfectly honest witness. It tells you everything it heard, including a great deal its owner would much rather it had not. Mr Quarrie was a clever young man with his hands; but he forgot that the walls of his room had a voice too." He rose. "Let us go and see Mr Tulliver. He will want to put this in proper form; and then, I think, Mr Quarrie will want a solicitor of his own."

The will of the 2nd of May was pronounced against in the Probate Division that autumn, and Felix Quarrie was tried at the Old Bailey for fraud and forgery, and got five years. The cylinder was produced at his trial and played to the jury, at 150 and at 200, by an expert from the Edison company, with Holmes's evidence; I believe it is the only time a bell in Kentish Town has given evidence at the Central Criminal Court. Miss Ashdown keeps her father's birthday cylinder still. She has never been able to bring herself to play it.
"""

[endings.orme_walks]
title = "His Master's Voice"
text = """
I gave Holmes my account, with Quarrie's name in it, and he heard me to the end.

"You are right about the man, Watson," said he, "and you will not hang a dog on it. You have not shown what the cylinder is, or where it was made, or when, or you have shown it wrongly; and Mr Quarrie's counsel will play that cylinder to the court at 160, and every soul in the room will hear Cornelius Ashdown say that he knows very well what he has signed."

And so it fell out. The will of the 2nd of May was admitted to probate. Felix Quarrie sold the Larches within the year and went to America, where I am told he does very well in the phonograph business.
"""

[endings.genuine]
title = "In His Own Voice"
text = """
"It is genuine," I said. "His own voice, and his own words. I don't see how we can go behind it."

Holmes said nothing whatever, and I had the uncomfortable feeling that I had failed a test.

The will was admitted to probate. Miss Ashdown went to be a governess in Cheltenham, and Mr Hubert Ashdown to the Argentine. Mr Quarrie was very civil to them both. The Larches was sold, and the old study cabinet, I heard, went with the house, with four pigeon-holes in it empty.
"""

[endings.edmund_taken]
title = "The Prodigal"
text = """
"Hubert," I said. "He had debts, and the most to gain from upsetting the will."

"From upsetting it, Watson," said Holmes, "not from making the cylinder that supports it. You have him forging evidence against himself. And he was in Brighton, which half the Metropole will swear to."

Nothing came of it but a quarrel between brother and sister, and the will stood.
"""

[endings.clara_taken]
title = "The Daughter"
text = """
"Miss Ashdown," I said. "She kept his catalogue and wrote his labels, and she knew every cylinder he ever made."

Holmes looked at me for a long moment. "She brought us the case, Watson," he said, "and asked us to prove the very thing you now say she did. It would be a curious way to commit a fraud."

The will stood, and I could not look Miss Ashdown in the face when we left the house.
"""

[endings.dunn_taken]
title = "The Witness"
text = """
"Mrs Tebbutt," I said. "She witnessed the signing."

"She witnessed a signature," said Holmes, "and could not have made a phonograph cylinder if her life depended on it. Come, Watson."

The will stood.
"""

[endings.crossed]
title = "Crossed Wires"
text = """
I told Holmes where each part of the cylinder had come from, and he heard me with growing gloom.

"That will not do, Watson," he said. "Put that before an expert, and the first part you have wrong will undo all the rest. The words fit more than one cylinder in more than one place. It is the speeds that decide it, and the sounds beneath the words."

He was right, and Quarrie's counsel would have been quicker to see it than he. The case was never brought.
"""

[endings.loose_ends]
title = "Loose Ends"
text = """
"You have some of it, Watson," said Holmes, "and all of it right, so far as it goes. But a cylinder pieced together from four is only proved so when every piece is traced, and you have not traced every piece. Go back and find the rest."

Without it, the will stood.
"""

