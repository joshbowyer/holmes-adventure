[case]
id = "cylinder"
title = "The Wax Cylinder Will"
year = 1894
order = 70
start = "gate"
coin_name = "shilling"
coin_plural = "shillings"
hint_intro = "I gave Holmes a shilling. He dropped it into his waistcoat pocket without looking at it, and spoke with his eyes on the turning cylinder."
hint_none = "\"You have every piece, Watson,\" said Holmes. \"Settle where each part of that cylinder came from, and ACCUSE.\""
hint_broke = "I had not a shilling about me. \"Look about you,\" said Holmes. \"A house in mourning is careless of its change.\""
intro = """
It was in the May of 1894, not many weeks after my friend's return to London from the dead, that Miss Beatrice Ashdown called upon us in Baker Street, in deep mourning and very composed, and laid before Holmes the strangest piece of evidence I think he ever had to weigh: a cylinder of brown wax.

Her father, Mr Cornelius Ashdown, the electrician and inventor, whose improvements to the phonograph had made his name, had died in his sleep on the 7th of the month at his house in Highgate. Five days before his death, blind and failing, he had signed a will which left everything he had to his young assistant, Mr Felix Quarrie. His children had disputed it, saying that the old man could not have known what he signed; and Mr Quarrie had answered them with the cylinder, on which, he said, Mr Ashdown had spoken his last wishes aloud on the very afternoon of the signing, in his own voice, for all the world to hear.

"It is my father's voice, Mr Holmes," said Miss Ashdown. "I cannot pretend that it is not. And yet I know that he never said those words."

Holmes had sat through it all with his eyes closed. Now he opened them.

"A phonograph cylinder, Miss Ashdown," said he, "is a very good witness to a man's voice. It is a very poor witness to anything else, unless one knows how to question it. Watson, your hat."

So it was that before noon that day our cab drew up at the gate of the Larches, on the top of Highgate Hill.
"""
intro_note = "[In this case you must listen to phonograph cylinders. At the machine in the laboratory, PLAY <letter> AT <speed> plays one, and Holmes measures every sound on it; CYLINDERS lists what you have. The cab takes you between Highgate and Kentish Town: GO CAB. Shillings found while exploring buy hints from Holmes with HINT.]"

[verbs]
take_cab = ["hail", "board", "ride", "drive"]

# ================================================================ clues

[clues.found]
text = "Miss Ashdown's account: her father, Cornelius Ashdown, inventor, signed a will on 2 May leaving all to his assistant Felix Quarrie, and died on 7 May. Quarrie has produced a cylinder of Ashdown's voice, which he says was spoken on 2 May, confirming it. Miss Ashdown says her father never said those words."

[clues.speed_rule]
text = "Holmes: a cylinder played faster than it was made goes up in pitch and quickens; slower, it drops and drags, every sound in the same proportion. A sound whose true pitch or rate is known is a key to the speed a cylinder was made at."

[clues.orme_story]
text = "Quarrie: Ashdown spoke the cylinder himself in his study on the afternoon of 2 May, after signing, on the new machine brought in from the laboratory, at 160 as they always recorded; Quarrie labelled it, as Ashdown could not write, and put it in the cabinet."

[clues.orme_machine_lie]
text = "Quarrie: the old Edison's governor seized in March, and he has taken it to a man in Clerkenwell to be mended."

[clues.orme_lodgings]
text = "Quarrie: he has not slept at his lodgings in Kentish Town since April."

[clues.fork_habit]
text = "Miss Ashdown: her father always struck his tuning fork, A 435, the French pitch, before speaking to a phonograph, 'so that anyone who plays me may know how fast I went round'. His voice was deep and slow."

[clues.blind_clara]
text = "Miss Ashdown: after Christmas her father could not read or write; she kept his catalogue and wrote his labels."

[clues.judes_bell]
text = "Miss Ashdown: St Jude's, Highgate, which can be heard all over this side of the house, is an E flat, 311 vibrations by her father's siren, and strikes the quarters as well as the hours."

[clues.orme_cough]
text = "Miss Ashdown: Quarrie lodges at Mrs Prout's, Bartholomew Terrace, Kentish Town. He has had a short dry double cough since the winter."

[clues.will_label]
text = "Miss Ashdown: the label on the will cylinder, 'My Will. 2nd May 1894. C. Ashdown.', is not her father's hand nor hers. It is Quarrie's."

[clues.edmund_claim]
text = "Hubert Ashdown says his father was poisoned with his digitalis drops, which Quarrie gave him at night."

[clues.edmund_debts]
text = "Hubert owes eleven hundred pounds, and would have half under the old will. He says he was at Brighton from 1 to 10 May."

[clues.old_will]
text = "Tulliver: the old will of 1889 left everything to Beatrice and Hubert equally."

[clues.new_will]
text = "Tulliver: the new will, dated 2 May 1894, leaves all to Quarrie; signed in a blind man's scrawl; witnessed by Mrs Tebbutt and Bates; produced by Quarrie from the study desk on the day of the death. To upset it the family must show Ashdown did not know and approve what he signed."

[clues.cylinder_law]
text = "Tulliver: a spoken will is no will, but the cylinder is evidence that Ashdown knew what he signed. If the cylinder is false, it is a fraud on the court, and the will falls with it."

[clues.lammas_death]
text = "Dr Lammas: angina for three years, worse since March; Ashdown died in his sleep about 4 a.m. on 7 May. A natural death; he certified it without doubt."

[clues.blind]
text = "Dr Lammas: double cataract, far gone. Ashdown could not have read a line since Christmas; he signed by feel."

[clues.lammas_digitalis]
text = "Dr Lammas: digitalis poisoning means vomiting and a wild pulse, not a quiet death in sleep; and Miss Ashdown kept a book of every drop."

[clues.dunn_signing]
text = "Mrs Tebbutt: on 2 May, in the afternoon, Quarrie read aloud a long paper about patents and the American gentlemen; Ashdown said, 'That's the American business,' and signed where Quarrie put his hand, two or three times; she and Bates witnessed without reading."

[clues.bates_signing]
text = "Bates: on 2 May Quarrie read out something about patents; Ashdown said, 'This is the American business, Bates,' and signed. A fine day; Bates had been mowing."

[clues.dunn_nights]
text = "Mrs Tebbutt: Quarrie sat up with Ashdown every night from Thursday 3 May until the death in the early morning of Monday the 7th. After the death he was mostly away at night."

[clues.machine_taken]
text = "Mrs Tebbutt: Quarrie took the old study machine away in a cab on Tuesday 8 May, the day after the death, 'to be mended'."

[clues.prout_orme]
text = "Mrs Prout: Quarrie has lodged with her three years; up at Highgate mostly since April; last Tuesday he came back in a cab with a great black-and-gold machine, and has been in and out at night since."

[clues.prout_night]
text = "Mrs Prout: one night last week (she does not know which), late, in pouring rain, she heard through the ceiling the old gentleman's slow deep voice, stopping and starting, sometimes squeaky, sometimes slow; St Cuthbert's struck eleven while it went on, and Quarrie coughed."

[clues.gosling_bell]
text = "The verger of St Cuthbert's: the tenor is a C, cracked in 1889, and buzzes; the clock strikes the hours on it, and no quarters."

[clues.machine_gone]
text = "The study desk: a clean square in the dust where something heavy stood on four small feet until lately, with an arc rubbed by the base of a horn."

[clues.syndicate_letter]
text = "The Syndicate's letter of 5 May: they are still without the signed assignment of Ashdown's patents, which Quarrie told them Ashdown would sign on the 2nd."

[clues.cabinet_gaps]
text = "The study cabinet: pigeon-holes 9, 14, 17 and 21 are empty, the dust in them lately disturbed."

[clues.catalogue]
text = "Ashdown's catalogue: 9, To Beatrice, birthday, 3 Nov. 1893, morning room, N. 14, Statement for the patent hearing, 15 Jan. 1894, study, O. 17, Letter to the Columbian Syndicate, 12 Mar. 1894, study, N. 19, Notes on the siren, Feb. 1894, laboratory, N. 21, Notes for Quarrie, 20 Apr. 1894, laboratory, O. Flyleaf: O (old Edison) seized 28 March, runs at 120 only; N (new machine) set at 160 for all recording."

[clues.regulator]
text = "The study regulator beats seconds: sixty to the minute, loud enough to tick on any cylinder made in the study."

[clues.fork]
text = "Ashdown's tuning fork, on his study desk: A 435, diapason normal."

[clues.dynamo]
text = "The laboratory dynamo whines steadily at 200 vibrations a second (Holmes's siren)."

[clues.canary]
text = "Miss Ashdown's canary in the morning room sings at about 3,000 vibrations a second (Holmes's siren)."

[clues.medicine_book]
text = "Miss Ashdown's medicine book: digitalis, ten drops at night since April, the bottle measured weekly; the drops given and the drops gone agree to the last week."

[clues.spectacles]
text = "Ashdown's cataract spectacles: lenses as thick as a tumbler's bottom. With such eyes he could read nothing."

[clues.rain_book]
text = "Bates's rain book for May, read at 9 a.m.: 1st and 2nd nil, fine all day on the 2nd; rain from 10 p.m. on the 3rd; nil from the 5th to the 9th at 9 a.m.; rain on the 9th from 9 p.m. till 2 in the morning; nil from the 11th."

[clues.orme_skylight]
text = "Quarrie's room in Kentish Town has a skylight right over the table, which leaked in recent rain; a shower on it would drum loudly."

[clues.orme_machine]
text = "Quarrie's own phonograph, in his room, set up to record, its governor screwed fast at 150."

[clues.old_machine_here]
text = "Ashdown's old study Edison (C.A. 1) is in Quarrie's room, not at any mender's, set up to play; its governor rusted solid at 120."

[clues.horns]
text = "In Quarrie's room the horns of the two machines are lashed mouth to mouth, with a muffler round the join: whatever the old machine plays, the new one records."

[clues.cuthbert_bell]
text = "The bells of St Cuthbert's, Kentish Town: the tenor is C, 262 vibrations, cracked 1889; the clock strikes the hours on it."

[clues.will_cyl]
text = "Tulliver gave me Quarrie's cylinder, labelled 'My Will. 2nd May 1894. C. Ashdown.'"

[clues.cyl_siren]
text = "From the study cabinet: cylinder 19, Notes on the siren, Feb. 1894."

[clues.cyl_syndicate]
text = "From the hatbox in Quarrie's room: cylinder 17, Letter to the Columbian Syndicate, 12 Mar. 1894, lately much played."

[clues.cyl_orme]
text = "From the hatbox in Quarrie's room: cylinder 21, Notes for Quarrie, 20 Apr. 1894."

[clues.cyl_birthday]
text = "From the hatbox in Quarrie's room: cylinder 9, To Beatrice, on her birthday, 3 Nov. 1893."

[clues.cyl_hearing]
text = "From the hatbox in Quarrie's room: cylinder 14, Statement for the patent hearing, 15 Jan. 1894."

[clues.will_bell_true]
text = "Played at 150, everything behind the voice on the will cylinder sounds as it should: rain drumming on glass, a church bell with a cracked buzz striking eleven at 262 vibrations, a railway whistle, a man's short dry double cough."

[clues.will_fork_true]
text = "Played at 200, the tuning-fork note at the start of the will cylinder sounds at 435."

[clues.s1_true]
text = "The Syndicate cylinder plays true at 160: its fork sounds at 435."

[clues.s2_true]
text = "The Notes for Quarrie cylinder plays true at 120: its fork sounds at 435."

[clues.s3_true]
text = "The birthday cylinder plays true at 160: its fork sounds at 435."

[clues.s4_true]
text = "The patent hearing cylinder plays true at 120: its fork sounds at 435."

[clues.s5_true]
text = "The siren cylinder plays true at 160: its fork sounds at 435."

