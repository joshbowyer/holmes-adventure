[[hints]]
id = "reckoning"
texts = [
  "\"Two speeds on one cylinder, Watson. A man speaking into a machine makes one cylinder at one speed. What makes a cylinder with two? And at which of the two does the room behind the voice sound true, and what room is it?\"",
  "\"Every part of the will that sounds true at 200 was made at 160 and played back at 120; every part true at 150 was made at 120 and played back at 120. The old Edison runs at 120 and nothing else, and Quarrie's machine records at 150. Match each part's words to a source cylinder, and where the words fit two, let the speed and the sounds under it decide. Then the bell, the rain book and Mrs Tebbutt will tell you where and when.\"",
  "\"The bell at 150 is St Cuthbert's cracked tenor, not St Jude's; there are no quarters. It rained at eleven at night only on the 3rd and the 9th, and on the 3rd Quarrie was sitting up at the Larches. So the cylinder was put together in Quarrie's room on the night of the 9th, two days after the old man died, from the four cylinders in the hatbox. What Ashdown signed on the 2nd, he signed as the American assignment. And he died of his heart. SOURCE each part, and ACCUSE.\"",
]

# ================================================================ the reckoning

[final]
type = "cylinder"
intro = "I went back to the laboratory with my cylinders in a basket, like a man come back from market. Holmes looked up from the siren. \"Well, Watson?\""
good = "solved"
