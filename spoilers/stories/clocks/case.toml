# ================================================================ endings

[endings.solved]
title = "Nine by the Church"
text = """
Holmes heard me to the end without once interrupting, which in those early days I did not yet know for the compliment it was. Then he knocked out his pipe.

"Excellent, Watson. You see it all. Every alibi in this town was true, and every witness honest, and every clock but one was doing exactly what its owner believed. The whole art of the thing lay in that one. Mr Vodden sat in the schoolroom on Monday evening and watched the vicar put Lethbridge's clock back sixteen minutes, and knew that Lethbridge would never notice, and that the whole town would read whatever that clock said as railway time, because Lethbridge would swear it was. So he made his appointment for nine by the school clock, and his appointment with Gloyne for nine by the church, and the two nines were the same nine. He had only to walk four minutes between them."

We went across to the bank together, with Sergeant Pascoe behind us. Vodden was at his desk. He listened to Holmes with his smile growing fixed and fixed, and when Holmes came to the drawer under the counter and the empty chamber, he made one quick movement towards the roll-top desk, and the sergeant was on him.

The Market Trust's ledger, when it was opened, told the rest. He had been taking its money for three years to cover his losses in Cornish mining shares, and Gloyne, with his lawyer's fussiness over figures, had found him out. Gloyne had given him one chance, at nine by the church, by the garden door. Vodden had come with the bank's revolver in his pocket, and had never meant to take the chance at all.

Edward Gloyne took the afternoon train back to Exeter, a richer and, I hope, a wiser man. The vestry met on Thursday as had been arranged, and, as a mark of respect to the late Clerk, confirmed his motion without a division. But I am told that the Reverend Mr Squance has not yet altered his clock, and that the School clock is still a standing joke between him and the schoolmaster.

"There was a case at Dorchester assizes, Watson, some twenty years ago," said Holmes, as the train drew out of Hatherleigh, and he watched the church tower go by. "A gentleman lost his action by arriving late by the clock of the court, though he was early by the clock of the town, and Parliament has been tidying up after it ever since. They will never quite manage it. Men will always carry two times about with them: the time that is, and the time they believe."
"""

[endings.muddle]
title = "Three Clocks at Once"
text = """
Holmes ran his eye down my order of events, and then down it again, and laid the notebook on his knee.

"My dear Watson," said he gently, "you have arranged the clocks, not the evening. Look: on your showing, a thing that happened by the church comes before a thing that happened by the railway, because the figures stand so. But the figures are in two different languages. Until they are in one, the order means nothing at all, and anyone who reads it will hang the wrong man, or none."

He was right, and I knew it. Sergeant Pascoe, who had no such scruples, arrested Edward Gloyne that afternoon on the strength of twenty minutes he could not account for, and it was a week before the magistrates let him go again. By then the murderer had had time to put his affairs in such order as they would bear.

"Go back, Watson," said Holmes. "One clock. Then put them in order."
"""

[endings.edward]
title = "The Nephew"
text = """
"Edward?" Holmes shook his head. "He left Fore House as the church struck the three-quarters, which is a minute past nine by any clock that matters. The 9.5 left at five past, by the station, with Edward thrown into it by the porter. He ran down that hill in four minutes because he thought he had already missed his train. He was the one man in Hatherleigh last night who was trying to keep the wrong time, Watson, and it saved his neck."

But I had said it in the sergeant's hearing, and Pascoe, who had wanted to say it himself all morning, took young Gloyne before the magistrates that afternoon. He was committed for trial on my evidence. It was a month before the truth came out at the assizes, and I have not often been so ashamed of anything.
"""

[endings.luxton]
title = "The Farmer"
text = """
"Luxton?" said Holmes. "He hated the man and said so, which is what an honest farmer does; murderers are commonly more polite. And at the moment of the shot he was flat on his back in the straw with the ostler, hauling on the legs of a cast mare. Huxtable heard the shot with him."

Luxton, however, had heard my opinion of him through the parlour floor, and came up the stairs to tell me his own. It was a remarkable opinion and I shall not record it. Week Farm went to the auctioneer in December; the real murderer, meanwhile, had time to consider his position, and used it.
"""

[endings.vicar]
title = "The Vicar"
text = """
"The vicar?" Holmes smiled. "He did not love Gloyne, and he would have resigned his living sooner than see his clock put right. But at the moment of the shot he was standing beside the works of his clock, watching its hammer fall, with the sexton holding his lantern. He is the one man in this case whose alibi is the very clock itself."

It was too late. I had already put the question to Mr Squance in the vestry, and he had answered it in the language of the Commination Service. The story ran round Hatherleigh in an hour, and the bishop heard of it in a week. Meanwhile the man who had done it went quietly about his business.
"""

[endings.lethbridge]
title = "The Schoolmaster"
text = """
"Lethbridge?" said Holmes. "The one honest, muddled man in the business. He swore to the time on his clock, and the time on his clock was true; it was only the clock that had been told a lie, and he was not there when it was told. He was at home, reading Euclid, with a man playing chess against him who had just killed another."

My opinion went round the town by dinner-time, and the managers, who had never liked Lethbridge's railway-time opinions, gave him notice by the end of the week. The real culprit, I need hardly say, was among the managers who signed it.
"""

[endings.escape]
title = "The Right Man, the Wrong Case"
text = """
Holmes heard me out, and then shook his head.

"You have the right man, Watson, and you would lose him at the trial. Counsel would take your account to pieces in a quarter of an hour, for half of it is wrong, and when a jury has seen half a case fall down, it will not stay to look at the other half. A man is not hanged on a good guess."

We went to the bank with the sergeant, and our man listened with a polite smile and sent for his solicitor from Exeter, who listened with a less polite one. By the time the case came before the magistrates, the drawer had been cleaned, the ledger had been mended, and our man had an answer to everything I had got wrong. He was discharged.
"""

