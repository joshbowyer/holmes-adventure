[case]
id = "clocks"
title = "The Two Clocks of Hatherleigh"
year = 1881
order = 30
start = "platform"
coin_name = "halfpenny"
coin_plural = "halfpence"
hint_intro = "I laid a halfpenny on the arm of Holmes's chair. He took it up without looking at it, spun it once, and put it in his waistcoat pocket."
hint_none = "\"You have everything, Watson,\" said Holmes. \"Set it in order on the TIMELINE, and then ACCUSE.\""
hint_broke = "I had not a halfpenny about me. \"Then go and find one,\" said Holmes. \"This is a market town; they lie about like leaves.\""
counters = { walk = 0, round = 0 }
intro = """
It was in the October of 1881, when I had shared rooms with Sherlock Holmes for less than a year and was still very far from understanding him, that a telegram reached Baker Street from a little market town on the edge of Dartmoor:

| UNCLE JOSIAH GLOYNE SHOT DEAD LAST NIGHT. POLICE SUSPECT ME.
| BEFORE GOD I AM INNOCENT. COME. EDWARD GLOYNE, FORE HOUSE,
| HATHERLEIGH.

We went down by the night mail and the early branch train, and came into Hatherleigh at twenty minutes to eleven on the Wednesday morning, the 19th, in a thin cold drizzle. Holmes stood for a moment on the platform, looking from the station clock above the booking-office door to the clock on the church tower up the hill, and back again. Then he gave a short laugh.

"There is your case, Watson," said he. "Two clocks, and one of them is lying. Or both; or neither. I shall take rooms at the inn and sit by a fire. The town is yours. Bring me every time you are given, and the name of the clock it was read from."

He went off up the hill behind the omnibus, and left me on the platform.
"""
intro_note = "[Every witness in this case tells time by some clock or other. TIMELINE shows the events you have fixed to a time; ARRANGE puts them in order. Halfpence found while exploring buy hints from Holmes with HINT.]"

# ================================================================ clues

[clues.found]
text = "Josiah Gloyne, attorney, of Fore House, Hatherleigh, was shot dead on Tuesday night, the 18th. His nephew Edward, who wired for us, is suspected."

[clues.watch_set]
text = "My own watch was set at Waterloo last night: it keeps London (railway) time, which is now by Act of Parliament the legal time."

[clues.sixteen]
text = "Mr Kingdon, stationmaster: Hatherleigh's local time is 16 minutes behind London time. The station keeps London time; the church keeps local time. \"When the church says nine, it's sixteen minutes past nine by us.\""

[clues.porter_shot]
text = "Pook, the porter, heard the shot from the platform at sixteen minutes past nine by the station clock. The rain had stopped a few minutes before."

[clues.church_std]
text = "The church clock is sixteen minutes slow by my watch: it keeps local time, by the vicar's will."

[clues.inn_std]
text = "The King's Arms clock keeps railway time (within a minute of my watch). Vosper sets it by the station every Monday."

[clues.bank_std]
text = "The bank clock keeps London time to the minute by my watch."

[clues.school_std]
text = "The schoolroom clock is sixteen minutes slow by my watch. Whatever Lethbridge believes, it is keeping church time."

[clues.gloyne_church_time]
text = "Gloyne kept church time in his own house: the long-case clock in his hall is sixteen minutes slow by my watch."

[clues.clock_put_back]
text = "The vicar put the school clock back to church time himself on Monday evening, at the managers' meeting. Vodden was there and laughed at him; Gloyne minuted it."

[clues.minute_book]
text = "School managers' minutes, Monday 17th: present the Chairman (Squance), Mr Vodden, the Clerk (Gloyne). \"The Chairman ... himself put [the School clock] back to the time of the Parish Church.\" Mr A. Vodden is Treasurer."

[clues.chess_fixed]
text = "Lethbridge: Vodden proposed the game himself after the managers' meeting on Monday: \"Tomorrow at nine, Lethbridge, and mind, nine by your school clock.\""

[clues.wound]
text = "Gloyne was shot once through the chest from in front, at a yard or two: powder-blackening on his waistcoat. He was standing, facing his killer."

[clues.bullet]
text = "The ball, dug from the panelling by Sergeant Pascoe: a conical revolver ball, about .38. Not from Gloyne's own pistol."

[clues.desk_pistol]
text = "Gloyne's own pocket pistol was in his desk drawer, loaded and unfired. He never reached for it."

[clues.diary]
text = "Gloyne's diary, Tuesday 18th: \"3 o'c. Mr Luxton, Week Farm, re mortgage: will NOT extend. 9 o'c. The Treasurer. Last chance.\""

[clues.draft_notice]
text = "Gloyne's draft notice: a Special Meeting of the Market Trust on Thursday \"to consider the state of the Treasurer's account, in which the Clerk has found a deficiency of £812.\""

[clues.garden_door]
text = "Mrs Bickle: Gloyne bolted the garden door himself at dusk last night, as always. After the body was found, it was unbolted top and bottom."

[clues.prints]
text = "On the churchyard path from Fore House's garden gate to the lych gate: a man's footprints, long-strided, toes towards School Lane, sharp-edged, so made after the rain stopped."

[clues.lych_unlocked]
text = "Medland, sexton, locked all three churchyard gates at dusk. This morning the lych gate on School Lane was unlocked and standing open."

[clues.keys]
text = "Keys to the churchyard gates: the vicar, the sexton, and the two churchwardens, Mr Vodden and Mr Luxton. (Gloyne had a key to his own garden gate only.)"

[clues.shortcut]
text = "From Gloyne's garden door through the churchyard to School Lane: four minutes at a brisk walk, by my watch."

[clues.long_way]
text = "From the square round by Church Street to School Lane: the better part of nine minutes, by my watch."

[clues.revolver]
text = "The bank's revolver, in the drawer under the counter: one chamber fired, the barrel foul and smelling of powder, about .38 calibre."

[clues.pring_revolver]
text = "Pring cleaned and loaded the bank's revolver on Monday. Mr Vodden keeps the drawer key at night, and had it last night."

[clues.edward_quarrel]
text = "Mrs Bickle heard Gloyne tell Edward at a quarter past eight: \"Not another penny, and you'll go now, sir, for I have someone coming at nine on business.\""

[clues.luxton_threat]
text = "Luxton, whose farm Gloyne was taking under the mortgage, swore in the market on Tuesday that he would see Gloyne in hell first."

[clues.luxton_stable]
text = "Huxtable, ostler: Luxton was down in the straw with him, getting the cast mare up, when they heard the shot. He never left Huxtable's sight while he was out of the tap."

[clues.vestry_motion]
text = "Gloyne carried a motion in the vestry to put the church clock on Greenwich time, to be confirmed on Thursday. Somebody pencilled on the notice: \"Not while I am Vicar.\""

[clues.vodden_story]
text = "Vodden: locked the bank at a quarter to nine, went home for his coat, walked round by the square and Church Street, and knocked at the schoolhouse at five past nine."

# --- timeline cards

[clues.card_bank]
text = "Pring: Vodden locked up the bank and left at a quarter to nine by the bank clock."

[clues.card_tower]
text = "Medland: he and the vicar went up the tower to wind the clock at twenty to nine by the church clock."

[clues.card_edward]
text = "Edward: he left Fore House as the church clock struck the three-quarters (a quarter to nine), and ran for the train."

[clues.card_train]
text = "Pook: the up train left at five minutes past nine by the station clock, with Edward Gloyne bundled in as it moved."

[clues.card_luxton_out]
text = "Vosper: Luxton went out of the tap to the yard at ten minutes past nine by the inn clock."

[clues.card_shot]
text = "The vicar: the shot came on the last stroke of nine by the church clock, as he stood beside the works."

[clues.card_luxton_back]
text = "Vosper: Luxton came back into the tap at eighteen minutes past nine by the inn clock."

[clues.card_school]
text = "Lethbridge: Vodden knocked at the schoolhouse at five minutes past nine by the school clock."

[clues.card_body]
text = "Mrs Bickle: she came in and found the body as the church clock struck half past nine."

