# ================================================================ the bank

[items.bank_clock]
name = "bank clock"
aliases = ["clock", "seconds hand"]
location = "bank"
scenery = true
clue = "bank_std"
description = "A handsome regulator with a seconds hand, as a bank should have. By my watch it kept London time to the minute."

[items.counter]
name = "counter"
aliases = ["long counter", "scales", "brass scales", "rails"]
location = "bank"
scenery = true
description = "A long mahogany counter with brass rails and a pair of gold-scales, and a shallow drawer under the counter at the clerk's place."

[items.counter_drawer]
name = "drawer"
aliases = ["counter drawer", "clerk's drawer", "shallow drawer"]
location = "bank"
scenery = true
container = true
openable = true
description = "A shallow drawer under the counter at the clerk's place."
open_text = "Pring hesitated, then opened the drawer for me. In it lay the Bank's revolver."

[items.revolver]
name = "revolver"
aliases = ["bank revolver", "bank's revolver", "gun", "pistol"]
location = "counter_drawer"
take_text = "Pring opened his mouth to protest, and shut it again. I put the revolver in my coat pocket."
clue = "revolver"
description = "A small five-chambered revolver of the kind banks keep against robbers, of about .38 calibre. Four chambers were loaded. The fifth held an empty, blackened case, and the barrel, when I sniffed it, was foul and smelt of burnt powder. It had been fired, and not cleaned since."

[items.safe]
name = "safe"
aliases = ["green safe", "roll-top desk", "desk", "engraving", "roll top desk"]
location = "agent_room"
scenery = true
description = "A green safe by Milner, a roll-top desk shut and locked, and the Bank's head office engraved in the grand manner."
