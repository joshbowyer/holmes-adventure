# ================================================================ Watson's own

[items.watch]
name = "watch"
article = "my"
aliases = ["my watch", "pocket watch", "pocket-watch", "hunter", "own watch"]
location = "player"
clue = "watch_set"
description = "My own watch, a plain gold hunter that had come through Afghanistan with me. I had set it by the great clock at Waterloo the night before, so that it kept London time to the minute: the time of the railway, and now, by Act of Parliament, the time of the law."
cant_take = "It was on its chain already."

# ================================================================ the station

[items.station_clock]
name = "station clock"
aliases = ["clock", "station's clock", "board", "greenwich time", "gilt letters"]
location = "platform"
scenery = true
description = "A round white dial in a mahogany case, with the Company's name upon it. I compared it with my watch: they agreed to the minute, as they ought, both keeping London time."

[items.fire_buckets]
name = "fire buckets"
aliases = ["buckets", "bucket", "sand"]
location = "platform"
scenery = true
container = true
description = "A row of red fire buckets on hooks under the eaves, half full of wet sand."
details = [ { when = "loc:coin_station:fire_buckets", text = "Something small and brown lay on the sand in the end bucket." } ]

[items.coin_station]
name = "halfpenny"
aliases = ["coin", "ha'penny", "halfpence"]
location = "fire_buckets"
coin = true
description = "A halfpenny of the old Queen's head."
take_text = "I picked the halfpenny off the sand and put it in my pocket."

[items.bradshaw]
name = "Bradshaw"
aliases = ["timetable", "railway guide", "guide"]
location = "booking_office"
scenery = true
description = "The October number of Bradshaw's Railway Guide, chained to the counter by a length of brass chain. The page for the branch was well thumbed. Up trains to Exeter left Hatherleigh at 7:10 and 9:40 in the morning, and 2.15, 5:30 and 9:05 at night; a pencilled note in the margin, in the stationmaster's hand, read: \"9:05 p.m., new from 1st Oct. (was 8:50).\""

[items.time_card]
name = "printed card"
aliases = ["card", "time signal", "signal card"]
location = "booking_office"
scenery = true
description = "\"ELECTRIC TELEGRAPH. Greenwich Mean Time is signalled from the Royal Observatory at 10 a.m. daily. All clocks of the Company to be set by the signal.\""

[items.telegraph]
name = "telegraph instrument"
aliases = ["telegraph", "instrument", "glass case"]
location = "booking_office"
scenery = true
description = "A single-needle telegraph instrument under a glass case, its needle twitching now and then as the line talked to itself."

[items.church_dial]
name = "church clock"
aliases = ["clock", "tower", "church tower", "dial", "clock-face", "clock face"]
location = "station_road"
scenery = true
clue = "church_std"
description = "From here the gilded dial on the church tower showed plain across the roofs. I compared it with my watch, and found it sixteen minutes slow. It was not, I gathered, a matter of neglect: a clock so handsomely kept is not sixteen minutes slow by accident."

