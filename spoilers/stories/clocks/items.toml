[items.cottages]
name = "cottages"
aliases = ["cottage", "cob cottages", "thatch"]
location = "church_street"
scenery = true
description = "Old cob cottages, their thatch black with wet. Not a curtain stirred."

# ================================================================ the school

[items.school_clock]
name = "school clock"
aliases = ["clock", "deal case", "school's clock"]
location = "schoolroom"
scenery = true
clue = "school_std"
description = "A plain eight-day clock in a deal case, such as every board school in England buys by the gross. I compared it with my watch, and then again, to be sure: it was sixteen minutes slow by London time. Whatever the schoolmaster might suppose, his clock was keeping church time."

[items.master_desk]
name = "master's desk"
aliases = ["desk", "high desk", "master's high desk"]
location = "schoolroom"
scenery = true
container = true
openable = true
description = "The master's high desk, with a sloping lid."
open_text = "I raised the lid of the desk."

[items.minute_book]
name = "minute book"
aliases = ["managers' minute book", "minutes", "book"]
location = "master_desk"
clue = "minute_book"
description = """
The minute book of the Managers of Hatherleigh National School. On the flyleaf: "Chairman, the Rev. O. Squance. Treasurer, A. Vodden, Esq. Clerk, J. Gloyne, Esq." The last entry, in Gloyne's neat hand:

| Monday 17th October 1881. Present: the Chairman, Mr Vodden,
| the Clerk. ... The Chairman remarked that the School clock
| had once more been set to London time, contrary to his
| repeated wish, and himself put it back to the time of the
| Parish Church before the meeting rose.
"""
take_text = "I took the minute book. The schoolmaster, I thought, would not grudge it me."

[items.school_things]
name = "desks"
aliases = ["forms", "map", "map of the holy land", "stove", "slates"]
location = "schoolroom"
scenery = true
description = "Desks and forms scored with generations of initials, a map of the Holy Land, a cold stove. Nothing here had been disturbed."

[items.chessboard]
name = "chess-board"
aliases = ["chess board", "chessboard", "chess", "pieces", "game"]
location = "schoolhouse"
scenery = true
description = "An unfinished game. White, I judged, had been playing very wildly: he had thrown away a knight and a bishop in a dozen moves, as a man does whose mind is on something else entirely."

# ================================================================ Fore House

[items.hall_clock]
name = "long-case clock"
aliases = ["clock", "long case clock", "grandfather clock", "hall clock"]
location = "fore_hall"
scenery = true
clue = "gloyne_church_time"
description = "A fine old long-case clock with a painted moon in the arch. By my watch it was sixteen minutes slow, to a hair. Mr Gloyne, it seemed, had kept church time in his own house."

[items.body]
name = "body"
aliases = ["sheet", "gloyne", "josiah gloyne", "mr gloyne", "dead man", "corpse", "wound", "sofa"]
location = "office"
scenery = true
clue = "wound"
description = "I turned back the sheet. Josiah Gloyne had been a spare, grey, close-shaven man of sixty, with a lawyer's thin mouth. He had been shot once, through the chest, a little to the left of the breastbone, and the ball had gone clean through him. There was a ring of powder-blackening on his waistcoat round the hole: the shot had been fired from no more than a yard or two, and from in front. He had been standing, I thought, and facing whoever killed him."

[items.bullet_hole]
name = "hole"
aliases = ["panelling", "bullet hole", "panel"]
location = "office"
scenery = true
description = "A neat, fresh cut in the panelling where somebody, the sergeant I supposed, had dug out the ball. It was at about the height of a standing man's heart."

[items.desk]
name = "desk"
aliases = ["mahogany desk", "drawers", "drawer"]
location = "office"
scenery = true
container = true
openable = true
description = "A broad mahogany desk, its top bare but for an inkstand and the blotter, with a drawer on either side."
open_text = "I opened the drawers of the desk. The sergeant made no objection."

[items.diary]
name = "diary"
aliases = ["engagement diary", "appointment book", "book"]
location = "desk"
clue = "diary"
description = """
Gloyne's engagement diary for 1881, in his small, precise hand. The entry for Tuesday the 18th read:

| 11 o'c. Petty Sessions.  3 o'c. Mr Luxton, Week Farm, re
| mortgage: will NOT extend.  9 o'c. The Treasurer. Last chance.
"""
take_text = "I took the diary. Sergeant Pascoe made a note of it."

[items.draft_notice]
name = "draft notice"
aliases = ["notice", "draft", "paper", "foolscap"]
location = "desk"
clue = "draft_notice"
description = """
A sheet of foolscap in Gloyne's hand, much corrected:

| HATHERLEIGH MARKET TRUST. Notice is hereby given that a Special
| Meeting of the Trustees will be held at the Town Hall on Thursday
| the 20th inst. at noon, to consider the state of the Treasurer's
| account, in which the Clerk has found a deficiency of £812.
"""
take_text = "I folded the draft and put it in my pocket."

[items.gloyne_pistol]
name = "pistol"
aliases = ["gloyne's pistol", "pocket pistol", "his pistol"]
location = "desk"
scenery = true
clue = "desk_pistol"
description = "A little double-barrelled pocket pistol, loaded in both barrels, the caps on the nipples. Neither barrel had been fired, and the inside of each was clean and bright. Whatever had happened in this room, Gloyne had never reached for it."

[items.office_window]
name = "window"
aliases = ["office window", "deed-boxes", "deed boxes", "boxes"]
location = "office"
scenery = true
description = "The window gave on the square and was fastened on the inside. The deed-boxes were all locked and dusty."

[items.sideboard]
name = "sideboard"
aliases = ["breakfast", "cold breakfast", "shutters"]
location = "dining_room"
scenery = true
description = "Cold ham, cold eggs and cold tea. Nobody in that house had any appetite this morning."

[items.garden_door]
name = "garden door"
aliases = ["door", "porch", "bolt", "bolts"]
location = "garden"
scenery = true
description = "A stout door with a great iron bolt at top and bottom on the inside, and an old lock whose key stood in it."

[items.scraper]
name = "boot-scraper"
aliases = ["scraper", "boot scraper", "step"]
location = "garden"
scenery = true
container = true
description = "An iron boot-scraper set in a stone by the step, clogged with garden earth."
details = [ { when = "loc:coin_garden:scraper", text = "Something round was caught in the clogged earth under the blade." } ]

[items.coin_garden]
name = "halfpenny"
aliases = ["coin", "ha'penny", "halfpence"]
location = "scraper"
coin = true
description = "A halfpenny, scraped bright along one edge."
take_text = "I worked the halfpenny out from under the blade and put it in my pocket."

[items.oak_gate]
name = "oak gate"
aliases = ["gate", "door in the wall", "little gate"]
location = "garden"
scenery = true
description = "A solid little gate of oak let into the churchyard wall, with a lock on the churchyard side and a latch on this. It was not locked now."

[items.beds]
name = "beds"
aliases = ["paths", "garden beds"]
location = "garden"
scenery = true
description = "Bare black earth, dug over for the winter. Nobody had trodden on it."

# ================================================================ the church

[items.path]
name = "path"
aliases = ["gravel path", "gravel", "footprints", "prints", "marks"]
location = "churchyard"
scenery = true
clue = "prints"
description = "The gravel path was thin and old, and the rain had washed the earth up through it. Between the little oak gate from Fore House and the lych gate on School Lane it held a line of a man's footprints, long-strided and sharp-edged, the toes pointing towards School Lane: a man walking fast, or half running. They were sharp because they had been made after the rain stopped; anything made while it fell would have been blurred to nothing. Nobody else, it seemed, had come that way since."

[items.tombs]
name = "table tombs"
aliases = ["tombs", "tomb", "headstones", "headstone", "lichen"]
location = "churchyard"
scenery = true
container = true
description = "Old slate headstones and table tombs, the inscriptions furred over with lichen."
details = [ { when = "loc:coin_churchyard:tombs", text = "On the ledge of the nearest table tomb, as if set there by a child, lay a coin." } ]

[items.coin_churchyard]
name = "halfpenny"
aliases = ["coin", "ha'penny", "halfpence"]
location = "tombs"
coin = true
description = "A halfpenny, green with the wet."
take_text = "I took the halfpenny from the tomb, with an apology to its tenant, and put it in my pocket."

[items.lych_gate]
name = "lych gate"
aliases = ["lych-gate", "lychgate", "shingles"]
location = "churchyard"
scenery = true
description = "A roofed gate of old oak, with a stone bench either side under the shingles. It had a good modern lock."

[items.iron_gates]
name = "iron gates"
aliases = ["gates"]
location = "churchyard"
scenery = true
description = "Tall iron gates on the square, chained and locked every evening at dusk, by the look of the chain."

[items.notice_board]
name = "notice-board"
aliases = ["notice board", "noticeboard", "notices", "vestry notice"]
location = "nave"
scenery = true
clue = "vestry_motion"
description = """
Among the notices of banns and charities was one freshly pinned:

| PARISH OF HATHERLEIGH. At a Vestry held on the 6th inst., on
| the motion of Mr J. Gloyne, it was Resolved that the Church
| Clock be henceforth kept to Greenwich Mean Time, being the
| legal time of the Realm. To be confirmed at an adjourned Vestry
| on Thursday the 20th inst.

Somebody had written across it in pencil, in a scholarly hand: "Not while I am Vicar."
"""

[items.pews]
name = "box pews"
aliases = ["pews", "pew", "hassocks", "roof"]
location = "nave"
scenery = true
description = "High box pews with doors, each with its family's name painted on the door."

[items.parish_chest]
name = "parish chest"
aliases = ["chest", "cope-chest", "surplices"]
location = "vestry"
scenery = true
description = "An ancient iron-bound chest with three locks, beside the cope-chest and the surplices on their pegs."

[items.clockworks]
name = "clock"
aliases = ["works", "church clock", "pendulum", "weights", "rods", "wheels"]
location = "clock_chamber"
scenery = true
description = "A good, heavy turret clock, well oiled and well kept. It struck the quarters on two small bells and the hours on the great one, each hammer drawn up and let fall by a wheel on its own train; standing here, a man would hear every stroke of the bell above him as plain as a blow on the head, and see the hammer move."

[items.frame]
name = "iron frame"
aliases = ["frame"]
location = "clock_chamber"
scenery = true
container = true
description = "The great iron frame of the clock, bolted to oak beams."
details = [ { when = "loc:coin_tower:frame", text = "On the flat top of the frame, in the dust, lay a coin." } ]

[items.coin_tower]
name = "halfpenny"
aliases = ["coin", "ha'penny", "halfpence"]
location = "frame"
coin = true
description = "An old halfpenny, very dusty."
take_text = "I took the halfpenny from the top of the frame and blew the dust off it."

[items.louvres]
name = "louvres"
aliases = ["louvre", "slats", "view", "roof"]
location = "clock_chamber"
scenery = true
description = "Through the slats I looked down on the slate roof of Fore House, its garden, the little oak gate in the churchyard wall, and the line of the path to the lych gate. In the dark, with the rain on the louvres, a man up here would have seen nothing at all."

