# ---------------------------------------------------------------- the reckoning

[final]
type = "accuse"
intro = "I went up to the sitting-room and stood before Holmes's chair. \"I have it,\" said I."
good = "solved"
default_wrong = "wrong_account"

[[final.questions]]
id = "who"
prompt = "Who took Mrs Hudson's seed-cake?"
options = [
  { id = "wiggins", label = "Wiggins, the Irregular" },
  { id = "dobbs", label = "Dobbs, the coal-heaver", when = "visited:street" },
  { id = "holmes", label = "Sherlock Holmes himself" },
]

[[final.questions]]
id = "how"
prompt = "How did the thief come at the cake?"
options = [
  { id = "window", label = "Reached in at the open window from the area", when = "clue:sill_crumbs" },
  { id = "house", label = "Came through the house by the street door and the kitchen stair" },
  { id = "kitchen", label = "Walked into the kitchen while Mrs Hudson was in the scullery" },
]

[final.solution]
who = "dobbs"
how = "window"

[[final.wrong]]
answers = { who = "wiggins" }
ending = "wiggins_wronged"

[[final.wrong]]
answers = { who = "holmes" }
ending = "holmes_amused"

[endings.solved]
title = "The Seed-Cake Restored (in Spirit)"
text = """
I laid it out for him point by point: the open window level with the flags of the area; the coal-dust on the sill, where no mud-grey urchin had left it; Dobbs's errand for a drink of water at a door that Mrs Hudson swore no one had knocked upon; the crumbs and the caraway on the crate in the vault, where a man might sit unseen and eat his fill; and the seed still caught in his chin.

Holmes heard me out with his eyes closed. When I had done, he opened them.

"Capital, Watson. You found the place, you found the witness, and you found the crumbs, which is more than most of Scotland Yard would have done for a murder. You have earned your breakfast."

Dobbs, confronted on the pavement by a doctor, an indignant landlady and an exceedingly self-righteous Wiggins, owned to the theft with a very ill grace, and paid Mrs Hudson a shilling for the cake. She bought a currant loaf with it, and gave half to Wiggins.
"""

[endings.wiggins_wronged]
title = "An Injustice in Baker Street"
text = """
"It was the boy," said I. "Who else had the opportunity?"

Holmes said nothing at all, which was worse than anything he could have said.

Mrs Hudson, armed with my verdict, went up the area steps like a ship of the line and boxed Wiggins's ears in full view of Baker Street. The boy took it without a word, gave me one look that I did not soon forget, and went away down the street. For a fortnight afterward not one of the Irregulars could be found when Holmes had need of them.

"You have made an enemy of the only honest witness in the street, Watson," said Holmes at last, "and on the strength of nothing better than his bare feet."
"""

[endings.holmes_amused]
title = "The Detective Detected?"
text = """
"It was you, Holmes," said I triumphantly. "You have not touched your breakfast, and you declined the case because you could not well investigate yourself."

Holmes laughed until he coughed. "My dear Watson! I have not left this chair since six o'clock, as the ash on the hearth and the state of my slippers would tell you if you looked at them. I have not eaten because I am thinking, and I am thinking because I am bored. You have accused the one man in London who could not possibly have done it. It is almost a distinction."

Mrs Hudson, when she heard of it, did not speak to either of us until Thursday.
"""

[endings.wrong_account]
title = "A Bridge That Would Not Bear"
text = """
I gave him my account. Holmes listened with closed eyes, and when I had finished he was silent so long that I thought he had fallen asleep.

"Your conclusion may be right, or it may not," said he at last. "But the road by which you reached it would not bear the weight of a cat. Lay that before Mrs Hudson and the culprit will laugh at you, and he will be quite right to."

I went back to the kitchen with my ears burning.
"""

