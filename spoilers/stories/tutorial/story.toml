# ---------------------------------------------------------------- people

[characters.holmes]
name = "Holmes"
aliases = ["sherlock holmes", "sherlock", "mr holmes"]
location = "sitting_room"
presence = "Holmes lay in his armchair, his eyes half-closed and his fingertips pressed together."
description = "He had not shaved, and his dressing-gown was knotted carelessly about him. Yet I knew that look of lazy indifference of old; nothing in the house escaped him."
unknown_topic = "\"I have declined the case, Watson,\" said Holmes, without opening his eyes. \"I do not propose to conduct it by proxy.\""
unknown_show = "\"Very interesting, I am sure,\" said Holmes, without looking at it."

[[characters.holmes.greeting]]
text = "\"Well, Watson? Has the great seed-cake mystery yielded to your methods?\""

[[characters.holmes.topics.cake]]
aliases = ["seed-cake", "seed cake", "theft", "case", "mystery", "robbery"]
text = "\"A seed-cake, Watson, on a window-sill, between half past eight and half past nine. Begin where the thing was last seen. It is the only sound beginning.\""

[[characters.holmes.topics.wiggins]]
aliases = ["irregulars", "boy"]
text = "\"Wiggins is many things, but he is not a fool, and he knows that I pay better than any seed-cake. Still, do not take my word for it. Look at the boy.\""

[[characters.holmes.topics.hudson]]
aliases = ["mrs hudson", "landlady"]
text = "\"Our landlady is the best of women and the worst of witnesses: she sees what she expects to see. Mind you hear what she says, not what she thinks.\""

[[characters.holmes.topics.pennies]]
aliases = ["penny", "coins", "money", "hints", "hint", "help"]
text = "\"A penny for my thoughts, Watson. Lay one before me and type HINT, or bid me CONSULT. I shall tell you no more than you need, and I shall not charge you for what you have already found.\""

[[characters.holmes.topics.dobbs]]
aliases = ["coal-heaver", "coal heaver", "coal man", "coalman", "coal"]
text = "\"Ah, the coal. Yes, it came this morning. I heard it go in.\" He said no more."

[characters.hudson]
name = "Mrs Hudson"
aliases = ["hudson", "landlady", "mrs h"]
location = "kitchen"
presence = "Mrs Hudson stood at the table, her arms folded and her cheeks pink with indignation."
description = "A stout, motherly woman in a black dress and a white cap, flour to the elbows and fury in her eye."
unknown_topic = "\"I'm sure I couldn't say, Doctor,\" said Mrs Hudson."
unknown_show = "Mrs Hudson peered at it and shook her head."

[[characters.hudson.greeting]]
text = "\"Oh, Doctor! Has Mr Holmes sent you? It's a crying shame, a cake I was taking to the chapel bazaar, and that boy loafing about the railings all the morning. Nobody's been near my kitchen today but the coal man with his delivery.\""

[[characters.hudson.topics.cake]]
aliases = ["seed-cake", "seed cake", "theft", "bazaar"]
text = "\"I set it on the sill to cool at half past eight, Doctor, same as I always do, with the window up because of the range. I was in and out of the scullery all the morning, and at half past nine I came to cover it and it was gone. Plate and all left behind, as bold as you please.\""

[[characters.hudson.topics.wiggins]]
aliases = ["boy", "irregulars", "urchin"]
text = "\"That young imp has been hanging on the railings since seven. Who else would it be? Those boys would eat the paint off a door.\""

[[characters.hudson.topics.dobbs]]
aliases = ["coal-heaver", "coal heaver", "coal man", "coalman", "coal", "visitors", "caller", "callers", "anyone", "door"]
text = "\"The coal? Dobbs brought it at nine, same as every month. He tips it in by the plate in the pavement; he's no call to come down here, and he didn't. Nobody came to my door all the morning, Doctor, I'll take my oath on it.\""
effects = ["clue:hudson_no_caller"]

[[characters.hudson.topics.window]]
aliases = ["sill", "kitchen window"]
text = "\"I always put it up when the range is going. Anyone in the area could reach it, I suppose, if they'd the impudence.\""

[[characters.hudson.topics.holmes]]
aliases = ["mr holmes", "sherlock"]
text = "\"Beneath him, he says! And him that will spend a week on a lost cigar.\""

[[characters.hudson.shows.seeds]]
text = "Mrs Hudson unfolded my handkerchief and gave a cry. \"Caraway! That's my seed-cake, Doctor, I'd know it anywhere. There's not another thing in this house with caraway in it, nor ever has been. Wherever did you find them?\""
effects = ["clue:cake_identified"]

[characters.wiggins]
name = "Wiggins"
aliases = ["boy", "urchin", "irregular"]
location = "street"
presence = "Wiggins, the leader of Holmes's ragged band of street urchins, was leaning against the railings with his hands in his pockets."
description = "A sharp-faced boy of twelve or so in a man's cut-down coat, his feet bare despite the raw March morning."
clue = "wiggins_feet"
details = [
  { text = "I looked him over as Holmes would have done. His feet and hands were grey with the mud of the road, but of coal-dust there was no trace on him anywhere." },
]
unknown_topic = "\"Dunno nothing about that, Doctor.\""
unknown_show = "Wiggins squinted at it. \"What's that, then?\""

[[characters.wiggins.greeting]]
text = "\"Morning, Doctor. Mr Holmes got any work for us yet? I've had my eye on this street all morning: the milk, the coal man, the lot.\""

[[characters.wiggins.topics.cake]]
aliases = ["seed-cake", "seed cake", "theft"]
text = "\"Her cake? I never touched it, Doctor, on my oath. I been up here the whole while, waiting on Mr Holmes. Never been near the area.\""

[[characters.wiggins.topics.dobbs]]
aliases = ["coal-heaver", "coal heaver", "coal man", "coalman", "coal", "cart", "anyone", "area"]
text = "\"Dobbs? Him and his mate brung the coal about nine. His mate tipped the sacks down the plate, and Dobbs, he went down the area steps. Said he was after a drink of water. He was down there a good few minutes before he come up again.\""
effects = ["clue:saw_dobbs"]

[[characters.wiggins.topics.hudson]]
aliases = ["mrs hudson", "landlady"]
text = "\"She's been giving me the eye all morning. I ain't done nothing.\""

[characters.dobbs]
name = "Dobbs"
aliases = ["coal-heaver", "coal heaver", "coal man", "coalman", "heaver"]
location = "street"
presence = "Dobbs the coal-heaver sat on the tail of his cart, filling a short clay pipe."
description = "A big, slow man, black with coal-dust from his leather fan-tailed hat to his hobnailed boots."
details = [
  { when = "clue:seeds_in_vault", text = "I looked more closely at his face. Caught in the black stubble of his chin were one or two small, crescent-shaped seeds." },
]
on_examine = [
  { when = "clue:seeds_in_vault", effects = ["clue:dobbs_seeds"] },
]
unknown_topic = "Dobbs took his pipe from his mouth, considered the question, and put it back."
unknown_show = "Dobbs looked at it and then at me, and said nothing."

[[characters.dobbs.greeting]]
text = "\"Morning, sir.\" He touched his hat with a black forefinger."

[[characters.dobbs.topics.cake]]
aliases = ["seed-cake", "seed cake", "theft"]
text = "\"Cake? Don't know nothing about no cake, sir. Ask that young varmint on the railings.\""

[[characters.dobbs.topics.area]]
aliases = ["area steps", "steps", "water", "drink", "kitchen"]
text = "\"Me? Never set foot down there, sir. I tips it in by the plate and I'm off.\""

[[characters.dobbs.topics.coal]]
aliases = ["delivery", "sacks", "vault"]
text = "\"Six hundredweight of best Wallsend, sir, same as every month.\""

[[characters.dobbs.topics.wiggins]]
aliases = ["boy", "urchin"]
text = "\"That one? Up to no good, I'll be bound.\""

[[characters.dobbs.shows.seeds]]
text = "Dobbs looked at the seeds a long moment, and something in his broad black face went still. \"Seeds,\" he said at last. \"What of 'em?\""

# ---------------------------------------------------------------- clues

[clues.sill_crumbs]
text = "The seed-cake was set to cool on the sill of the open kitchen window, which gives upon the area. It vanished between half past eight and half past nine; the plate was left behind."

[clues.coal_smudge]
text = "A fresh smudge of coal-dust on the white paint of the sill, beside the plate."

[clues.hudson_no_caller]
text = "Mrs Hudson is sure no one came to the kitchen door all morning. The coal went in through the plate in the pavement, as always."

[clues.wiggins_feet]
text = "Wiggins is barefoot and grey with street mud, but there is no coal-dust on him anywhere."

[clues.saw_dobbs]
text = "Wiggins saw Dobbs the coal-heaver go down the area steps at about nine, \"for a drink of water\", while his mate tipped the coal. He was some minutes below."

[clues.seeds_in_vault]
text = "In the coal vault, on an upturned crate just inside the door: crumbs and a scatter of caraway seeds."

[clues.cake_identified]
text = "Mrs Hudson knows the caraway at once: her seed-cake was the only thing in the house that had it."

[clues.dobbs_seeds]
text = "Caught in the stubble of Dobbs's chin: a caraway seed or two."

