# Practice case. Small on purpose: teaches movement, examining, taking, a dark room,
# a two-item action, asking, showing, pennies and hints, and a two-question accusation.
#
# Bible: Dobbs the coal-heaver went down the area steps "for a drink of water" while his
# mate tipped the coal, reached in at the open kitchen window, took the seed-cake, and
# ate it in the coal vault under the pavement. Wiggins is the obvious suspect and is
# innocent. Holmes declined the case as beneath him.

[case]
id = "tutorial"
title = "A Penny for His Thoughts"
subtitle = "a practice case"
year = 1885
order = 0
start = "sitting_room"
coin_name = "penny"
coin_plural = "pennies"
hint_intro = "I laid a penny upon the arm of Holmes's chair. He regarded it gravely, pocketed it, and spoke without opening his eyes."
hint_none = "Holmes did not so much as open his eyes. \"You have every fact you need, Watson. It wants only the courage to name your man.\""
hint_broke = "My pockets were empty of coppers. Holmes's thoughts, it seemed, were not to be had on credit; I resolved to search the house more closely."
intro = """
It was a raw morning in the March of 1885, and I came down to breakfast to find my friend Sherlock Holmes already in his armchair, his long legs stretched toward a sullen fire and his breakfast untouched upon the tray.

"You find me in disgrace, Watson," said he. "Mrs Hudson has been robbed, and I have declined the case."

"Robbed! Of what?"

"Of a seed-cake. It was left to cool upon her kitchen window-sill at half past eight and was gone by half past nine. She suspects young Wiggins, who has been loitering in the street since dawn awaiting my instructions. I told her that the matter was beneath me." He opened one eye. "It is not, I think, beneath you. You have watched me at my work these four years. Let us see what has rubbed off."

"And if I should come to a stand?"

"Then a penny will buy you my thoughts. I am told the house is liberally sown with lost coppers; Mrs Hudson's lodgers are careless men."
"""
intro_note = "[New to this kind of game? Type HELP for the commands. Try EXAMINE on anything that catches your eye, and NOTEBOOK to review what you have learned.]"

[verbs]
light = ["light", "ignite", "kindle", "strike"]

# ---------------------------------------------------------------- rooms

[rooms.sitting_room]
name = "The Sitting-Room, 221B"
aliases = ["sitting room", "sitting-room", "upstairs"]
description = """
Our sitting-room was in its customary disorder. The chemical table in the corner was scarred and stained by Holmes's experiments, a litter of papers drifted across the floor, and the fire smoked sullenly in the grate. A battered sofa stood beneath the window, its cushions sagging from long service. The stair led down to the hall.
"""
[rooms.sitting_room.exits]
down = "hall"

[rooms.hall]
name = "The Hall"
aliases = ["hall", "hallway"]
description = """
The narrow hall smelt of floor-polish and boiled linen. Our seventeen steps climbed to the sitting-room above, and a meaner stair descended to Mrs Hudson's kitchen below. Beside the street door stood the hall-stand, my old army greatcoat hanging upon it where I had flung it the night before.
"""
[rooms.hall.exits]
up = "sitting_room"
down = "kitchen"
out = { to = "street", aliases = ["street door", "front door", "door"] }

[rooms.kitchen]
name = "Mrs Hudson's Kitchen"
aliases = ["kitchen"]
description = """
The kitchen lay half below the level of the street, and was the warmest room in the house. The great black range roared at one end; a scrubbed deal table filled the middle, and a tall dresser of crockery stood against the wall. High in the front wall a window looked out upon the area, its lower sash thrown up to let out the heat of the range. A door beside it gave upon the area itself, and the stair climbed back to the hall.
"""
[rooms.kitchen.exits]
up = "hall"
out = { to = "area", aliases = ["area door", "door"] }

[rooms.area]
name = "The Area"
aliases = ["area", "yard"]
description = """
The area was a narrow flagged yard sunk below the pavement, between the kitchen window and the iron railings of Baker Street above. Stone steps climbed to the street. Opposite the kitchen door, set into the wall beneath the pavement, a low plank door led into the coal vault. A drain grating was let into the flags at the foot of the steps.
"""
[rooms.area.exits]
up = { to = "street", aliases = ["steps", "area steps", "street"] }
in = { to = "kitchen", aliases = ["kitchen door"] }
north = { to = "coal_vault", aliases = ["vault", "coal vault", "plank door", "cellar"] }

[rooms.coal_vault]
name = "The Coal Vault"
aliases = ["vault", "coal vault", "cellar"]
dark_when = "!flag:candle_lit|!has:candle"
dark_text = """
It was as black as the inside of a hat. The air was thick with coal-dust, and I could make out nothing whatever beyond the grey square of the doorway behind me. I should need a light.
"""
description = """
By the light of the candle the vault proved a low, barrel-roofed cellar of sooty brick, running out beneath the pavement. A great heap of fresh coal had spilled from the round hole in its roof, where the morning's delivery had been tipped in from the street. Just inside the door stood an upturned crate.
"""
[rooms.coal_vault.exits]
south = { to = "area", aliases = ["area", "door", "out"] }
out = "area"

[rooms.street]
name = "Baker Street"
aliases = ["street", "baker street", "outside"]
description = """
Baker Street lay under a lifting fog, and the traffic of the morning was well begun: cabs, drays and a costermonger's barrow crawling along the greasy road. Before our door a coal-cart stood at the kerb, its horse sunk in patient misery, and an iron coal-plate was set into the pavement. The street door of 221B stood at the top of its step; beside it, the area steps went down behind the railings.
"""
[rooms.street.exits]
in = { to = "hall", aliases = ["street door", "front door", "house", "221b"] }
down = { to = "area", aliases = ["area steps", "steps", "area"] }

