[case]
id = "palace"
title = "The Crystal Palace by Night"
year = 1895
order = 60
start = "centre_transept"
coin_name = "sixpence"
coin_plural = "sixpences"
hint_intro = "I gave Holmes a sixpence. He spun it on the rim of the basin, caught it, and spoke without taking his eyes from the clock."
hint_none = "\"You have it all, Watson,\" said Holmes. \"Every piece. Put them together, and ACCUSE.\""
hint_broke = "I had not a sixpence about me. \"Thirty thousand people were here on Thursday,\" said Holmes. \"Look where they sat, and where they made their wishes.\""
wait_turns = 4
wait_text = "I waited, listening to the great house tick and creak about me in the dark as the iron cooled."
intro = """
I have said elsewhere that my friend Sherlock Holmes was at his best on a dark night, and I never saw it better shown than in the September of 1895, when he spent one in the Crystal Palace.

The wire came from young Stanley Hopkins on the Friday afternoon. On the Thursday, the last fireworks night of the season, some thirty thousand people had come to Sydenham to see Mr Brock's set pieces burn, and had gone home again. At ten minutes to midnight the Palace night-watchman, Abel Crouch, had found his fellow, Daniel Pike, lying dead in the Alhambra Court under the gallery, with his skull broken. The police surgeon called it a fall. Hopkins was not so sure, and could not say why.

"A fall," said Holmes, folding the wire, "in a building with a hundred thousand panes of glass, and every one of them a window. Come, Watson. We shall go down by the last train, and see the place as he saw it: after dark, with the gas down."

So it was that a little after ten o'clock that night, with the last of the day's visitors gone home and the gas turned down to its night lights, I stood in the middle of the largest room in the world, and listened to it creak.
"""
intro_note = "[Many of the courts are dark: you will want a lantern. Crouch the watchman walks his round tonight, and some doors open only when he is there; STATUS shows where he is, and WAIT lets time pass. Sixpences found while exploring buy hints from Holmes with HINT.]"

counters = { round = 24 }

every_turn = [
  # Crouch walks on, but stands while I am with him.
  { when = ["loc:crouch:centre_transept", "!at:centre_transept"], effects = ["add:round:1"] },
  { when = ["loc:crouch:north_end", "!at:north_end"], effects = ["add:round:1"] },
  { when = ["loc:crouch:pompeian_court", "!at:pompeian_court"], effects = ["add:round:1"] },
  { when = ["loc:crouch:alhambra_court", "!at:alhambra_court"], effects = ["add:round:1"] },
  { when = ["loc:crouch:south_nave", "!at:south_nave"], effects = ["add:round:1"] },
  { when = ["loc:crouch:south_transept", "!at:south_transept"], effects = ["add:round:1"] },
  { when = ["loc:crouch:watch_house", "!at:watch_house"], effects = ["add:round:1"] },
  { when = "ge:round:32", effects = ["setn:round:0"] },
  { when = ["eq:round:0", "loc:crouch:watch_house", "at:centre_transept"], text = "Crouch came out of the watch-house, wiping his moustache, and went to the key-box on the pier. I heard the click of his key turning in the clock.", effects = ["move:crouch:centre_transept"] },
  { when = ["eq:round:0", "loc:crouch:watch_house"], effects = ["move:crouch:centre_transept"] },
  { when = ["eq:round:4", "loc:crouch:centre_transept", "at:north_end"], text = "Crouch's lantern came bobbing up the nave, and he stopped at the screen to key his clock.", effects = ["move:crouch:north_end"] },
  { when = ["eq:round:4", "loc:crouch:centre_transept"], effects = ["move:crouch:north_end"] },
  { when = ["eq:round:8", "loc:crouch:north_end", "at:pompeian_court"], text = "Crouch came in at the painted doorway with his lantern, nodded to me, and keyed his clock at the box.", effects = ["move:crouch:pompeian_court"] },
  { when = ["eq:round:8", "loc:crouch:north_end"], effects = ["move:crouch:pompeian_court"] },
  { when = ["eq:round:12", "loc:crouch:pompeian_court", "at:alhambra_court"], text = "Crouch came in under the horseshoe arch, unlocked the narrow door to the gallery stair, and set it open. \"There you are, sir, if you want to go up. I'll lock it when I go on.\"", effects = ["move:crouch:alhambra_court"] },
  { when = ["eq:round:12", "loc:crouch:pompeian_court"], effects = ["move:crouch:alhambra_court"] },
  { when = ["eq:round:16", "loc:crouch:alhambra_court", "at:south_nave"], text = "Crouch came down the nave with his lantern swinging and keyed his clock at the pier.", effects = ["move:crouch:south_nave"] },
  { when = ["eq:round:16", "loc:crouch:alhambra_court"], effects = ["move:crouch:south_nave"] },
  { when = ["eq:round:20", "loc:crouch:south_nave", "at:south_transept"], text = "Crouch came through from the nave and keyed his clock at the box by the colonnade doors.", effects = ["move:crouch:south_transept"] },
  { when = ["eq:round:20", "loc:crouch:south_nave"], effects = ["move:crouch:south_transept"] },
