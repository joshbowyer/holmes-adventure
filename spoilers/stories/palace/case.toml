# ================================================================ endings

[endings.solved]
title = "Ten Minutes Fast"
text = """
I told it him, as I had pieced it together, under the great clock.

"Pike's dial says he keyed the Pompeian Court at twenty to eleven," I said. "He did not. His lantern was never lit, and Crouch says no man can find those boxes in the dark; and Wicks's book has the courts dark at 10:33. So the dial is wrong, and it is wrong by ten minutes exactly, for it says Pike keyed Number One at a quarter past ten, and Crouch's says five past, and they turned their keys in the same minute, as they had every night for eight years. Kell heard the cry just after the half-hour struck. Pike keyed the Pompeian Court at half past ten, by true time, and a minute later he was struck down there from behind, with the bar out of the hydrant case. The blood is in the floor still, under the wiping; the bar was in the pool.

"Then he was carried across to the Alhambra Court and laid under the gallery, to pass for a fall. But nobody has walked that gallery since June; the dust says so. And the door was locked, and a watchman who goes up unlocks it. And a man who falls twenty-five feet does not keep his palms as clean as a parson's.

"Only one man in this house can open a detector, Holmes, and set its clock: the man with the little brass key on his watch-chain. On Thursday morning, for the first time in six years, he sent his clerk out of the room while he did it. The same man carries the master key to the hydrant cases on the same chain. He told Hopkins he left his office at twenty-five past ten, and spoke to Wicks on his way; Wicks saw nobody. He reached the barrier at twenty to eleven, running, and made the collector note the time for him. From the north end to the barrier is nine minutes. He had them, and one to spare.

"And Pike had found him out. Thirty thousand nine hundred people through the turnstiles on Thursday, and twenty-seven thousand eight hundred on the board, certified, B. Lusk. Pike was going to the Secretary in the morning. Lusk said he would make it right with him; and when Pike would not take it, he did."

Holmes was silent a long moment, looking up at the clock.

"It is the vice of the clever criminal, Watson," he said at last, "that he will always do one thing too many. Had Mr Lusk simply struck the man down and gone home, he might have been one of thirty thousand. He would have an alibi, and a perfect one, and he went to some trouble for it; and it is the only thing in the whole affair that points at him." He stood up and stretched. "Hopkins is asleep on a stretcher in the ambulance room. Let us wake him."

Lusk was taken at his house at Clapham at seven that morning, in his dressing-gown. He fought the case to the end, and his counsel made a great deal of the turnstiles. But the dial book of the Crystal Palace Company was produced at the Old Bailey, and the gate book, with the knife marks in it, and little Mr Pidgeon in his best coat; and Pike's notebook was read to the jury, line by line, in his own square hand. The Company found some eleven hundred pounds wanting when the books were gone through. Abel Crouch walks his rounds alone now, and keys Number One at five past ten, and has nobody to take snuff with.
"""

[endings.lusk_walks]
title = "Twenty to Eleven"
text = """
I gave Holmes my account, and the name in it, and he heard me out with his eyes on the clock.

"The man is right, Watson," he said. "But you have not broken his alibi. You have only quarrelled with it. Pike's dial has him alive at twenty to eleven, and the collector has Lusk at the barrier at the same minute, and your account leaves it so. Any counsel would ask the jury how a man can be in two places at once, and the jury would not know."

Hopkins took Lusk's statement again, and Lusk gave it again, word for word, and sent his compliments to Mr Holmes. The inquest found that Daniel Pike died by a fall. In the spring the Crystal Palace Company's accounts were examined, and Mr Lusk resigned his post for reasons of health and went to live at Brighton.
"""

[endings.accident]
title = "Found Dead"
text = """
"He fell," I said. "An old man, alone, in the dark."

Holmes said nothing at all, and that was worse than anything he could have said.

The inquest at Norwood found that Daniel Pike died by misadventure, having fallen from the gallery of the Alhambra Court in the course of his duty. The Company paid for the funeral. Mr Lusk sent a wreath, a very large one. Crouch did not go to the inquest; he said he had nothing to say that anyone wanted to hear.
"""

[endings.thief]
title = "One of Thirty Thousand"
text = """
"A thief," I said. "Hidden in the courts at closing, as Hopkins says. Pike came on him, and he struck him down and got away."

"Got away where, Watson?" said Holmes gently. "With a hydrant bar from a locked case? Having first wiped the floor?" But Hopkins's superintendent was very well pleased with it.

Half the sneak-thieves in South London were taken up and let go again that autumn. The case was never closed. Mr Lusk, I understand, gave evidence of the greatest helpfulness, and the attendance board went on being a tenth lower than the turnstiles, until the Company's auditors noticed it two years later.
"""

[endings.kell_taken]
title = "A Quarter-Tone Flat"
text = """
"Kell," I said. "Pike had him fined, and he was in the building, and he heard it all, he says, and never went down."

"He never went down, Watson," said Holmes, "because he was forty feet up an organ, with the only stair in plain sight of the transept. And he told you the time of the murder to the minute. Murderers seldom do."

Hopkins took Kell to Norwood and kept him a night, and let him go in the morning, and the Company, fearing scandal, dispensed with his services. The organ of the Handel orchestra is a quarter-tone flatter today than ever it was. The man who killed Daniel Pike certified the attendance figures the following Monday, as usual.
"""

[endings.hatch_taken]
title = "Words on the Terrace"
text = """
"Hatch," I said. "He and Pike had words."

"So they had," said Holmes, "on Wednesday, over a frame; and on Thursday night he was on the terrace with a dozen of his men and two of the Company's firemen, from the end of his show until a quarter to eleven, and not one of them out of the others' sight. Words are cheap, Watson. So, I am afraid, was that."

Hopkins would not take the information, and Mr Brock, when he heard of it, wrote a letter to the Company that I am told was framed. The inquest found misadventure.
"""

[endings.crouch_taken]
title = "Eight Years"
text = """
"Crouch," I said. "He found him. Who else knew the round so well?"

Holmes looked at me as if I had struck him. "His own dial puts him at the far end of the house from ten o'clock to eleven, Watson, station after station, and he came back for his tea and waited half an hour for his friend. I had hoped for better."

Crouch was held for two days, and released, and went back to his rounds; but he would not speak to me afterwards, and I do not blame him. The inquest found misadventure.
"""

[endings.wicks_taken]
title = "Night Lights"
text = """
"Wicks," I said. "He was alone, and nobody can speak for him."

"Nor for half the men in London," said Holmes. "He was in the cellar at the far end of the house with his valve-wheels, putting the gas down to the minute, and his book shows it. What reason had he?" I had none.

Hopkins would not act on it, and the inquest found misadventure. Wicks puts the night lights down at half past ten still, by the transept clock.
"""

