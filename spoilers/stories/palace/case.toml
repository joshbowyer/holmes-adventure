# ================================================================ clues

[clues.found]
text = "Hopkins's wire: Daniel Pike, night-watchman at the Crystal Palace, found dead at 11:50 on Thursday night (fireworks night) in the Alhambra Court, under the gallery, skull broken, by the other watchman, Abel Crouch. The police surgeon says he fell."

[clues.walk_time]
text = "Holmes has walked it: from the north end of the Palace to the south transept is six minutes at a smart pace, and down the colonnade to the Low Level barrier three more."

[clues.attendance_board]
text = "The attendance board in the centre transept: Thursday (fireworks), 27,840 persons. Certified by B. Lusk, Superintendent."

[clues.key_register]
text = "The key register: 1 Centre Transept, 2 South Nave, 3 Terrace Doors, 4 Byzantine Court, 5 Tropical Department, 6 Colonnade Stair, 7 Pompeian Court, 8 Picture Gallery, 9 North End Screen, 10 Sculpture Gallery, 11 South Transept, 12 Egyptian Court, 13 Concert Room, 14 Theatre, 15 Alhambra Gallery, 16 Refreshment Rooms."

[clues.round_card]
text = "The order of the rounds, each beginning and ending at Station 1. North round: 1, 4, 12, 9, 7, 15, 8, 10, 1. South round: 1, 2, 11, 6, 14, 13, 16, 5, 3, 1. Tea together in the watch-house after the first round."

[clues.watch_rules]
text = "The watchmen's rules: lanterns lit when the gas is reduced, not before. Gallery stair doors unlocked going up, locked behind on the way down, never left open."

[clues.pike_notebook]
text = "Pike's private notebook, since July: each night the turnstile counters as he read them, and the next day's attendance board, always about a tenth lower. Thursday: counters 30,912. 'Told Mr L. today I go to the Secretary Friday. He says I am mistook, and he will make it right with me. Shan't take it.'"

[clues.gate_book]
text = "The gate book, all in Lusk's hand: Thursday's turnstile total 27,840. Through the summer the paper under many of the figures is rough, as if scraped with a knife."

[clues.lusk_keys]
text = "Lusk's watch-chain carries two keys: a little barrel-shaped brass one and a steel one with a three-cornered bow."

[clues.lusk_story]
text = "Lusk's account: left his office about 10:25; spoke to Wicks at the meter house about the night lights; walked the colonnade; took the 10:42 to Victoria; home at Clapham by 11:30."

[clues.lusk_figures]
text = "Lusk on the gate figures: the counters 'overrun' in a crowd, and he corrects the totals each morning by the check-takers' returns. He says he explained this to Pike on Thursday."

[clues.lusk_set_detector]
text = "Hopkins: on Friday at 8 a.m. Lusk opened Pike's detector for him, gave him the dial, and wound the clock and set it right, 'for it was all anyhow'."

[clues.pidgeon_thursday]
text = "Pidgeon: every morning at seven Lusk opens the detectors with the little brass barrel key on his chain, and Pidgeon reads him the transept clock to set them by. On Thursday morning, alone of all mornings in six years, Lusk sent him to the stores first, and when he came back ten minutes later the clocks were set."

[clues.detector_rules]
text = "Rules for the time detectors: opened only by the Superintendent, who keeps the key and parts with it to no one; each morning at seven, in the time-clerk's presence, he takes out the dials, fits fresh ones, winds the clocks and sets them by the transept clock."

[clues.crouch_dial]
text = "Crouch's dial for Thursday: 1 at 10:05; 2 at 10:11; 11 at 10:17; 6 at 10:22; 14 at 10:31; 13 at 10:37; 16 at 10:44; 5 at 10:52; 3 at 10:58; 1 at 11:04; 1 at 11:41."

[clues.pike_dial]
text = "Pike's dial for Thursday, from his detector: 1 at 10:15; 4 at 10:20; 12 at 10:26; 9 at 10:32; 7 at 10:40. Nothing after."

[clues.surgeon]
text = "The police surgeon, Dr Ord: Pike fell from the gallery and broke his skull on the lip of the fountain basin; death about eleven. He did not stay long."

[clues.hopkins_theory]
text = "Hopkins's theory: accident, or a sneak-thief from the fireworks crowd hidden in the courts at closing, whom Pike came upon. Somebody tried the jeweller's shutter in the south nave that night."

[clues.wound]
text = "Pike's wound: a single blow from behind, a little left: a straight narrow dent four inches long ending in a deeper square-cornered mark the size of the end of a thumb, as from the head of an iron bar. No other injury. His collar is soaked, his coat hardly marked."

[clues.hands]
text = "Pike's hands: palms unmarked, wrists sound. A man falling twenty-five feet throws out his hands and breaks or grazes them. He did not fall; he was struck from behind and dropped."

[clues.lantern_unlit]
text = "Pike's lantern: full of oil, the wick new-trimmed and white, never lit; no soot at all. Wherever he died, he had not yet lit it."

[clues.crouch_night]
text = "Crouch: came back from his south round to the watch-house at eleven for tea; Pike never came. At half past he went north after him, and at 11:50 found him by the Alhambra fountain, his lantern on his belt."

[clues.bone_to_pick]
text = "Crouch: on Thursday Pike said, 'Abel, I've a bone to pick with the Super, and tomorrow I'll pick it.'"

[clues.together]
text = "Crouch: every night at 10:05 he and Pike meet at Station 1, the centre transept, and key their clocks there together, one after the other, and Pike gives him a pinch of snuff. Thursday as always."

[clues.crouch_dark]
text = "Crouch: the watchmen light their lanterns when the gas goes down at half past ten, not before; and the key-boxes in the courts cannot be found in the dark without one."

[clues.gallery_locked]
text = "Crouch: when he came into the Alhambra Court on Thursday night the gallery stair door was locked. A watchman unlocks it going up and locks it coming down."

[clues.kell_heard]
text = "Kell, the organ tuner: he counted the half-hour striking on the transept clock on Thursday, and just after, not a minute after, heard a short cry from the north, in the courts, and a heavy fall."

[clues.kell_fined]
text = "Kell: Pike reported him a fortnight ago for smoking a pipe in the organ loft, and the Company fined him five shillings."

[clues.clock_true]
text = "Kell: the transept clock is set every morning by the Greenwich signal over the telegraph, and keeps true time; only its chime is flat."

[clues.gas_book]
text = "The gas book for Thursday: night lights by the transept clock from 10:30: South Nave 10:30, Centre 10:31, North Nave and Courts 10:33, Galleries 10:34, all done 10:35."

[clues.wicks_alone]
text = "Wicks: he was alone at the meter house from 10:25 to 10:40 on Thursday; nobody came down. The Superintendent never comes there."

[clues.sayer_saw]
text = "Sayer, the collector: at his barrier from 10:20. Lusk came through at 10:40 by the station clock, not before, out of breath and sweating as if he had run the colonnade, asked whether the clock was right, repeated 'twenty to eleven' as though noting it, and took the 10:42."

[clues.train_times]
text = "Sayer: trains to Victoria every twenty minutes on a fireworks night (10:22, 10:42, 11:02 ...); the station clock is set by the telegraph each morning."

[clues.firing_times]
text = "Hatch: Thursday's display began at 9:00, the set piece lit at 9:32, the last bombardment ended at 9:41."

[clues.hatch_watch]
text = "Hatch: from 9:45 to 10:45 he, his men and the firemen Rudd and Gill walked the grounds for sparks, all in each other's sight; none of them went inside."

[clues.hatch_quarrel]
text = "Hatch had words with Pike on Wednesday over a frame left on the terrace walk."

[clues.rudd_cases]
text = "Rudd: every hydrant case was right at 9:30 on Thursday. At 7:00 on Friday the Pompeian case was shut and locked, glass whole, the bar gone. It was opened with a key."

[clues.hydrant_keys]
text = "Rudd: only two keys open the hydrant cases: the fire station's, which never left their hooks (Bowles kept the station all night), and the Superintendent's master key, steel with a three-cornered bow, on his chain."

[clues.fire_log]
text = "The fire log: Thursday 9:30 cases correct; 9:45 to 10:45 grounds watched by Rudd and Gill; Bowles kept the station; 11:55 rattle, Rudd attended. Friday 7:00 Pompeian case shut, glass whole, bar missing."

[clues.hydrant_case]
text = "The hydrant case in the Pompeian Court: glass whole, lock shut, and the hooks for the hydrant bar empty."

[clues.bar_found]
text = "The hydrant bar, found in the impluvium of the Pompeian Court, washed clean: three feet of iron with a square-cornered socket head the size of the end of a thumb."

[clues.pompeian_blood]
text = "The Pompeian Court: the mosaic between the pool and the hydrant case has been wiped lately, but there is blood in the joints of the stones, in a patch the size of a dinner plate."

[clues.alhambra_stain]
text = "Where Pike lay in the Alhambra Court there is a stain no bigger than a saucer. He did his bleeding somewhere else."

[clues.gallery_dust]
text = "The Alhambra gallery: the summer's dust lies thick and unbroken on the walk and on the rail; no footprints but mine. Key-box 15 is furred with dust. Nobody has been up there for weeks."

[clues.shutter]
text = "The jeweller's stall in the south nave: fresh scratches round the padlock-hasp, but the padlock held."

[clues.colonnade_board]
text = "The colonnade board: 'Three minutes' walk' from the south transept to the Low Level station."

