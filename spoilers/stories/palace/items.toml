# ================================================================ the Pompeian court

[items.frescoes]
name = "painted walls"
aliases = ["walls", "frescoes", "figures", "garlands", "rooms", "paintings"]
location = "pompeian_court"
scenery = true
description = "Red and yellow and black, with dancing girls and birds and little gods floating on nothing, copied from the houses dug out at Pompeii. The little rooms off the atrium were furnished with copies of bronze lamps and couches."

[items.impluvium]
name = "impluvium"
aliases = ["pool", "basin", "marble pool", "water"]
location = "pompeian_court"
scenery = true
container = true
description = "A shallow square pool sunk in the floor, lined with marble and a foot of still black water."
details = [ { when = "loc:hydrant_bar:impluvium", text = "I turned my lantern on the water, and saw on the bottom, close under the near edge, a long dark shape that was not marble: an iron bar." } ]

[items.hydrant_bar]
name = "hydrant bar"
aliases = ["bar", "iron bar", "hydrant key", "t-bar"]
location = "impluvium"
clue = "bar_found"
description = "An iron bar near three feet long, with a cross-piece at one end for the hands and, at the other, a square-cornered socket head, made to turn the valve of a fire hydrant. It had lain in the water long enough to be washed quite clean. The square head was about the size of the end of my thumb."
take_text = "I rolled back my sleeve and lifted the bar out of the pool. It was heavy."

[items.peristyle]
name = "peristyle"
aliases = ["columns", "pillars", "garden", "garden court", "little garden"]
location = "pompeian_court"
scenery = true
description = "Beyond the pool, a little colonnaded garden, with painted pillars and plaster shrubs. Between the pillars it was very dark; a man could stand there unseen by anyone in the atrium, if he kept still."

[items.mosaic]
name = "mosaic"
aliases = ["floor", "mosaic floor", "dog", "tesserae", "chained dog", "joints"]
location = "pompeian_court"
scenery = true
clue = "pompeian_blood"
description = "Black and white tesserae, with the chained dog snarling at the threshold. I went over the floor with my lantern close. Between the pool and the hydrant case it had been wiped, and lately: it was cleaner there than anywhere else. But a wiped floor is not a scrubbed one. In the joints between the little stones, in a patch the size of a dinner plate, there was a rusty brown that I had seen too often to mistake. It was blood."

[items.hydrant_case]
name = "hydrant case"
aliases = ["case", "fire-hydrant case", "fire hydrant case", "hydrant", "glass case", "glass-fronted case"]
location = "pompeian_court"
scenery = true
clue = "hydrant_case"
description = "A glass-fronted cupboard painted red, lettered FIRE HYDRANT, with a coiled hose in it and the brass valve of the hydrant below. Beside the hose were two iron hooks for the hydrant bar, and the hooks were empty. The glass was whole; the little lock was shut. Whoever had taken the bar had opened the case with a key, and locked it after."

[items.key_box_7]
