description = "A fine desk, very tidy. Nothing lay on it but the gate book, an inkstand and a blotter."

[items.bookcase]
name = "bookcase"
aliases = ["reports", "bound reports"]
location = "superintendent_office"
scenery = true
description = "The Company's annual reports, bound in green calf, back to 1854. The later volumes were very much thinner than the early ones."

[items.palace_plan]
name = "plan"
aliases = ["framed plan", "great plan", "map", "plan of the palace"]
location = "superintendent_office"
scenery = true
description = "A great engraved plan of the Palace and its grounds. The building ran north and south a third of a mile, from the burnt north end to the south transept, and the colonnade went down from the south transept to the Low Level station. Somebody had pencilled times along the margin: 'N. end to S. transept, 6 min. Colonnade, 3 min.'"

[items.gate_book]
name = "gate book"
aliases = ["ledger", "long ledger", "book", "gate-book"]
location = "superintendent_office"
scenery = true
clue = "gate_book"
description = "The Company's gate book: for every day, the reading of every turnstile, totalled, and the takings. The figures were all in one neat hand, and signed B. L. On Thursday's line the total was 27,840. Here and there through the summer, if I tilted the page to my lantern, the paper was a little rough under the figures, as if a knife had been at it."

# ================================================================ the time office

[items.time_desk]
name = "high desk"
aliases = ["desk", "stool", "pigeon-holes", "pigeonholes"]
location = "time_office"
scenery = true
description = "A clerk's high desk and stool, and pigeon-holes up to the ceiling, every one labelled."

[items.dial_book]
name = "dial book"
aliases = ["book", "flat book", "dials", "dial-book"]
location = "time_office"
scenery = true
container = true
description = "A big flat book with cardboard leaves, one leaf to a night, and on each leaf two paper discs pinned side by side: the watchmen's dials, taken out of their clocks each morning."
details = [ { when = "loc:crouch_dial:dial_book", text = "On the leaf for Thursday night only one dial was pinned, Crouch's, with his name pencilled under it; the place beside it, where Pike's should have been, was empty." } ]

[items.crouch_dial]
name = "Crouch's dial"
aliases = ["dial", "crouch's dial", "paper dial", "disc"]
location = "dial_book"
clue = "crouch_dial"
description = """
A disc of stiff paper, ruled round its edge in hours and minutes. Round the rim, where the station keys had stamped it, ran little punched figures, each against its time. Pencilled under it: 'A. Crouch, Thurs. 12th.'

1 at 10:05. 2 at 10:11. 11 at 10:17. 6 at 10:22. 14 at 10:31. 13 at 10:37. 16 at 10:44. 5 at 10:52. 3 at 10:58. 1 at 11:04. 1 at 11:41.

Nothing after that.
"""

[items.dials_box]
name = "box of dials"
aliases = ["fresh dials", "box of fresh dials", "shelf", "dials box"]
location = "time_office"
scenery = true
description = "A pasteboard box of blank paper dials, a gross to the box, from the makers in Clerkenwell."

[items.detector_rules]
name = "rules for the time detectors"
aliases = ["rules", "card", "framed card", "detector rules", "rules card"]
location = "time_office"
scenery = true
clue = "detector_rules"
description = """
A framed card:

RULES FOR THE TIME DETECTORS. The detectors are to be opened only by the Superintendent, who shall keep the key in his own possession and part with it to no person. Each morning at seven the Superintendent shall open the detectors in the presence of the time-clerk, remove the dials, fit fresh dials, wind the clocks, and set them by the transept clock. The time-clerk shall enter the dials.
"""

# ================================================================ the ambulance room

[items.pike_body]
name = "body"
aliases = ["pike", "daniel pike", "dead man", "corpse", "sheet", "head", "wound"]
location = "ambulance_room"
scenery = true
clue = "wound"
description = "I turned back the sheet. Daniel Pike was a small, wiry, grizzled man with a soldier's moustache. He had been killed by a single blow at the back of the head, a little to the left: a straight, narrow depression of the skull some four inches long, ending below in a deeper mark with square corners, no bigger than the end of my thumb, as if from the head of an iron bar. There was no other injury on him that I could find. His collar was stiff with blood, but his coat below it hardly marked. I looked next at his hands."

[items.pike_hands]
name = "hands"
aliases = ["his hands", "palms", "pike's hands", "knuckles", "wrists"]
location = "ambulance_room"
scenery = true
clue = "hands"
description = "Hard, horny, clean old hands, the palms unmarked: not a graze, not a bruise, the wrists sound. A man who falls twenty-five feet on to tiles throws out his hands as surely as he breathes, and breaks a wrist or an arm or a collarbone, and grazes his palms to the bone. This man had fallen nowhere. He had been struck down from behind, and dropped where he stood."

[items.ambulance_things]
name = "stretcher"
aliases = ["cupboard", "splints", "bandages", "trestles", "trestle tables", "tables"]
location = "ambulance_room"
scenery = true
description = "The things of a fête-day ambulance: a stretcher, splints, lint, sal volatile, all very clean."

[items.pike_lantern]
name = "Pike's lantern"
aliases = ["pike's lantern", "his lantern", "dead man's lantern", "lantern"]
location = "ambulance_room"
clue = "lantern_unlit"
description = "Pike's bull's-eye, the fellow of mine. I opened it. The reservoir was full to the brim. The wick was new-trimmed, square and white, and had never been lit; there was not a speck of soot on the chimney or the glass. Wherever Daniel Pike had been when he died, he had not yet lit his lantern."
cant_take = "Hopkins put out a hand. \"I'll keep that with his things, Doctor, if you don't mind.\""

[items.pike_keys]
name = "Pike's keys"
aliases = ["keys", "key", "bunch of keys", "his keys", "pike's keys", "pike's key", "bunch"]
location = "ambulance_room"
description = "A heavy bunch of keys on a steel ring: the long key of the screen door at the north end, the watch-house key, and a little one that looked as if it belonged to a locker. The gallery keys, I supposed, had gone to Crouch."
take_text = "I took up Pike's keys. Hopkins nodded. \"Bring them back, that's all.\""

[items.snuff_box]
name = "snuff-box"
aliases = ["snuff box", "snuffbox", "snuff", "box"]
location = "ambulance_room"
scenery = true
description = "A round horn snuff-box with a silver lid, engraved 'D. Pike, R.A., from the Battery, 1879'."

[items.pike_whistle]
name = "whistle"
aliases = ["rattle", "his whistle"]
location = "ambulance_room"
scenery = true
description = "A police-pattern whistle on a chain. It had not been blown; there was dust in the mouth of it."

[items.pike_dial]
name = "Pike's dial"
aliases = ["pike's dial", "dial", "paper dial", "disc", "his dial"]
location = "nowhere"
clue = "pike_dial"
description = """
A disc of stiff paper, like Crouch's, ruled in hours. Pencilled across the back, in Hopkins's hand: 'From D. Pike's detector, opened by Mr Lusk in my presence, Fri. 8 a.m. S.H.' Round the rim, the stations, each against its time:

1 at 10:15. 4 at 10:20. 12 at 10:26. 9 at 10:32. 7 at 10:40.

After that, nothing.
"""

# ================================================================ the meter house

[items.meters]
name = "meters"
aliases = ["meter", "iron meters", "valves", "valve-wheels", "wheels", "valve wheels", "dials"]
location = "meter_house"
scenery = true
description = "Great iron meters, and a row of valve-wheels as big as cart-wheels, each lettered with its part of the house: SOUTH NAVE; CENTRE; NORTH NAVE AND COURTS; TERRACE; GALLERIES. Over each a little dial showed its pressure."

[items.gas_book]
name = "gas book"
aliases = ["book", "desk", "sloping desk", "gas-book"]
location = "meter_house"
scenery = true
clue = "gas_book"
description = """
The gasman's book, in pencil. Thursday's entry:

'12th. Fireworks. Terrace off 9:00, on 9:45. Night lights by transept clock 10:30: South Nave 10:30, Centre 10:31, North Nave and Courts 10:33, Galleries 10:34, all done 10:35. J.W.'

Every night of the week was the same, to the minute, but for Thursday's terrace.
"""

