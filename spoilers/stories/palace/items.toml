# ================================================================ the centre transept

[items.vault]
name = "glass vault"
aliases = ["vault", "glass", "roof", "panes", "glass roof"]
location = "centre_transept"
scenery = true
description = "Rib upon iron rib, pane upon pane, up and up into the dark. A few stars showed through it. It is a strange thing to stand at night in a building that is nearly all window."

[items.night_lights]
name = "night lights"
aliases = ["gas", "night light", "lights", "beads", "flames", "gas jets"]
location = "centre_transept"
scenery = true
description = "Every twentieth jet along the nave had been left burning, turned down to a bead of blue flame no bigger than a pea, enough to show a man the shape of the floor and no more."

[items.crystal_fountain]
name = "Crystal Fountain"
aliases = ["fountain", "crystal fountain", "glass fountain", "basin", "tree of glass"]
location = "centre_transept"
scenery = true
container = true
description = "Osler's great fountain of glass, a branching tree of crystal twenty-seven feet high, in a wide shallow basin. It does not play at night. The trippers throw coins into the basin for luck, and the Company's men rake them out on Mondays."
details = [ { when = "loc:coin_fountain:crystal_fountain", text = "Among the leaves and orange-peel at the bottom of the basin, near the rim, something silver caught the light: a sixpence." } ]

[items.coin_fountain]
name = "sixpence"
aliases = ["coin", "silver", "silver sixpence", "sixpence"]
location = "crystal_fountain"
coin = true
description = "A wet sixpence with the old Queen's young head on it, rubbed almost smooth."
take_text = "I fished the sixpence out of the basin and dried it on my handkerchief."

[items.orchestra]
name = "Handel orchestra"
aliases = ["orchestra", "tiers", "benches", "handel orchestra", "empty benches"]
location = "centre_transept"
scenery = true
container = true
description = "Tier upon tier of benches, rising in a great fan, where four thousand singers sit for the Handel Festival. Tonight they were empty to the last row."
details = [ { when = "loc:coin_orchestra:orchestra", text = "On the lowest bench, where some chorister had sat in a puddle of summer dust, a sixpence lay forgotten." } ]

[items.coin_orchestra]
name = "sixpence"
aliases = ["coin", "silver", "silver sixpence", "sixpence"]
location = "orchestra"
coin = true
description = "A sixpence, dusty."
take_text = "I took the sixpence from the bench."

[items.organ_front]
name = "organ"
aliases = ["organ pipes", "gilt pipes", "front pipes", "great organ"]
location = "centre_transept"
scenery = true
description = "The great organ of the Handel orchestra, its gilt front pipes rising like the pillars of a temple. A faint candle-light moved behind them: someone was up there."

[items.transept_clock]
name = "transept clock"
aliases = ["clock", "face", "white face", "great clock", "palace clock"]
location = "centre_transept"
scenery = true
description = "A great clock with a white glass face lit from behind, hung over the organ so that the whole transept may see it. It chimes the quarters, and strikes the hours on a bell deep enough to be heard in the furthest court. By it, I knew, the Palace kept its time, and the gasmen and watchmen theirs."

[items.attendance_board]
name = "attendance board"
aliases = ["board", "easel", "attendance"]
location = "centre_transept"
scenery = true
clue = "attendance_board"
description = "A black board on an easel, painted in white: CRYSTAL PALACE. ATTENDANCE. Below, in chalk, the figures of the week: Monday 4,112; Tuesday 3,870; Wednesday 4,406; Thursday (Fireworks) 27,840; Friday, not yet entered. At the foot: 'Certified, B. Lusk, Superintendent.'"

[items.key_box_1]
name = "key-box"
aliases = ["key box", "box", "keybox", "watchmen's key-box", "pier", "iron pier"]
location = "centre_transept"
scenery = true
description = "A small iron box bolted to the pier at the height of a man's chest, with a hinged lid. Inside, on a short chain, hung a steel key with a curious toothed end, stamped with the figure 1. The number was painted on the lid as well."

# ================================================================ the organ loft

[items.console]
name = "console"
aliases = ["keyboards", "stops", "candle-lamp", "candle lamp", "manuals"]
location = "organ_loft"
scenery = true
description = "Four keyboards, one above another, yellow as old teeth, and banks of ivory stop-knobs on either side with names on them in black letter. A candle-lamp stood on the music desk, among a litter of tuning cones and a tuner's notebook."

[items.loft_pipes]
name = "pipes"
aliases = ["regiment", "ranks", "wood pipes", "metal pipes", "lesser pipes"]
location = "organ_loft"
scenery = true
description = "Hundreds of pipes, from great wooden boxes I could have crawled into to little metal ones no bigger than a pencil, each in its place in its rank."

[items.loft_rail]
name = "rail"
aliases = ["front", "view", "nave", "edge"]
location = "organ_loft"
scenery = true
description = "From the rail I could look down the whole length of the house, a third of a mile of it, and see the night lights dwindle away north and south. I could see the dark mouths of the courts along the nave; what was in them, I could not see at all."

# ================================================================ the watch-house

[items.range]
name = "range"
aliases = ["fire", "kettle", "tea", "teapot"]
location = "watch_house"
scenery = true
description = "A little black range, very hot, with a kettle singing on it and a brown teapot keeping warm on the hob. Two mugs stood ready on the shelf above."

[items.lockers]
name = "lockers"
aliases = ["row of lockers", "painted lockers", "crouch's locker", "cards", "names"]
location = "watch_house"
scenery = true
description = "A row of tall green lockers with name-cards in brass frames: A. CROUCH; D. PIKE; and two spare. Crouch's stood open, with his coat and his tea-tin in it. Pike's locker was shut and locked."

[items.pike_locker]
name = "Pike's locker"
aliases = ["locker", "pike's locker", "his locker", "d pike"]
location = "watch_house"
scenery = true
container = true
openable = true
description = "Pike's locker: a tall green tin cupboard with D. PIKE on its card, and a stout lock."
open_text = "The smallest key on Pike's bunch turned the lock, and the door swung open."
details = [ { when = ["open:pike_locker", "loc:pike_notebook:pike_locker"], text = "Inside hung a greatcoat and a spare cap, and on the shelf, tucked behind a tin of tobacco, lay a little black notebook." } ]

[items.pike_notebook]
name = "Pike's notebook"
aliases = ["notebook", "black notebook", "little black notebook", "pike's notebook", "his notebook"]
location = "pike_locker"
clue = "pike_notebook"
description = """
A little black notebook in a careful, square, old soldier's hand. Page after page ran the same way, one line a night since the middle of July: the date; the total of the turnstile counters as Pike had read them at closing; and, copied beside it, the figure posted next day on the attendance board. Every night the board was lower, by a tenth or near it. The last entry read:

'Thurs. 12th. Fireworks. Counters 30,912. (Board tomorrow will say what he likes.) Told Mr L. today I go to the Secretary Friday. He says I am mistook, and he will make it right with me. Shan't take it.'
"""

[items.lanterns_shelf]
name = "shelf of lanterns"
aliases = ["shelf", "lanterns", "bull's-eye lanterns", "bull's-eyes"]
location = "watch_house"
scenery = true
description = "A shelf of bull's-eye lanterns, polished like brass buttons, with their wicks trimmed. The watchmen light them when the gas goes down."

[items.lantern]
name = "lantern"
aliases = ["bull's-eye", "bull's eye", "bullseye", "my lantern", "light"]
location = "watch_house"
description = "A bull's-eye lantern, burning steadily. The shutter slid round to darken it."
take_text = "I took a bull's-eye from the shelf and lit it at the range."

[items.key_register]
name = "key register"
aliases = ["register", "framed register", "key-register"]
location = "watch_house"
scenery = true
clue = "key_register"
description = """
A framed list, in copperplate:

THE WATCHMEN'S STATIONS
1 Centre Transept. 2 South Nave. 3 Terrace Doors. 4 Byzantine Court. 5 Tropical Department. 6 Colonnade Stair. 7 Pompeian Court. 8 Picture Gallery. 9 North End Screen. 10 Sculpture Gallery. 11 South Transept. 12 Egyptian Court. 13 Concert Room. 14 Theatre. 15 Alhambra Gallery. 16 Refreshment Rooms.
"""

[items.round_card]
name = "order of the rounds"
aliases = ["rounds", "round card", "order", "card", "printed card", "order of rounds"]
location = "watch_house"
scenery = true
clue = "round_card"
description = """
A printed card:

ORDER OF THE ROUNDS. Each round begins and ends at Station 1.
NORTH ROUND: 1, 4, 12, 9, 7, 15, 8, 10, 1.
SOUTH ROUND: 1, 2, 11, 6, 14, 13, 16, 5, 3, 1.
The watchmen shall take their refreshment together in the watch-house after the first round, and not elsewhere.
"""

[items.rules_card]
name = "watchmen's rules"
aliases = ["rules", "rules card", "watchmen's rules", "regulations"]
location = "watch_house"
scenery = true
clue = "watch_rules"
description = """
A printed card, fly-spotted:

RULES FOR THE WATCHMEN. Lanterns are to be lighted when the gas is reduced, and not before. The doors of the gallery stairs are to be unlocked by the watchman on his way up, and locked behind him on his way down, and on no account left open. A watchman finding anything amiss shall spring his rattle.
"""

