description = """
The fire station's log, in a fair round hand. For Thursday:

'9:30. All hydrant cases in the building examined, Rudd. Correct. 9:45 to 10:45, grounds watched for fires after the display, Rudd, Gill. One frame alight on No. 2 terrace, put out. Station kept by Bowles throughout. 11:55, watchman's rattle in north nave; Rudd attended.'

