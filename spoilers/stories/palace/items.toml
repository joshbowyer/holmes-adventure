location = "pompeian_court"
scenery = true
description = "A watchmen's key-box inside the doorway, its key on its chain, stamped 7."

# ================================================================ the Alhambra court

[items.alhambra_arches]
name = "arches"
aliases = ["columns", "arcade", "paired columns", "arch"]
location = "alhambra_court"
scenery = true
description = "Slender columns in pairs, holding up arches cut as fine as paper and painted blue and red and gold. Lovely by day, I daresay; by a bull's-eye at night they made a forest of shadows."

[items.lion_fountain]
name = "fountain"
aliases = ["lion fountain", "lions", "basin", "stone lions", "fountain of lions"]
location = "alhambra_court"
scenery = true
description = "A round stone basin on the backs of a ring of little lions, rather like dogs. Dry. Its lip was of plain stone, and on it I could see no mark of anything."

[items.gallery_above]
name = "gallery"
aliases = ["iron gallery", "rail", "gallery rail", "above"]
location = "alhambra_court"
scenery = true
description = "The gallery ran twenty-five feet above the tiles, its rail a black line against the faint glass. A man who went over that rail would come down where the chalk ring was, near enough."

[items.chalk_ring]
name = "chalk ring"
aliases = ["chalk", "ring", "tiles", "stain", "mark", "where he lay"]
location = "alhambra_court"
scenery = true
clue = "alhambra_stain"
description = "The police had chalked round where Pike lay. Within the ring, where his head had been, was a stain on the tiles no bigger than a saucer, and that was all. I have seen a good many broken heads in my time. A scalp wound bleeds like a pig; this man had done his bleeding somewhere else."

[items.gallery_door]
name = "gallery stair door"
aliases = ["door", "narrow door", "stair door", "gallery door"]
location = "alhambra_court"
scenery = true
description = "A narrow iron door in the corner of the arcade, painted to look like part of it, with a stout lock. Behind it a stair went up to the gallery."

# ================================================================ the Alhambra gallery

[items.dust]
name = "dust"
aliases = ["floor", "plates", "rail", "ledges", "girders", "walk", "iron walk"]
location = "alhambra_gallery"
scenery = true
clue = "gallery_dust"
description = "I went along the walk slowly, holding my lantern low. The dust lay on the iron plates like grey felt, and in it were my own footprints and no others, not one, from the stair-head to the turn. The top of the rail was furred with it from end to end, unbroken. Nobody had climbed that rail, or leaned on it, or walked this gallery, for weeks."

[items.key_box_15]
name = "key-box"
aliases = ["key box", "box", "keybox", "watchmen's key-box", "stanchion"]
location = "alhambra_gallery"
scenery = true
description = "A watchmen's key-box on the stanchion at the turn, stamped 15. Dust lay thick on its lid, and when I lifted it the dust on the chain inside was as thick."

